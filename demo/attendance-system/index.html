<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbsenKu - PT Karya Sinergi</title>
<meta name="description" content="Demo aplikasi absensi karyawan AbsenKu untuk PT Karya Sinergi. Clock in/out, riwayat kehadiran, pengajuan izin dan cuti, serta dashboard admin dengan analitik kehadiran.">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1d29; --ink-soft:#565b70; --muted:#8b90a3; --line:#e4e6f0; --line-soft:#eef0f7;
  --surface:#ffffff; --bg:#f7f8fc; --bg-tint:#eef0fb;
  --navy:#141731; --primary:#3730a3; --primary-2:#4338ca; --primary-3:#6366f1;
  --primary-wash:#eef0fd; --primary-wash-2:#e0e3fb;
  --gold:#b8860b; --gold-soft:#d4a017; --gold-pale:#f7ecd0;
  --ok:#15803d; --ok-bg:#e9f7ee; --ok-soft:#22c55e;
  --warn:#b45309; --warn-bg:#fef3e2; --warn-soft:#f59e0b;
  --danger:#b91c1c; --danger-bg:#fdedec; --danger-soft:#ef4444;
  --info:#0369a1; --info-bg:#e6f4fb;
  --grad-primary:linear-gradient(135deg,var(--navy),var(--primary-2) 55%,var(--primary-3));
  --grad-gold:linear-gradient(135deg,#8a6a10,var(--gold-soft));
  --shadow-sm:0 2px 8px rgba(20,23,49,0.06);
  --shadow-md:0 8px 24px rgba(20,23,49,0.10);
  --shadow-lg:0 20px 48px rgba(20,23,49,0.16);
  --shadow-primary:0 10px 24px rgba(55,48,163,0.30);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Plus Jakarta Sans', sans-serif; background:var(--bg); color:var(--ink); margin:0; -webkit-font-smoothing:antialiased; }
.font-display { font-family:'Sora', sans-serif; }
::selection { background:var(--primary-wash-2); color:var(--navy); }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--primary-3); border-radius:4px; }
.ic { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:inline-block; vertical-align:middle; flex-shrink:0; }
.ic-primary { color:var(--primary); }
.ic-ok { color:var(--ok); }
.ic-warn { color:var(--warn); }
.ic-muted { color:var(--muted); }
.ic.spin { animation:icspin 1s linear infinite; }
@keyframes icspin { to { transform:rotate(360deg); } }

/* ---- layout helpers ---- */
.wrap { max-width:1180px; margin:0 auto; padding:0 20px; }
.card-surface { background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); }
.fade-in { animation:fadeIn 0.35s ease both; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

/* ---- buttons ---- */
.btn { display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:700;font-size:14px;border:none;cursor:pointer;border-radius:var(--r-md);padding:11px 20px;transition:transform 0.18s ease,box-shadow 0.18s ease,background 0.18s ease,color 0.18s ease,border-color 0.18s ease;white-space:nowrap; }
.btn:active { transform:translateY(1px); }
.btn:disabled { opacity:0.5;cursor:not-allowed;transform:none !important; }
.btn-primary { background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-primary); }
.btn-primary:hover:not(:disabled) { box-shadow:0 14px 30px rgba(55,48,163,0.4);transform:translateY(-1px); }
.btn-gold { background:var(--grad-gold);color:#fff;box-shadow:0 8px 22px rgba(184,134,11,0.32); }
.btn-gold:hover:not(:disabled) { box-shadow:0 12px 28px rgba(184,134,11,0.42);transform:translateY(-1px); }
.btn-danger { background:var(--danger-soft);color:#fff;box-shadow:0 8px 20px rgba(239,68,68,0.3); }
.btn-danger:hover:not(:disabled) { box-shadow:0 12px 26px rgba(239,68,68,0.4);transform:translateY(-1px); }
.btn-secondary { background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line); }
.btn-secondary:hover:not(:disabled) { border-color:var(--primary-3);color:var(--primary); }
.btn-ghost { background:transparent;color:var(--ink-soft);border:1.5px solid transparent; }
.btn-ghost:hover:not(:disabled) { background:var(--bg-tint);color:var(--primary); }
.btn-sm { padding:7px 14px;font-size:12.5px;border-radius:9px; }
.btn-block { width:100%; }
.btn-icon { width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-soft);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);transition:all 0.2s;padding:0;flex-shrink:0; }
.btn-icon:hover { border-color:var(--primary-3);color:var(--primary); }

/* ---- nav ---- */
.topbar { position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft); }
.tab-row { display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none; }
.tab-row::-webkit-scrollbar { display:none; }
.tab-group { display:flex;align-items:center;gap:2px;background:var(--bg-tint);border-radius:var(--r-pill);padding:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none; }
.tab-group::-webkit-scrollbar { display:none; }
.tab-btn { display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;color:var(--ink-soft);background:transparent;border:none;cursor:pointer;white-space:nowrap;transition:all 0.2s;font-family:inherit; }
.tab-btn:hover:not(.active) { color:var(--primary); }
.tab-btn.active { background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm); }
@media (max-width:900px) {
  .topbar-user-text { display:none; }
}
@media (max-width:640px) {
  .topbar-wordmark { display:none; }
  .topbar .tab-btn .tab-label { display:none; }
  .topbar .tab-btn { padding:8px 9px; }
}

/* ---- stat tiles ---- */
.stat-tile { background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden; }
.stat-tile::after { content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--grad-primary)); }
.stat-icon-badge { width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0; }

/* ---- badges & chips ---- */
.badge { display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;letter-spacing:0.01em; }
.badge-ok { background:var(--ok-bg);color:var(--ok); }
.badge-warn { background:var(--warn-bg);color:var(--warn); }
.badge-danger { background:var(--danger-bg);color:var(--danger); }
.badge-info { background:var(--info-bg);color:var(--info); }
.badge-muted { background:var(--bg-tint);color:var(--muted); }
.chip { display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--r-pill);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:all 0.2s;white-space:nowrap;font-family:inherit; }
.chip:hover:not(.active) { border-color:var(--primary-3);color:var(--primary); }
.chip.active { background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(55,48,163,0.3); }

/* ---- form controls ---- */
.inp { width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--surface);transition:border-color 0.2s,box-shadow 0.2s; }
.inp:focus { outline:none;border-color:var(--primary-3);box-shadow:0 0 0 3.5px var(--primary-wash-2); }
.inp::placeholder { color:var(--muted); }
label.lbl { font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px; }
.req-mark { color:var(--danger-soft);font-weight:700; }
.opt-mark { color:var(--muted);font-weight:500; }

/* ---- table ---- */
.tbl { width:100%;border-collapse:collapse;font-size:13.5px; }
.tbl th { text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap; }
.tbl td { padding:12px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink-soft);vertical-align:middle; }
.tbl tr:last-child td { border-bottom:none; }
.tbl tr:hover td { background:var(--bg-tint); }
.tbl-wrap { overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--line-soft); }

/* ---- avatar ---- */
.avatar { width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0; }

/* ---- clock card ---- */
.clock-card { background:var(--grad-primary);border-radius:24px;padding:28px 24px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg); }
.clock-card::before { content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,0.06);top:-120px;right:-80px; }
.clock-card::after { content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.05);bottom:-90px;left:-40px; }
.clock-digits { font-family:'Sora',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0.01em; }

/* ---- attendance status ring button ---- */
.punch-btn { width:100%;border:none;border-radius:18px;padding:18px;cursor:pointer;font-family:inherit;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.2s;box-shadow:0 10px 26px rgba(0,0,0,0.18); }
.punch-btn:active { transform:translateY(1px); }
.punch-btn:disabled { opacity:0.55;cursor:not-allowed; }

/* ---- modal ---- */
.modal-backdrop { position:fixed;inset:0;background:rgba(20,23,49,0.55);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn 0.2s ease; }
.modal-box { background:var(--surface);border-radius:var(--r-lg);max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg); }

/* ---- toast ---- */
#toast-wrap { position:fixed;bottom:22px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 36px); }
.toast { background:var(--navy);color:#fff;padding:13px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn 0.3s ease both;max-width:340px; }
.toast.ok { background:linear-gradient(135deg,#166534,#22c55e); }
.toast.warn { background:linear-gradient(135deg,#92400e,#f59e0b); }
.toast.err { background:linear-gradient(135deg,#991b1b,#ef4444); }
@keyframes toastIn { from{opacity:0;transform:translateX(24px);} to{opacity:1;transform:translateX(0);} }

/* ---- misc ---- */
.divider { height:1px;background:var(--line-soft);margin:18px 0; }
.scroll-x { overflow-x:auto; }
.progress-track { height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden; }
.progress-fill { height:100%;border-radius:99px;background:var(--grad-gold); }
.emp-row { display:flex;align-items:center;gap:12px; }

.split-grid { display:grid; gap:18px; }
@media (max-width:860px) {
  .split-grid { grid-template-columns:1fr !important; }
  .stat-grid-4 { grid-template-columns:repeat(3,1fr) !important; }
}
@media (max-width:640px) {
  .wrap { padding:0 14px; }
  .clock-digits { font-size:34px !important; }
  .stat-grid-4 { grid-template-columns:repeat(2,1fr) !important; }
}
@media (max-width:480px) {
  .tab-btn { padding:8px 12px;font-size:12px; }
}
html, body { overflow-x:hidden; max-width:100vw; }

/* ---- calendar grid ---- */
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-head { text-align:center; font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; padding-bottom:4px; }
.cal-cell { min-height:56px; border-radius:10px; padding:6px 7px; font-size:11px; background:var(--bg-tint); border:1px solid var(--line-soft); }
.cal-cell.empty { background:transparent; border-color:transparent; }
.cal-cell .cal-daynum { font-weight:800; font-size:12.5px; color:var(--ink); margin-bottom:3px; }
.cal-cell.st-hadir { background:var(--ok-bg); border-color:rgba(21,128,61,0.18); }
.cal-cell.st-telat { background:var(--warn-bg); border-color:rgba(180,83,9,0.18); }
.cal-cell.st-izin, .cal-cell.st-sakit, .cal-cell.st-cuti { background:var(--info-bg); border-color:rgba(3,105,161,0.18); }
.cal-cell.st-alpha { background:var(--danger-bg); border-color:rgba(185,28,28,0.18); }
.cal-cell.st-weekend { opacity:0.55; }

/* ---- search ---- */
.search-wrap { position:relative; width:150px; flex-shrink:0; }
.search-inp { width:100%; border:1.5px solid var(--line); border-radius:var(--r-pill); padding:8px 13px 8px 34px; font-size:12.5px; font-family:inherit; color:var(--ink); background:var(--surface); }
.search-inp:focus { outline:none; border-color:var(--primary-3); box-shadow:0 0 0 3.5px var(--primary-wash-2); }
.search-ic { position:absolute; left:11px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--muted); }
.search-results { position:absolute; top:calc(100% + 8px); right:0; width:290px; max-height:360px; overflow-y:auto; background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r-md); box-shadow:var(--shadow-lg); z-index:120; padding:6px; }
.search-result-row { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; cursor:pointer; text-align:left; width:100%; background:transparent; border:none; font-family:inherit; }
.search-result-row:hover { background:var(--bg-tint); }
@media (max-width:900px) { .search-wrap { display:none; } }

/* ---- topbar nav scroll affordance ---- */
.topbar-nav-wrap { position:relative; flex:1; min-width:0; }
.topbar-nav-sep { width:1px; align-self:stretch; background:var(--line); margin:0 4px; flex-shrink:0; }

/* ---- avatar color picker ---- */
.avatar-swatch { width:34px; height:34px; border-radius:50%; cursor:pointer; border:2.5px solid transparent; flex-shrink:0; }
.avatar-swatch.selected { border-color:var(--ink); }

@media print {
  .topbar, #toast-wrap, .no-print, .btn, .cal-grid ~ .btn { display:none !important; }
  body { background:#fff; }
  .card-surface { box-shadow:none !important; border:1px solid #ddd !important; }
  .wrap { max-width:100% !important; padding:0 !important; }
}
</style>
</head>

function fmtDateLong(d) { d = new Date(d); return HARI_ID[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN_ID[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDateShort(d) { d = new Date(d); return pad2(d.getDate()) + ' ' + BULAN_ID[d.getMonth()].slice(0,3) + ' ' + d.getFullYear(); }
function fmtDateISO(d) { d = new Date(d); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function fmtTime(d) { d = new Date(d); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
function fmtTimeShort(iso) { if (!iso) return '-'; var d = new Date(iso); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isWeekend(d) { var day = new Date(d).getDay(); return day === 0 || day === 6; }
function seededRand(seedStr) { var h = 0; for (var i=0;i<seedStr.length;i++) { h = (Math.imul(31,h) + seedStr.charCodeAt(i)) | 0; } var x = Math.sin(h) * 10000; return x - Math.floor(x); }

function hitungGaji(emp) {
  var pokok = GAJI_POKOK[emp.departemen] || 7000000;
  var ym = fmtDateISO(new Date()).slice(0,7);
  var recs = getAttendance().filter(function(a){ return a.employeeId === emp.id && a.tanggal.slice(0,7) === ym; });
  var telat = recs.filter(function(a){ return a.status === 'Telat'; }).length;
  var alpha = recs.filter(function(a){ return a.status === 'Alpha'; }).length;
  var potonganTelat = telat * POTONGAN_TELAT;
  var potonganAlpha = Math.round(pokok * POTONGAN_ALPHA_PCT) * alpha;
  var tunjanganTransport = 750000;
  var tunjanganMakan = 600000;
  var bruto = pokok + tunjanganTransport + tunjanganMakan;
  var potongan = potonganTelat + potonganAlpha;
  var bersih = bruto - potongan;
  return { pokok: pokok, tunjanganTransport: tunjanganTransport, tunjanganMakan: tunjanganMakan, bruto: bruto, telat: telat, alpha: alpha, potonganTelat: potonganTelat, potonganAlpha: potonganAlpha, potongan: potongan, bersih: bersih };
}

/* ============================= SEEDING ============================= */
function seedIfNeeded() {
  if (localStorage.getItem('absku_seeded_v1')) return;
  var attendance = [];
  var today = new Date();
  for (var e = 0; e < EMPLOYEES.length; e++) {
    var emp = EMPLOYEES[e];
    for (var back = 30; back >= 1; back--) {
      var day = addDays(today, -back);
      if (isWeekend(day)) continue;
      var iso = fmtDateISO(day);
      var r = seededRand(emp.id + iso);
      var status, jamMasuk, jamPulang, telat;
      if (r < 0.05) { status = 'Alpha'; jamMasuk = null; jamPulang = null; }
      else if (r < 0.09) { status = 'Sakit'; jamMasuk = null; jamPulang = null; }
      else if (r < 0.12) { status = 'Izin'; jamMasuk = null; jamPulang = null; }
      else if (r < 0.14) { status = 'Cuti'; jamMasuk = null; jamPulang = null; }
      else {
        var lateRoll = seededRand(emp.id + iso + 'L');
        var isLate = lateRoll < 0.16;
        status = isLate ? 'Telat' : 'Hadir';
        var mh = isLate ? (8) : (7);
        var mm = isLate ? (16 + Math.floor(lateRoll*400)%40) : (40 + Math.floor(lateRoll*300)%20);
        if (mm >= 60) { mm = mm % 60; mh += 1; }
        var mDate = new Date(day); mDate.setHours(mh, mm, Math.floor(r*50), 0);
        jamMasuk = mDate.toISOString();
        var ph = 17; var pm = Math.floor(seededRand(emp.id+iso+'P')*35);
        var pDate = new Date(day); pDate.setHours(ph, pm, 0, 0);
        jamPulang = pDate.toISOString();
      }
      attendance.push({ id: uid('ATT'), employeeId: emp.id, tanggal: iso, jamMasuk: jamMasuk, jamPulang: jamPulang, status: status, lokasi: jamMasuk ? 'Kantor Pusat' : null });
    }
    var todayIso = fmtDateISO(today);
    if (!isWeekend(today) && emp.id !== 'EMP01') {
      var tr = seededRand(emp.id + todayIso + 'T');
      if (tr > 0.15) {
        var isLateT = seededRand(emp.id+todayIso+'LT') < 0.18;
        var mh2 = isLateT ? 8 : 7;
        var mm2 = isLateT ? (17 + Math.floor(tr*200)%35) : (42 + Math.floor(tr*200)%18);
        var mDate2 = new Date(today); mDate2.setHours(mh2, mm2, 10, 0);
        attendance.push({ id: uid('ATT'), employeeId: emp.id, tanggal: todayIso, jamMasuk: mDate2.toISOString(), jamPulang: null, status: isLateT ? 'Telat' : 'Hadir', lokasi:'Kantor Pusat' });
      } else if (tr > 0.06) {
        attendance.push({ id: uid('ATT'), employeeId: emp.id, tanggal: todayIso, jamMasuk: null, jamPulang: null, status:'Izin', lokasi:null });
      }
    }
  }
  var leaves = [];
  var lv = function(empId, jenis, startOffset, endOffset, alasan, status, catatan) {
    var s = addDays(today, startOffset), en = addDays(today, endOffset);
    leaves.push({ id: uid('LV'), employeeId: empId, jenis: jenis, tanggalMulai: fmtDateISO(s), tanggalSelesai: fmtDateISO(en), alasan: alasan, status: status, catatanAdmin: catatan || '', diajukanPada: addDays(today, startOffset - 3).toISOString() });
  };
  lv('EMP02', 'Cuti', 5, 7, 'Menghadiri acara keluarga di luar kota.', 'Menunggu', '');
  lv('EMP06', 'Sakit', -1, 0, 'Demam dan perlu istirahat sesuai anjuran dokter.', 'Menunggu', '');
  lv('EMP03', 'Izin', 2, 2, 'Mengurus dokumen kependudukan di kantor kelurahan.', 'Menunggu', '');
  lv('EMP04', 'Cuti', -10, -8, 'Cuti tahunan, liburan bersama keluarga.', 'Disetujui', 'Disetujui, pastikan serah terima tugas sebelum cuti.');
  lv('EMP07', 'Izin', -6, -6, 'Menghadiri wisuda adik kandung.', 'Disetujui', 'Silakan, jangan lupa isi form kehadiran susulan jika diperlukan.');
  lv('EMP08', 'Cuti', -15, -14, 'Keperluan pribadi mendesak.', 'Ditolak', 'Bertepatan dengan periode tutup buku bulanan, mohon ajukan di tanggal lain.');

  /* Reconcile: an approved leave (or a pending one covering today) must match the
     attendance record for the same date, so the Kehadiran and Approval tabs never
     contradict each other for the same employee on the same day. */
  var todayIso2 = fmtDateISO(today);
  leaves.forEach(function(l) {
    if (l.status === 'Ditolak') return;
    if (l.status === 'Menunggu' && !(todayIso2 >= l.tanggalMulai && todayIso2 <= l.tanggalSelesai)) return;
    var cursor = new Date(l.tanggalMulai);
    var end = new Date(l.tanggalSelesai);
    while (cursor <= end) {
      var iso = fmtDateISO(cursor);
      if (iso <= todayIso2 && !isWeekend(cursor)) {
        var rec = null;
        for (var k = 0; k < attendance.length; k++) { if (attendance[k].employeeId === l.employeeId && attendance[k].tanggal === iso) { rec = attendance[k]; break; } }
        if (rec) { rec.status = l.jenis; rec.jamMasuk = null; rec.jamPulang = null; rec.lokasi = null; }
        else { attendance.push({ id: uid('ATT'), employeeId: l.employeeId, tanggal: iso, jamMasuk: null, jamPulang: null, status: l.jenis, lokasi: null }); }
      }
      cursor = addDays(cursor, 1);
    }
  });

  localStorage.setItem('absku_attendance', JSON.stringify(attendance));
  localStorage.setItem('absku_leaves', JSON.stringify(leaves));
  localStorage.setItem('absku_leave_balance', JSON.stringify({ 'EMP01':12,'EMP02':9,'EMP03':12,'EMP04':7,'EMP05':10,'EMP06':11,'EMP07':10,'EMP08':6 }));
  localStorage.setItem('absku_seeded_v1', '1');

  var pgList = PENGUMUMAN_SEED.map(function(p) {
    return { id: uid('PG'), judul: p.judul, isi: p.isi, tanggal: addDays(today, p.offset).toISOString(), oleh: 'Yuni Hartati' };
  });
  localStorage.setItem('absku_pengumuman', JSON.stringify(pgList));
}

  if (existing && existing.jamMasuk) { showToast('Anda sudah absen masuk hari ini.', 'warn'); return; }
  var now = new Date();
  var all = getAttendance();
  var batas = shiftOf(emp).batasTelat.split(':');
  var limitH = parseInt(batas[0], 10), limitM = parseInt(batas[1], 10);
  var isLate = (now.getHours() > limitH) || (now.getHours() === limitH && now.getMinutes() > limitM);
  var status = isLate ? 'Telat' : 'Hadir';
  if (existing) {
    existing.jamMasuk = now.toISOString(); existing.status = status; existing.lokasi = 'Kantor Pusat';
  } else {
    all.push({ id: uid('ATT'), employeeId: emp.id, tanggal: fmtDateISO(now), jamMasuk: now.toISOString(), jamPulang: null, status: status, lokasi:'Kantor Pusat' });
  }
  saveAttendance(all);
  showToast(isLate ? 'Absen masuk tercatat (Telat). Semangat menjalani hari!' : 'Absen masuk berhasil. Selamat bekerja!', isLate ? 'warn' : 'ok');
  render();
}
function clockOut() {
  var emp = state.currentUser;
  var existing = todayAttendanceOf(emp.id);
  if (!existing || !existing.jamMasuk) { showToast('Anda belum absen masuk hari ini.', 'err'); return; }
  if (existing.jamPulang) { showToast('Anda sudah absen pulang hari ini.', 'warn'); return; }
  var all = getAttendance();
  for (var i=0;i<all.length;i++) { if (all[i].id === existing.id) { all[i].jamPulang = new Date().toISOString(); break; } }
  saveAttendance(all);
  showToast('Absen pulang berhasil. Sampai jumpa besok!', 'ok');
  render();
}

function resolveLeave(decision) {
  if (!pendingLeaveAction) return;
  var catatan = document.getElementById('lv-catatan') ? document.getElementById('lv-catatan').value.trim() : '';
  var leaves = getLeaves();
  var target = null;
  for (var i=0;i<leaves.length;i++) { if (leaves[i].id === pendingLeaveAction) { leaves[i].status = decision; leaves[i].catatanAdmin = catatan; target = leaves[i]; break; } }
  saveLeaves(leaves);
  if (decision === 'Disetujui' && target && target.jenis === 'Cuti') {
    var days = Math.round((new Date(target.tanggalSelesai) - new Date(target.tanggalMulai)) / 86400000) + 1;
    var bal = getLeaveBalance(target.employeeId);
    setLeaveBalance(target.employeeId, Math.max(0, bal - days));
  }
  if (target) {
    var targetEmp = getEmployee(target.employeeId);
    logActivity((decision === 'Disetujui' ? 'Menyetujui' : 'Menolak') + ' pengajuan ' + target.jenis.toLowerCase() + ' ' + (targetEmp ? targetEmp.nama : ''));
  }
  closeModal();
  showToast('Pengajuan telah ' + decision.toLowerCase() + '.', decision === 'Disetujui' ? 'ok' : 'warn');
  render();
  if (state.adminTab === 'ringkasan' || state.adminTab === 'analitik') setTimeout(renderCharts, 60);
}

function simpanKoreksiAbsensi() {
  if (!pendingKoreksi) return;
  var status = document.getElementById('kor-status').value;
  var masukVal = document.getElementById('kor-masuk').value;
  var pulangVal = document.getElementById('kor-pulang').value;
  var tanggal = pendingKoreksi.tanggal, empId = pendingKoreksi.empId;
  var emp = getEmployee(empId);
  var jamMasuk = null, jamPulang = null;
  if ((status === 'Hadir' || status === 'Telat') && masukVal) {
    var dm = new Date(tanggal + 'T' + masukVal + ':00'); jamMasuk = dm.toISOString();
  }
  if ((status === 'Hadir' || status === 'Telat') && pulangVal) {
    var dp = new Date(tanggal + 'T' + pulangVal + ':00'); jamPulang = dp.toISOString();
  }
  var all = getAttendance();
  var rec = null;
  for (var i=0;i<all.length;i++) { if (all[i].employeeId === empId && all[i].tanggal === tanggal) { rec = all[i]; break; } }
  if (rec) { rec.status = status; rec.jamMasuk = jamMasuk; rec.jamPulang = jamPulang; rec.lokasi = jamMasuk ? 'Kantor Pusat' : null; }
  else { all.push({ id: uid('ATT'), employeeId: empId, tanggal: tanggal, jamMasuk: jamMasuk, jamPulang: jamPulang, status: status, lokasi: jamMasuk ? 'Kantor Pusat' : null }); }
  saveAttendance(all);
  logActivity('Mengoreksi absensi ' + emp.nama + ' tanggal ' + fmtDateShort(tanggal) + ' menjadi ' + status);
  closeModal();
  showToast('Koreksi absensi berhasil disimpan.', 'ok');
  render();
  if (state.view === 'admin' && (state.adminTab === 'ringkasan' || state.adminTab === 'analitik')) setTimeout(renderCharts, 60);
}

function exportCsv() {
  var all = getAttendance();
  var rows = [['Nama','Departemen','Tanggal','Jam Masuk','Jam Pulang','Status']];
  all.slice().sort(function(a,b){ return a.tanggal < b.tanggal ? 1 : -1; }).forEach(function(r) {
    var emp = getEmployee(r.employeeId); if (!emp) return;
    rows.push([emp.nama, emp.departemen, r.tanggal, fmtTimeShort(r.jamMasuk), fmtTimeShort(r.jamPulang), r.status]);
  });
  var csv = rows.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'rekap-kehadiran-absenku.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logActivity('Mengekspor rekap kehadiran ke CSV');
  showToast('Rekap kehadiran berhasil diunduh.', 'ok');
}

      '<div style="text-align:center;color:#fff;font-weight:700;font-size:14.5px;margin-bottom:4px;">Anda mengajukan ' + att.status + ' hari ini</div>' +
      '<div style="text-align:center;color:rgba(255,255,255,0.65);font-size:12.5px;">Tidak perlu melakukan absen masuk/pulang.</div>';
  } else if (!att || !att.jamMasuk) {
    html = '<button class="punch-btn" style="background:#fff;color:var(--navy);" onclick="clockIn()">' + icon('clockIn') + ' Absen Masuk</button>' +
      '<div id="loc-status-box" style="margin-top:12px;"></div>' +
      '<button id="btn-verify-loc" class="btn btn-ghost btn-sm" style="color:rgba(255,255,255,0.75);width:100%;margin-top:8px;" onclick="verifyLocation()">' + icon('mapPin') + ' Verifikasi lokasi kantor</button>';
  } else if (!att.jamPulang) {
    html = '<div style="background:rgba(255,255,255,0.12);border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;">' +
      '<div><div style="color:rgba(255,255,255,0.65);font-size:11px;font-weight:700;text-transform:uppercase;">Jam Masuk</div><div style="color:#fff;font-weight:800;font-size:18px;">' + fmtTimeShort(att.jamMasuk) + '</div></div>' +
      statusBadge(att.status) +
      '</div>' +
      '<button class="punch-btn" style="background:var(--grad-gold);color:#fff;" onclick="clockOut()">' + icon('clockOut') + ' Absen Pulang</button>';
  } else {
    html = '<div style="display:flex;gap:10px;margin-bottom:6px;">' +
      '<div style="flex:1;background:rgba(255,255,255,0.12);border-radius:14px;padding:12px 14px;"><div style="color:rgba(255,255,255,0.65);font-size:10.5px;font-weight:700;text-transform:uppercase;">Masuk</div><div style="color:#fff;font-weight:800;font-size:17px;">' + fmtTimeShort(att.jamMasuk) + '</div></div>' +
      '<div style="flex:1;background:rgba(255,255,255,0.12);border-radius:14px;padding:12px 14px;"><div style="color:rgba(255,255,255,0.65);font-size:10.5px;font-weight:700;text-transform:uppercase;">Pulang</div><div style="color:#fff;font-weight:800;font-size:17px;">' + fmtTimeShort(att.jamPulang) + '</div></div>' +
      '</div>' +
      '<div style="text-align:center;color:#fff;font-weight:700;font-size:14px;margin-top:10px;">' + icon('checkCircle') + ' Absensi hari ini selesai. Sampai jumpa besok!</div>';
  }
  mount.innerHTML = html;
}

    '<div class="divider"></div>' +

    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;"><span style="font-size:13px;color:var(--ink-soft);">Batas Terlambat</span><span style="font-weight:700;font-size:13.5px;">' + shiftOf(emp).batasTelat + ' WIB</span></div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><span style="font-size:13px;color:var(--ink-soft);">Jam Pulang</span><span style="font-weight:700;font-size:13.5px;">' + shiftOf(emp).jamPulang + ' WIB</span></div>' +
    '<div class="divider"></div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between;">' +
    '<div><div style="font-size:12px;color:var(--muted);font-weight:700;">Sisa Cuti Tahunan</div><div class="font-display" style="font-size:22px;font-weight:800;color:var(--gold);">' + balance + ' hari</div></div>' +

/* ============================= EMPLOYEE: RIWAYAT ============================= */
function changeHistoryMonth(delta) {
  var d = new Date(state.historyMonth + '-01T00:00:00');
  d.setMonth(d.getMonth() + delta);
  state.historyMonth = d.getFullYear() + '-' + pad2(d.getMonth()+1);
  render();
}
function setHistoryView(v) { state.historyView = v; render(); }
function statusCellClass(status) {
  var map = { 'Hadir':'st-hadir','Telat':'st-telat','Izin':'st-izin','Sakit':'st-sakit','Cuti':'st-cuti','Alpha':'st-alpha' };
  return map[status] || '';
}
function buildAttendanceCalendar(empId, ym) {
  var all = getAttendance().filter(function(a){ return a.employeeId === empId && a.tanggal.slice(0,7) === ym; });
  var byDate = {};
  all.forEach(function(a){ byDate[a.tanggal] = a; });
  var d = new Date(ym + '-01T00:00:00');
  var firstDow = d.getDay();
  var daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  var todayIso = fmtDateISO(new Date());
  var cells = '';
  for (var i=0;i<firstDow;i++) cells += '<div class="cal-cell empty"></div>';
  for (var day=1; day<=daysInMonth; day++) {
    var dateObj = new Date(d.getFullYear(), d.getMonth(), day);
    var iso = fmtDateISO(dateObj);
    var rec = byDate[iso];
    var cls = rec ? statusCellClass(rec.status) : (isWeekend(dateObj) ? 'st-weekend' : '');
    var isFuture = iso > todayIso;
    var label = rec ? rec.status : (isWeekend(dateObj) ? 'Libur' : (isFuture ? '' : '-'));
    cells += '<div class="cal-cell ' + cls + '"><div class="cal-daynum">' + day + '</div>' + (label ? '<div style="font-size:9.5px;color:var(--ink-soft);">' + label + '</div>' : '') + '</div>';
  }
  var heads = HARI_ID.slice(1).concat(HARI_ID[0]).map(function(h){ return '<div class="cal-head">' + h.slice(0,3) + '</div>'; }).join('');
  return '<div class="cal-grid">' + heads + cells + '</div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--ink-soft);">' +
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--ok-bg);border:1px solid rgba(21,128,61,0.3);vertical-align:middle;margin-right:4px;"></span>Hadir</span>' +
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--warn-bg);border:1px solid rgba(180,83,9,0.3);vertical-align:middle;margin-right:4px;"></span>Telat</span>' +
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--info-bg);border:1px solid rgba(3,105,161,0.3);vertical-align:middle;margin-right:4px;"></span>Izin/Sakit/Cuti</span>' +
    '<span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--danger-bg);border:1px solid rgba(185,28,28,0.3);vertical-align:middle;margin-right:4px;"></span>Alpha</span>' +
    '</div>';
}
function buildRiwayat() {
  var emp = state.currentUser;
  var all = getAttendance().filter(function(a){ return a.employeeId === emp.id && a.tanggal.slice(0,7) === state.historyMonth; });
  all.sort(function(a,b){ return a.tanggal < b.tanggal ? 1 : -1; });
  var d = new Date(state.historyMonth + '-01T00:00:00');
  var monthLabel = BULAN_ID[d.getMonth()] + ' ' + d.getFullYear();
  var count = function(st) { return all.filter(function(a){ return a.status === st; }).length; };
  var rows = all.length ? all.map(function(a) {
    return '<tr><td style="font-weight:600;color:var(--ink);">' + fmtDateShort(a.tanggal) + '</td><td>' + HARI_ID[new Date(a.tanggal).getDay()] + '</td><td>' + fmtTimeShort(a.jamMasuk) + '</td><td>' + fmtTimeShort(a.jamPulang) + '</td><td>' + statusBadge(a.status) + '</td><td>' + (a.lokasi ? ('<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;">' + icon('mapPin','') + a.lokasi + '</span>') : '<span style="color:var(--muted);">-</span>') + '</td></tr>';
  }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px;">Tidak ada data kehadiran pada bulan ini.</td></tr>';

  var miniStat = function(label, value, color) {
    return '<div style="flex:1;min-width:90px;background:var(--bg-tint);border-radius:12px;padding:10px 12px;"><div style="font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;">' + label + '</div><div style="font-weight:800;font-size:19px;color:' + color + ';">' + value + '</div></div>';
  };

  return '<div class="fade-in">' +
    '<div class="card-surface" style="padding:20px;margin-bottom:16px;">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">' +
    '<div style="display:flex;align-items:center;gap:9px;">' + icon('calendar','ic-primary') + '<span style="font-weight:800;font-size:15px;">Riwayat Kehadiran</span></div>' +
    '<div style="display:flex;align-items:center;gap:6px;">' +
    '<button class="btn-icon" onclick="changeHistoryMonth(-1)">' + icon('chevronL') + '</button>' +
    '<span style="font-weight:700;font-size:13.5px;min-width:130px;text-align:center;">' + monthLabel + '</span>' +
    '<button class="btn-icon" onclick="changeHistoryMonth(1)">' + icon('chevronR') + '</button>' +
    '</div></div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">' +
    miniStat('Hadir', count('Hadir'), 'var(--ok)') + miniStat('Telat', count('Telat'), 'var(--warn)') +
    miniStat('Izin', count('Izin'), 'var(--info)') + miniStat('Sakit', count('Sakit'), 'var(--info)') +
    miniStat('Cuti', count('Cuti'), 'var(--info)') + miniStat('Alpha', count('Alpha'), 'var(--danger)') +
    '</div>' +
    '<div class="tab-row no-print">' +
    '<button class="chip ' + (state.historyView === 'tabel' ? 'active' : '') + '" onclick="setHistoryView(\'tabel\')">Tampilan Tabel</button>' +
    '<button class="chip ' + (state.historyView === 'kalender' ? 'active' : '') + '" onclick="setHistoryView(\'kalender\')">Tampilan Kalender</button>' +
    '</div>' +
    '</div>' +
    (state.historyView === 'kalender' ? '<div class="card-surface" style="padding:20px;">' + buildAttendanceCalendar(emp.id, state.historyMonth) + '</div>' :
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tanggal</th><th>Hari</th><th>Masuk</th><th>Pulang</th><th>Status</th><th>Lokasi</th></tr></thead><tbody>' + rows + '</tbody></table></div>') +
    '</div>';
}

/* ============================= ADMIN: RINGKASAN ============================= */
function buildAdminRingkasan() {
  var todayIso = fmtDateISO(new Date());
  var all = getAttendance();
  var todayAtt = all.filter(function(a){ return a.tanggal === todayIso; });
  var count = function(st) { return todayAtt.filter(function(a){ return a.status === st; }).length; };
  var hadir = count('Hadir') + count('Telat');
  var telat = count('Telat');
  var cuti = count('Izin') + count('Sakit') + count('Cuti');
  var belum = EMPLOYEES.length - todayAtt.length;
  var leaves = getLeaves();
  var pending = leaves.filter(function(l){ return l.status === 'Menunggu'; });

  var statTile = function(label, value, iconName, accent) {
    return '<div class="stat-tile" style="--accent:' + accent + ';">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;">' +
      '<div><div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;">' + label + '</div>' +
      '<div class="font-display" style="font-size:26px;font-weight:800;margin-top:3px;">' + value + '</div></div>' +
      '<div class="stat-icon-badge" style="background:' + accent + '1a;color:' + accent + ';">' + icon(iconName) + '</div></div></div>';
  };

  var pendingHtml = pending.length ? pending.slice(0,4).map(function(l) {
    var emp = getEmployee(l.employeeId);
    return '<div style="display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft);">' +
      avatarHtml(emp, 36) +
      '<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(emp.nama) + '</div><div style="font-size:11.5px;color:var(--muted);">' + l.jenis + ' &middot; ' + fmtDateShort(l.tanggalMulai) + '</div></div>' +
      '<button class="btn btn-secondary btn-sm" onclick="openLeaveReview(\'' + l.id + '\')">Tinjau</button>' +
      '</div>';
  }).join('') : '<div style="text-align:center;color:var(--muted);font-size:13px;padding:24px 0;">Tidak ada pengajuan menunggu persetujuan.</div>';

  var deptCounts = {};
  DEPARTEMEN.forEach(function(d){ deptCounts[d] = 0; });
  todayAtt.forEach(function(a){ var emp = getEmployee(a.employeeId); if (emp && (a.status === 'Hadir' || a.status === 'Telat')) deptCounts[emp.departemen]++; });

  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">' +
    '<div><h2 class="font-display" style="font-size:19px;font-weight:800;margin:0;">Ringkasan Hari Ini</h2><p style="font-size:12.5px;color:var(--muted);margin:3px 0 0;">' + fmtDateLong(new Date()) + '</p></div>' +
    '<button class="btn btn-secondary btn-sm" onclick="exportCsv()">' + icon('download') + ' Ekspor CSV</button>' +
    '</div>' +
    '<div class="stat-grid-4" style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px;">' +
    statTile('Hadir', hadir, 'checkCircle', '#15803d') +
    statTile('Terlambat', telat, 'alert', '#b45309') +
    statTile('Izin/Sakit/Cuti', cuti, 'file', '#0369a1') +
    statTile('Belum Absen', belum, 'clock', '#565b70') +
    statTile('Total Karyawan', EMPLOYEES.length, 'users', '#3730a3') +
    '</div>' +
    '<div class="split-grid" style="grid-template-columns:1.4fr 1fr;">' +
    '<div class="card-surface" style="padding:20px;">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;">' + icon('trend','ic-primary') + '<span style="font-weight:800;font-size:14.5px;">Tren Kehadiran 14 Hari Terakhir</span></div>' +
    '<div style="height:230px;"><canvas id="chart-trend"></canvas></div>' +
    '</div>' +
    '<div class="card-surface" style="padding:20px;">' +

    '<div style="display:flex;align-items:center;gap:9px;">' + icon('file','ic-primary') + '<span style="font-weight:800;font-size:14.5px;">Perlu Persetujuan</span></div>' +
    (pending.length ? '<span class="badge badge-warn">' + pending.length + '</span>' : '') +

/* ============================= ADMIN: KEHADIRAN ============================= */

  var attendedIds = getAttendance().filter(function(a){ return a.tanggal === state.kehadiranFilterDate; }).map(function(a){ return a.employeeId; });
  var belumList = EMPLOYEES.filter(function(e){ return attendedIds.indexOf(e.id) === -1; });
  var showBelum = state.kehadiranFilterStatus === 'Semua' || state.kehadiranFilterStatus === 'Belum Absen';

  var deptChips = ['Semua'].concat(DEPARTEMEN).map(function(d) {

      '<td class="no-print"><button class="btn btn-secondary btn-sm" onclick="openKoreksiAbsensi(\'' + emp.id + '\',\'' + state.kehadiranFilterDate + '\')">' + icon('edit') + ' Koreksi</button></td></tr>';
  }).join('');
  var belumRows = showBelum ? belumList.map(function(emp) {
    return '<tr><td style="cursor:pointer;" onclick="openEmployeeProfile(\'' + emp.id + '\')"><div class="emp-row">' + avatarHtml(emp, 32) + '<div><div style="font-weight:700;color:var(--ink);font-size:13px;">' + escapeHtml(emp.nama) + '</div><div style="font-size:11.5px;color:var(--muted);">' + emp.departemen + '</div></div></div></td><td>-</td><td>-</td><td>' + statusBadge('Belum Absen') + '</td>' +
      '<td class="no-print"><button class="btn btn-secondary btn-sm" onclick="openKoreksiAbsensi(\'' + emp.id + '\',\'' + state.kehadiranFilterDate + '\')">' + icon('edit') + ' Koreksi</button></td></tr>';
  }).join('') : '';
  var allRows = rows + belumRows;
  if (!allRows) allRows = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px;">Tidak ada data yang sesuai filter.</td></tr>';

  return '<div class="fade-in">' +
    '<div class="card-surface" style="padding:18px 20px;margin-bottom:16px;">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;">' +
    '<div style="display:flex;align-items:center;gap:9px;">' + icon('filter','ic-primary') + '<span style="font-weight:800;font-size:14.5px;">Data Kehadiran</span></div>' +
    '<div style="display:flex;align-items:center;gap:10px;" class="no-print">' +
    '<input type="date" class="inp" style="width:auto;" value="' + state.kehadiranFilterDate + '" onchange="setKehadiranFilter(\'kehadiranFilterDate\',this.value)">' +
    '<button class="btn btn-secondary btn-sm" onclick="exportCsv()">' + icon('download') + ' CSV</button>' +
    '<button class="btn btn-secondary btn-sm" onclick="window.print()">' + icon('print') + ' Cetak</button>' +
    '</div></div>' +
    '<div class="tab-row no-print" style="margin-bottom:10px;">' + deptChips + '</div>' +
    '<div class="tab-row no-print">' + statusOpts.map(function(s) { return '<button class="chip ' + (state.kehadiranFilterStatus === s ? 'active' : '') + '" style="font-size:12px;padding:6px 12px;" onclick="setKehadiranFilter(\'kehadiranFilterStatus\',\'' + s + '\')">' + s + '</button>'; }).join('') + '</div>' +
    '</div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Karyawan</th><th>Masuk</th><th>Pulang</th><th>Status</th><th class="no-print">Aksi</th></tr></thead><tbody>' + allRows + '</tbody></table></div>' +
    '</div>';

    '<div class="divider" style="margin:24px 0;"></div>' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;">' + icon('history','ic-primary') + '<h2 class="font-display" style="font-size:16.5px;font-weight:800;margin:0;">Riwayat Keputusan</h2></div>' +
    (resolved.length ? resolved.map(function(l){ return cardOf(l, false); }).join('') : '<div class="card-surface" style="padding:30px;text-align:center;color:var(--muted);font-size:13.5px;">Belum ada riwayat keputusan.</div>') +

function buildAdminAnalitik() {
  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:16px;">' + icon('trend','ic-primary') + '<h2 class="font-display" style="font-size:17px;font-weight:800;margin:0;">Analitik Kehadiran</h2></div>' +

    '<div class="card-surface" style="padding:20px;"><div style="font-weight:800;font-size:14px;margin-bottom:12px;">Kehadiran per Departemen (Hari Ini)</div><div style="height:220px;"><canvas id="chart-dept"></canvas></div></div>' +
    '</div>' +

    '<div style="font-weight:800;font-size:14px;margin-bottom:12px;">Tren Kehadiran & Keterlambatan per Bulan (6 Bulan Terakhir)</div>' +
    '<div style="height:230px;"><canvas id="chart-tren-bulanan"></canvas></div>' +
    '</div>' +
    '<div class="card-surface" style="padding:20px;">' +
    '<div style="font-weight:800;font-size:14px;margin-bottom:14px;">Peringkat Ketepatan Waktu (30 Hari Terakhir)</div>' +
    '<div id="punctuality-list"></div>' +
    '</div></div>';
}
function getTrenBulanan() {
  var all = getAttendance();
  var months = [];
  var now = new Date();
  for (var i = 5; i >= 0; i--) {
    var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    var ym = d.getFullYear() + '-' + pad2(d.getMonth()+1);
    var recs = all.filter(function(a){ return a.tanggal.slice(0,7) === ym; });
    var hadir = recs.filter(function(a){ return a.status === 'Hadir' || a.status === 'Telat'; }).length;
    var telat = recs.filter(function(a){ return a.status === 'Telat'; }).length;
    var rate = hadir ? Math.round((telat / hadir) * 100) : 0;
    months.push({ label: BULAN_ID[d.getMonth()].slice(0,3) + ' ' + d.getFullYear(), hadir: hadir, telatPct: rate });
  }
  return months;
}
function buildPunctualityList() {
  var all = getAttendance();
  var stats = EMPLOYEES.map(function(emp) {
    var recs = all.filter(function(a){ return a.employeeId === emp.id && (a.status === 'Hadir' || a.status === 'Telat'); });
    var telat = recs.filter(function(a){ return a.status === 'Telat'; }).length;
    var rate = recs.length ? Math.round(((recs.length - telat) / recs.length) * 100) : 100;
    return { emp: emp, rate: rate, total: recs.length };
  }).sort(function(a,b){ return b.rate - a.rate; });
  var html = stats.map(function(s, i) {
    var color = s.rate >= 90 ? 'var(--ok)' : (s.rate >= 75 ? 'var(--warn)' : 'var(--danger)');
    return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);">' +
      '<div style="width:22px;text-align:center;font-weight:800;color:var(--muted);font-size:12.5px;">' + (i+1) + '</div>' +
      avatarHtml(s.emp, 34) +
      '<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(s.emp.nama) + '</div>' +
      '<div class="progress-track" style="margin-top:5px;"><div class="progress-fill" style="width:' + s.rate + '%;background:' + color + ';"></div></div></div>' +
      '<div style="font-weight:800;font-size:14px;color:' + color + ';min-width:42px;text-align:right;">' + s.rate + '%</div>' +
      '</div>';
  }).join('');
  var mount = document.getElementById('punctuality-list');
  if (mount) mount.innerHTML = html;
}

  ) : '';

  return '<div class="fade-in">' +

/* ============================= KALENDER KANTOR ============================= */
function changeKalenderBulan(delta) {

  state.kalenderBulan = d.getFullYear() + '-' + pad2(d.getMonth()+1);

function submitEvent(ev) {
  ev.preventDefault();
  var judul = document.getElementById('ev-judul').value.trim();
  var tanggal = document.getElementById('ev-tanggal').value;
  var kategori = document.getElementById('ev-kategori').value;
  if (!judul || !tanggal) { showToast('Mohon lengkapi judul dan tanggal agenda.', 'err'); return false; }
  tambahEvent(judul, tanggal, kategori);
  showToast('Agenda berhasil ditambahkan.', 'ok');
  render();
  return false;
}
function buildKalender() {
  var isAdmin = state.view === 'admin';
  var events = getKalenderEvents().filter(function(e){ return e.tanggal.slice(0,7) === state.kalenderBulan; }).sort(function(a,b){ return a.tanggal < b.tanggal ? -1 : 1; });
  var d = new Date(state.kalenderBulan + '-01T00:00:00');
  var monthLabel = BULAN_ID[d.getMonth()] + ' ' + d.getFullYear();

  var listHtml = events.length ? events.map(function(e) {
    return '<div class="card-surface" style="padding:14px 17px;margin-bottom:10px;display:flex;align-items:center;gap:14px;">' +
      '<div style="width:44px;height:44px;border-radius:12px;background:var(--bg-tint);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;">' +
      '<div style="font-weight:800;font-size:16px;line-height:1;">' + new Date(e.tanggal).getDate() + '</div>' +
      '<div style="font-size:9.5px;color:var(--muted);text-transform:uppercase;">' + BULAN_ID[new Date(e.tanggal).getMonth()].slice(0,3) + '</div></div>' +
      '<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13.5px;">' + escapeHtml(e.judul) + '</div>' +
      '<div style="font-size:11.5px;color:var(--muted);">' + HARI_ID[new Date(e.tanggal).getDay()] + '</div></div>' +
      '<span class="badge" style="background:' + (KALENDER_KATEGORI[e.kategori] || 'var(--primary)') + '1a;color:' + (KALENDER_KATEGORI[e.kategori] || 'var(--primary)') + ';">' + e.kategori + '</span>' +
      (isAdmin ? '<button class="btn-icon" onclick="hapusEvent(\'' + e.id + '\')">' + icon('x') + '</button>' : '') +
      '</div>';
  }).join('') : '<div class="card-surface" style="padding:30px;text-align:center;color:var(--muted);font-size:13.5px;">Tidak ada agenda pada bulan ini.</div>';

  var formHtml = isAdmin ? (
    '<div class="card-surface" style="padding:20px;margin-bottom:16px;">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;">' + icon('plus','ic-primary') + '<span style="font-weight:800;font-size:14.5px;">Tambah Agenda</span></div>' +
    '<form onsubmit="return submitEvent(event)">' +
    '<div style="margin-bottom:12px;"><label class="lbl" for="ev-judul">Judul Agenda</label><input type="text" id="ev-judul" class="inp" placeholder="Contoh: Town Hall Kuartalan"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">' +
    '<div><label class="lbl" for="ev-tanggal">Tanggal</label><input type="date" id="ev-tanggal" class="inp"></div>' +
    '<div><label class="lbl" for="ev-kategori">Kategori</label><select id="ev-kategori" class="inp">' + Object.keys(KALENDER_KATEGORI).map(function(k){ return '<option value="' + k + '">' + k + '</option>'; }).join('') + '</select></div>' +
    '</div>' +
    '<button type="submit" class="btn btn-primary">' + icon('check') + ' Tambah Agenda</button>' +
    '</form></div>'
  ) : '';

  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">' +
    '<div style="display:flex;align-items:center;gap:9px;">' + icon('calendar','ic-primary') + '<h2 class="font-display" style="font-size:17px;font-weight:800;margin:0;">Kalender Kantor</h2></div>' +
    '<div style="display:flex;align-items:center;gap:6px;">' +
    '<button class="btn-icon" onclick="changeKalenderBulan(-1)">' + icon('chevronL') + '</button>' +
    '<span style="font-weight:700;font-size:13.5px;min-width:130px;text-align:center;">' + monthLabel + '</span>' +
    '<button class="btn-icon" onclick="changeKalenderBulan(1)">' + icon('chevronR') + '</button>' +
    '</div></div>' +
    formHtml + listHtml +
    '</div>';
}

/* ============================= LOG AKTIVITAS ============================= */
function buildLog() {
  var log = getLog();
  var rows = log.length ? log.map(function(l) {
    return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);">' +
      '<div style="width:34px;height:34px;border-radius:50%;background:var(--bg-tint);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0;">' + icon('history') + '</div>' +
      '<div style="flex:1;min-width:0;"><div style="font-size:13px;color:var(--ink);">' + escapeHtml(l.text) + '</div>' +
      '<div style="font-size:11.5px;color:var(--muted);">' + escapeHtml(l.oleh) + ' &middot; ' + timeAgoLabel(l.waktu) + '</div></div>' +
      '</div>';
  }).join('') : '<div style="text-align:center;color:var(--muted);font-size:13.5px;padding:30px 0;">Belum ada aktivitas tercatat.</div>';
  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:4px;">' + icon('history','ic-primary') + '<h2 class="font-display" style="font-size:17px;font-weight:800;margin:0;">Log Aktivitas</h2></div>' +
    '<p style="font-size:12.5px;color:var(--muted);margin:2px 0 16px;">Riwayat perubahan data penting: persetujuan pengajuan, koreksi absensi, pengumuman, dan agenda.</p>' +
    '<div class="card-surface" style="padding:16px 20px;">' + rows + '</div>' +
    '</div>';
}

}

    '<div class="card-surface" style="padding:20px;">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;">' + icon('lock','ic-primary') + '<span style="font-weight:800;font-size:14.5px;">Ubah Kata Sandi</span></div>' +

    '<div style="margin-bottom:16px;"><label class="lbl" for="pw-baru">Kata Sandi Baru</label><input type="password" id="pw-baru" class="inp" placeholder="********"></div>' +

/* ============================= PROFIL KARYAWAN (MODAL) ============================= */
function openEmployeeProfile(empId) {
  var emp = getEmployee(empId);
  if (!emp) return;
  var all = getAttendance().filter(function(a){ return a.employeeId === empId; });
  var telatCount = all.filter(function(a){ return a.status === 'Telat'; }).length;
  var hadirCount = all.filter(function(a){ return a.status === 'Hadir' || a.status === 'Telat'; }).length;
  var rate = hadirCount ? Math.round(((hadirCount - telatCount) / hadirCount) * 100) : 100;
  var balance = getLeaveBalance(empId);
  var recent = all.slice().sort(function(a,b){ return a.tanggal < b.tanggal ? 1 : -1; }).slice(0,5);
  var recentRows = recent.length ? recent.map(function(a) {
    return '<tr><td>' + fmtDateShort(a.tanggal) + '</td><td>' + fmtTimeShort(a.jamMasuk) + '</td><td>' + statusBadge(a.status) + '</td></tr>';
  }).join('') : '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:16px;">Belum ada riwayat.</td></tr>';
  var modal = document.getElementById('modal-root');
  modal.innerHTML =
    '<div class="modal-backdrop" onclick="if(event.target===this) closeModal();">' +
    '<div class="modal-box fade-in" style="max-width:440px;">' +
    '<div style="padding:22px;">' +
    '<div class="emp-row" style="margin-bottom:14px;">' + avatarHtml(emp, 48) + '<div><div style="font-weight:800;font-size:15.5px;">' + escapeHtml(emp.nama) + '</div><div style="font-size:12.5px;color:var(--muted);">' + escapeHtml(emp.jabatan) + ' &middot; ' + emp.departemen + '</div></div></div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">' +
    '<div style="background:var(--bg-tint);border-radius:10px;padding:10px;text-align:center;"><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;">Ketepatan</div><div style="font-weight:800;font-size:16px;">' + rate + '%</div></div>' +
    '<div style="background:var(--bg-tint);border-radius:10px;padding:10px;text-align:center;"><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;">Sisa Cuti</div><div style="font-weight:800;font-size:16px;">' + balance + '</div></div>' +
    '<div style="background:var(--bg-tint);border-radius:10px;padding:10px;text-align:center;"><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;">Shift</div><div style="font-weight:800;font-size:12.5px;padding-top:3px;">' + emp.shift + '</div></div>' +
    '</div>' +
    '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Email</div>' +
    '<div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">' + escapeHtml(emp.email) + '</div>' +
    '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Riwayat Terbaru</div>' +
    '<div class="tbl-wrap"><table class="tbl" style="font-size:12.5px;"><thead><tr><th>Tanggal</th><th>Masuk</th><th>Status</th></tr></thead><tbody>' + recentRows + '</tbody></table></div>' +
    '</div></div></div>';
}

/* ============================= PENCARIAN GLOBAL ============================= */
function setSearchQuery(v) {
  state.searchQuery = v;
  var mount = document.getElementById('global-search-mount');
  if (!mount) return;
  clearSearchDropdown();
  if (!v || !v.trim()) return;
  mount.insertAdjacentHTML('beforeend', buildSearchResults(v.trim()));
}
function buildSearchResults(q) {
  var qLower = q.toLowerCase();
  var matches = EMPLOYEES.filter(function(e){ return e.nama.toLowerCase().indexOf(qLower) !== -1; }).slice(0,8);
  var html = matches.length ? matches.map(function(e) {
    return '<button class="search-result-row" onclick="clearSearchDropdown();openEmployeeProfile(\'' + e.id + '\')">' +
      avatarHtml(e, 32) +
      '<div style="min-width:0;flex:1;text-align:left;"><div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(e.nama) + '</div><div style="font-size:11.5px;color:var(--muted);">' + escapeHtml(e.jabatan) + '</div></div>' +
      '</button>';
  }).join('') : '<div style="padding:16px;text-align:center;color:var(--muted);font-size:12.5px;">Tidak ditemukan.</div>';
  return '<div class="search-results fade-in" id="global-search-results">' + html + '</div>';
}

/* ============================= CHARTS ============================= */
function destroyChart(key) { if (state.charts[key]) { state.charts[key].destroy(); delete state.charts[key]; } }
function renderCharts() {
  if (typeof Chart === 'undefined') return;
  var all = getAttendance();
  if (state.view === 'admin' && state.adminTab === 'ringkasan') {
    var trendCanvas = document.getElementById('chart-trend');
    if (trendCanvas) {
      destroyChart('trend');
      var labels = [], hadirData = [], telatData = [], cutiData = [];
      for (var i = 13; i >= 0; i--) {
        var day = addDays(new Date(), -i);
        var iso = fmtDateISO(day);
        labels.push(pad2(day.getDate()) + '/' + pad2(day.getMonth()+1));
        var dayRecs = all.filter(function(a){ return a.tanggal === iso; });
        hadirData.push(dayRecs.filter(function(a){ return a.status === 'Hadir'; }).length);
        telatData.push(dayRecs.filter(function(a){ return a.status === 'Telat'; }).length);
        cutiData.push(dayRecs.filter(function(a){ return a.status === 'Izin' || a.status === 'Sakit' || a.status === 'Cuti'; }).length);
      }
      state.charts.trend = new Chart(trendCanvas.getContext('2d'), {
        type: 'line',
        data: { labels: labels, datasets: [
          { label: 'Hadir', data: hadirData, borderColor:'#4338ca', backgroundColor:'rgba(67,56,202,0.1)', tension:0.35, fill:true, pointRadius:2.5 },
          { label: 'Telat', data: telatData, borderColor:'#d97706', backgroundColor:'rgba(217,119,6,0.08)', tension:0.35, fill:true, pointRadius:2.5 },
          { label: 'Izin/Sakit/Cuti', data: cutiData, borderColor:'#0369a1', backgroundColor:'rgba(3,105,161,0.08)', tension:0.35, fill:true, pointRadius:2.5 }
        ] },
        options: { responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11},usePointStyle:true}}}, scales:{ y:{beginAtZero:true,ticks:{precision:0,font:{size:10.5}},grid:{color:'#eef0f7'}}, x:{ticks:{font:{size:10.5}},grid:{display:false}} } }
      });
    }
  }
  if (state.view === 'admin' && state.adminTab === 'analitik') {
    var thirty = [];
    for (var i2 = 29; i2 >= 0; i2--) { thirty.push(fmtDateISO(addDays(new Date(), -i2))); }
    var recs30 = all.filter(function(a){ return thirty.indexOf(a.tanggal) !== -1; });
    var statusCanvas = document.getElementById('chart-status-dist');
    if (statusCanvas) {
      destroyChart('statusDist');
      var statuses = ['Hadir','Telat','Izin','Sakit','Cuti','Alpha'];
      var colors = ['#15803d','#d97706','#0369a1','#6366f1','#7c3aed','#b91c1c'];
      var data = statuses.map(function(s) { return recs30.filter(function(a){ return a.status === s; }).length; });
      state.charts.statusDist = new Chart(statusCanvas.getContext('2d'), {
        type: 'doughnut',
        data: { labels: statuses, datasets: [{ data: data, backgroundColor: colors, borderWidth:2, borderColor:'#fff' }] },
        options: { responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10.5},usePointStyle:true,padding:10}}} }
      });
    }
    var deptCanvas = document.getElementById('chart-dept');
    if (deptCanvas) {
      destroyChart('dept');
      var todayIso2 = fmtDateISO(new Date());
      var deptData = DEPARTEMEN.map(function(d) {
        var deptEmps = EMPLOYEES.filter(function(e){ return e.departemen === d; }).map(function(e){ return e.id; });
        return all.filter(function(a){ return a.tanggal === todayIso2 && deptEmps.indexOf(a.employeeId) !== -1 && (a.status === 'Hadir' || a.status === 'Telat'); }).length;
      });
      state.charts.dept = new Chart(deptCanvas.getContext('2d'), {
        type: 'bar',
        data: { labels: DEPARTEMEN.map(function(d){ var short = { 'IT & Engineering':'IT & Eng.', 'Human Resources':'HR' }; return short[d] || d; }), datasets: [{ label:'Hadir', data: deptData, backgroundColor:'#4338ca', borderRadius:6, maxBarThickness:38 }] },
        options: { responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true,ticks:{precision:0,font:{size:10.5}},grid:{color:'#eef0f7'}}, x:{ticks:{font:{size:10}},grid:{display:false}} } }
      });
    }
    var trenBulananCanvas = document.getElementById('chart-tren-bulanan');
    if (trenBulananCanvas) {
      destroyChart('trenBulanan');
      var tb = getTrenBulanan();
      state.charts.trenBulanan = new Chart(trenBulananCanvas.getContext('2d'), {
        type: 'bar',
        data: { labels: tb.map(function(t){return t.label;}), datasets: [
          { type:'bar', label:'Jumlah Hadir', data: tb.map(function(t){return t.hadir;}), backgroundColor:'#818cf8', borderRadius:6, maxBarThickness:34, yAxisID:'y' },
          { type:'line', label:'% Keterlambatan', data: tb.map(function(t){return t.telatPct;}), borderColor:'#b45309', backgroundColor:'rgba(180,83,9,0.08)', tension:0.3, fill:false, pointRadius:3, yAxisID:'y1' }
        ] },
        options: { responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11},usePointStyle:true}}}, scales:{
          y:{beginAtZero:true, position:'left', ticks:{precision:0,font:{size:10.5}}, grid:{color:'#eef0f7'}},
          y1:{beginAtZero:true, position:'right', max:100, ticks:{callback:function(v){return v+'%';}, font:{size:10.5}}, grid:{display:false}},
          x:{ticks:{font:{size:10.5}},grid:{display:false}}
        } }
      });
    }
    buildPunctualityList();
  }
}

/* ============================= MAIN RENDER ============================= */
function scrollActiveTabIntoView() {
  var nav = document.getElementById('topbar-nav');
  if (!nav) return;
  var active = nav.querySelector('.tab-btn.active');
  if (!active) return;
  var navRect = nav.getBoundingClientRect();
  var btnRect = active.getBoundingClientRect();
  if (btnRect.left < navRect.left) {
    nav.scrollLeft -= (navRect.left - btnRect.left) + 12;
  } else if (btnRect.right > navRect.right) {
    nav.scrollLeft += (btnRect.right - navRect.right) + 12;
  }
}
function render() {
  window.scrollTo(0, 0);
  var app = document.getElementById('app');
  if (state.view === 'login') { app.innerHTML = buildLogin() + '<div id="modal-root"></div>'; return; }
  var body = '';
  var activeTab = state.view === 'admin' ? state.adminTab : state.empTab;
  if (activeTab === 'pengumuman') { body = buildPengumuman(); }
  else if (activeTab === 'kalender') { body = buildKalender(); }
  else if (activeTab === 'pengaturan') { body = buildPengaturan(); }
  else if (activeTab === 'log' && state.view === 'admin') { body = buildLog(); }
  else if (state.view === 'employee') {
    if (state.empTab === 'dashboard') body = buildEmployeeDashboard();
    else if (state.empTab === 'riwayat') body = buildRiwayat();
    else if (state.empTab === 'pengajuan') body = buildPengajuan();
    else if (state.empTab === 'slipgaji') body = buildSlipGaji();
  } else if (state.view === 'admin') {
    if (state.adminTab === 'ringkasan') body = buildAdminRingkasan();
    else if (state.adminTab === 'kehadiran') body = buildAdminKehadiran();
    else if (state.adminTab === 'approval') body = buildAdminApproval();
    else if (state.adminTab === 'karyawan') body = buildAdminKaryawan();
    else if (state.adminTab === 'analitik') body = buildAdminAnalitik();
  }
  app.innerHTML = buildTopbar() + '<div class="wrap" style="padding-top:22px;padding-bottom:8px;min-height:60vh;">' + body + '</div>' + buildFooter() + '<div id="modal-root"></div>';
  if (state.view === 'employee' && state.empTab === 'dashboard') { renderPunchArea(); }
  if (state.view === 'admin' && (state.adminTab === 'ringkasan' || state.adminTab === 'analitik')) { setTimeout(renderCharts, 50); }
  scrollActiveTabIntoView();
}

/* ============================= INIT ============================= */
seedIfNeeded();
seedKalenderEvents();
render();
setInterval(function() {
  var el = document.getElementById('live-clock');
  if (el) el.textContent = fmtTime(new Date());
}, 1000);
document.addEventListener('click', function(ev) {
  var searchWrap = document.querySelector('.search-wrap');
  if (searchWrap && !searchWrap.contains(ev.target)) { clearSearchDropdown(); }
});
document.addEventListener('keydown', function(ev) {
  if (ev.key === 'Escape') {
    clearSearchDropdown();
    var modalRoot = document.getElementById('modal-root');
    if (modalRoot && modalRoot.innerHTML.trim()) { closeModal(); }
  }
});
</script>
