<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SekolahKu - SMA Bhakti Nusantara</title>
<meta name="description" content="Demo sistem informasi sekolah SekolahKu untuk SMA Bhakti Nusantara. Data siswa dan guru, absensi, nilai dan rapor, penggajian guru, serta dashboard kepala sekolah.">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#2a2418; --ink-soft:#6b5d47; --muted:#a0937b; --line:#e6dac2; --line-soft:#f1e8d6;
  --surface:#fffdf8; --bg:#f5efe1; --bg-tint:#ece0c6;
  --forest:#15392b; --primary:#0d6b52; --primary-2:#0f8a68; --primary-3:#5cbd9a;
  --primary-wash:#e6f3ec; --primary-wash-2:#d1ead9;
  --gold:#a06f13; --gold-soft:#c4901f; --gold-pale:#f5e6c4;
  --ok:#15803d; --ok-bg:#e9f7ee; --ok-soft:#22c55e;
  --warn:#b45309; --warn-bg:#fef3e2; --warn-soft:#f59e0b;
  --danger:#b91c1c; --danger-bg:#fdedec; --danger-soft:#ef4444;
  --info:#0369a1; --info-bg:#e6f4fb;
  --grad-primary:linear-gradient(135deg,var(--forest),var(--primary-2) 55%,var(--primary-3));
  --grad-gold:linear-gradient(135deg,#7a5209,var(--gold-soft));
  --shadow-sm:0 1px 3px rgba(42,36,24,0.06);
  --shadow-md:0 6px 18px rgba(42,36,24,0.09);
  --shadow-lg:0 18px 42px rgba(21,57,43,0.18);
  --shadow-primary:0 10px 22px rgba(13,107,82,0.28);
  --r-sm:6px; --r-md:9px; --r-lg:14px; --r-pill:999px;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Figtree', sans-serif; background:var(--bg); color:var(--ink); margin:0; -webkit-font-smoothing:antialiased; }
.font-display { font-family:'Fraunces', serif; font-optical-sizing:auto; }
::selection { background:var(--primary-wash-2); color:var(--forest); }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--primary-3); border-radius:4px; }
.ic { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:inline-block; vertical-align:middle; flex-shrink:0; }
.ic-primary { color:var(--primary); }
.ic-ok { color:var(--ok); }
.ic-warn { color:var(--warn); }
.ic-muted { color:var(--muted); }
.ic.spin { animation:icspin 1s linear infinite; }
@keyframes icspin { to { transform:rotate(360deg); } }

.wrap { max-width:1180px; margin:0 auto; padding:0 20px; }
.card-surface { background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); }
.fade-in { animation:fadeIn 0.35s ease both; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

.btn { display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:700;font-size:14px;border:none;cursor:pointer;border-radius:var(--r-md);padding:11px 20px;transition:transform 0.18s ease,box-shadow 0.18s ease,background 0.18s ease,color 0.18s ease,border-color 0.18s ease;white-space:nowrap; }
.btn:active { transform:translateY(1px); }
.btn:disabled { opacity:0.5;cursor:not-allowed;transform:none !important; }
.btn-primary { background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-primary); }
.btn-primary:hover:not(:disabled) { box-shadow:0 14px 30px rgba(13,148,136,0.4);transform:translateY(-1px); }
.btn-gold { background:var(--grad-gold);color:#fff;box-shadow:0 8px 22px rgba(184,134,11,0.32); }
.btn-gold:hover:not(:disabled) { box-shadow:0 12px 28px rgba(184,134,11,0.42);transform:translateY(-1px); }
.btn-danger { background:var(--danger-soft);color:#fff;box-shadow:0 8px 20px rgba(239,68,68,0.3); }
.btn-danger:hover:not(:disabled) { box-shadow:0 12px 26px rgba(239,68,68,0.4);transform:translateY(-1px); }
.btn-secondary { background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line); }
.btn-secondary:hover:not(:disabled) { border-color:var(--primary-3);color:var(--primary); }
.btn-ghost { background:transparent;color:var(--ink-soft);border:1.5px solid transparent; }
.btn-ghost:hover:not(:disabled) { background:var(--bg-tint);color:var(--primary); }
.btn-sm { padding:7px 14px;font-size:12.5px;border-radius:9px; }
.btn-block { width:100%; }
.btn-icon { width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-soft);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);transition:all 0.2s;padding:0;flex-shrink:0; }
.btn-icon:hover { border-color:var(--primary-3);color:var(--primary); }

.topbar { position:sticky;top:0;z-index:40;background:var(--forest);border-bottom:1px solid rgba(255,255,255,0.08); }
.topbar-sep { width:1px;align-self:stretch;background:rgba(255,255,255,0.14);flex-shrink:0;margin:2px 0; }
.topbar-link { display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff;flex-shrink:0; }
.topbar-mark { width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;color:var(--gold-soft);flex-shrink:0; }
.topbar-nav-wrap::before, .topbar-nav-wrap::after { content:'';position:absolute;top:0;bottom:0;width:18px;z-index:2;pointer-events:none; }
.topbar-nav-wrap::before { left:0;background:linear-gradient(90deg,var(--forest),transparent); }
.topbar-nav-wrap::after { right:0;background:linear-gradient(270deg,var(--forest),transparent); }
.topbar-nav { display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth; }
.topbar-nav::-webkit-scrollbar { display:none; }
.topbar-nav-sep { width:1px;align-self:stretch;background:rgba(255,255,255,0.14);flex-shrink:0;margin:8px 6px; }
.tab-btn { position:relative;display:inline-flex;align-items:center;gap:6px;padding:9px 13px 8px;border-radius:0;font-size:13px;font-weight:600;color:rgba(255,255,255,0.62);background:transparent;border:none;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;transition:all 0.2s;font-family:inherit;flex-shrink:0; }
.tab-btn:hover:not(.active) { color:#fff; }
.tab-btn.active { color:#fff;font-weight:700;border-bottom-color:var(--gold-soft); }
.tab-dot { width:7px;height:7px;border-radius:50%;background:var(--danger-soft);flex-shrink:0;margin-left:-2px; }
.topbar-name { font-weight:700;font-size:12.5px;line-height:1.2;white-space:nowrap;max-width:26vw;overflow:hidden;text-overflow:ellipsis;color:#fff; }
.topbar-role { font-size:10.5px;line-height:1.2;white-space:nowrap;max-width:26vw;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,0.55); }
.topbar .btn-icon { border-color:rgba(255,255,255,0.18);background:transparent;color:rgba(255,255,255,0.7); }
.topbar .btn-icon:hover { border-color:var(--gold-soft);color:var(--gold-soft); }
.topbar .avatar { box-shadow:0 0 0 2px rgba(255,255,255,0.22); }
@media (max-width:900px) {
  .topbar-user-text { display:none; }
}
@media (max-width:640px) {
  .topbar-wordmark, .topbar-sep { display:none; }
  .topbar .tab-btn .tab-label { display:none; }
  .topbar .tab-btn { padding:9px 10px; }
}
.search-wrap { position:relative;display:flex;align-items:center;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:var(--r-pill);padding:0 12px 0 4px;gap:4px; }
.search-inp { width:118px;padding:7px 0;border:none;background:transparent;color:#fff;font-family:inherit;font-size:12.5px; }
.search-inp:focus { outline:none; }
.search-inp::placeholder { color:rgba(255,255,255,0.45); }
.search-wrap .ic { color:rgba(255,255,255,0.6);flex-shrink:0;order:-1; }
.search-results { position:absolute;top:calc(100% + 10px);right:0;width:280px;max-height:360px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-lg);z-index:60;padding:6px; }
.search-result-row { display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:none;padding:8px 8px;border-radius:8px;cursor:pointer;font-family:inherit; }
.search-result-row:hover { background:var(--bg-tint); }
@media (max-width:900px) { .search-wrap { display:none; } }
.jadwal-grid { display:grid;grid-template-columns:70px repeat(5,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:hidden;font-size:11.5px; }
.jadwal-cell { background:var(--surface);padding:8px 6px;min-height:52px; }
.jadwal-head { background:var(--bg-tint);font-weight:800;text-align:center;padding:8px 4px;font-size:11.5px; }
@media print {
  .topbar, #toast-wrap, .no-print, .btn, .modal-backdrop > .modal-box .btn { display:none !important; }
  body, .wrap { background:#fff !important; }
  .modal-backdrop { position:static !important;background:none !important;padding:0 !important; }
  .modal-box { box-shadow:none !important;max-height:none !important;max-width:none !important; }
}

.stat-tile { background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 18px 22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden; }
.stat-tile::after { content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--accent,var(--grad-primary)); }
.stat-icon-badge { width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0; }

.badge { display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;letter-spacing:0.01em; }
.badge-ok { background:var(--ok-bg);color:var(--ok); }
.badge-warn { background:var(--warn-bg);color:var(--warn); }
.badge-danger { background:var(--danger-bg);color:var(--danger); }
.badge-info { background:var(--info-bg);color:var(--info); }
.badge-muted { background:var(--bg-tint);color:var(--muted); }
.chip { display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--r-pill);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:all 0.2s;white-space:nowrap;font-family:inherit; }
.chip:hover:not(.active) { border-color:var(--primary-3);color:var(--primary); }
.chip.active { background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(13,148,136,0.3); }

.inp { width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--surface);transition:border-color 0.2s,box-shadow 0.2s; }
.inp:focus { outline:none;border-color:var(--primary-3);box-shadow:0 0 0 3.5px var(--primary-wash-2); }
.inp::placeholder { color:var(--muted); }
label.lbl { font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px; }
.req-mark { color:var(--danger-soft);font-weight:700; }
.opt-mark { color:var(--muted);font-weight:500; }

.tbl { width:100%;border-collapse:collapse;font-size:13.5px; }
.tbl th { text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap; }
.tbl td { padding:12px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink-soft);vertical-align:middle; }
.tbl tr:last-child td { border-bottom:none; }
.tbl tr:hover td { background:var(--bg-tint); }
.tbl-wrap { overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--line-soft); }

.avatar { width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0; }

.hero-card { background:var(--grad-primary);border-radius:var(--r-lg);padding:28px 24px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg); }
.hero-card::before { content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.18) 1.4px,transparent 1.4px);background-size:15px 15px;-webkit-mask-image:linear-gradient(120deg,transparent 38%,#000 92%);mask-image:linear-gradient(120deg,transparent 38%,#000 92%); }
.hero-card::after { content:'';position:absolute;width:3px;height:56%;background:rgba(196,144,31,0.4);right:9%;top:22%;transform:rotate(11deg);border-radius:2px; }

.modal-backdrop { position:fixed;inset:0;background:rgba(15,32,26,0.55);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn 0.2s ease; }
.modal-box { background:var(--surface);border-radius:var(--r-lg);max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg); }

#toast-wrap { position:fixed;bottom:22px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 36px); }
.toast { background:var(--forest);color:#fff;padding:13px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn 0.3s ease both;max-width:340px; }
.toast.ok { background:linear-gradient(135deg,#166534,#22c55e); }
.toast.warn { background:linear-gradient(135deg,#92400e,#f59e0b); }
.toast.err { background:linear-gradient(135deg,#991b1b,#ef4444); }
@keyframes toastIn { from{opacity:0;transform:translateX(24px);} to{opacity:1;transform:translateX(0);} }

.divider { height:1px;background:var(--line-soft);margin:18px 0; }
.progress-track { height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden; }
.progress-fill { height:100%;border-radius:99px;background:var(--grad-gold); }
.emp-row { display:flex;align-items:center;gap:12px; }
.attend-pill { display:inline-flex;align-items:center;justify-content:center;padding:6px 4px;border-radius:9px;font-size:11.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);transition:all 0.15s;font-family:inherit;min-width:56px; }
.attend-pill:hover:not(.active) { border-color:var(--primary-3);color:var(--primary); }
.attend-pill.active-hadir { background:var(--ok-bg);border-color:var(--ok-soft);color:var(--ok); }
.attend-pill.active-sakit { background:var(--info-bg);border-color:#7dd3fc;color:var(--info); }
.attend-pill.active-izin { background:var(--warn-bg);border-color:var(--warn-soft);color:var(--warn); }
.attend-pill.active-alpha { background:var(--danger-bg);border-color:var(--danger-soft);color:var(--danger); }

.split-grid { display:grid; gap:18px; }
@media (max-width:860px) {
  .split-grid { grid-template-columns:1fr !important; }
  .stat-grid-4 { grid-template-columns:repeat(3,1fr) !important; }
}
@media (max-width:640px) {
  .wrap { padding:0 14px; }
  .stat-grid-4 { grid-template-columns:repeat(2,1fr) !important; }
}
@media (max-width:480px) {
  .tab-btn { padding:8px 12px;font-size:12px; }
}
html, body { overflow-x:hidden; max-width:100vw; }
</style>
</head>

<div id="toast-wrap"></div>
<div id="app"></div>

<script>
/* ============================= ICONS ============================= */
var ICONS = {
  home:'<path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V10"/>',

function icon(name, cls) { return '<svg class="ic '+(cls||'')+'" viewBox="0 0 24 24">'+(ICONS[name]||'')+'</svg>'; }

/* ============================= UTIL ============================= */
function uid(p) { return (p||'ID') + '-' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,6); }
function escapeHtml(s) { s = (s==null?'':String(s)); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function pad2(n) { return n < 10 ? '0'+n : ''+n; }
var HARI_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function fmtDateLong(d) { d = new Date(d); return HARI_ID[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN_ID[d.getMonth()] + ' ' + d.getFullYear(); }
function fmtDateShort(d) { d = new Date(d); return pad2(d.getDate()) + ' ' + BULAN_ID[d.getMonth()].slice(0,3) + ' ' + d.getFullYear(); }
function fmtDateISO(d) { d = new Date(d); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isWeekend(d) { var day = new Date(d).getDay(); return day === 0 || day === 6; }
function seededRand(seedStr) { var h = 0; for (var i=0;i<seedStr.length;i++) { h = (Math.imul(31,h) + seedStr.charCodeAt(i)) | 0; } var x = Math.sin(h) * 10000; return x - Math.floor(x); }
function fmtRupiah(n) { return 'Rp' + Math.round(n).toLocaleString('id-ID'); }
function showToast(msg, type) {
  var wrap = document.getElementById('toast-wrap');
  var el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  var iconName = type === 'ok' ? 'checkCircle' : (type === 'err' ? 'xCircle' : (type === 'warn' ? 'bell' : 'bell'));
  el.innerHTML = icon(iconName) + '<span>' + escapeHtml(msg) + '</span>';
  wrap.appendChild(el);
  setTimeout(function() { el.style.transition = 'opacity 0.3s, transform 0.3s'; el.style.opacity = '0'; el.style.transform = 'translateX(24px)'; setTimeout(function(){ el.remove(); }, 300); }, 3200);
}
function initialsOf(name) { var parts = name.replace(/^(Dr\.|Drs\.|H\.|Hj\.)\s*/,'').trim().split(/\s+/); return ((parts[0]||'')[0]||'') + ((parts[1]||'')[0]||''); }

/* --- Jadwal pelajaran: setiap kombinasi guru-kelas-mapel diberi slot hari & jam
   secara deterministik (seeded), sehingga tidak ada guru atau kelas yang bentrok
   pada hari dan jam yang sama. --- */
var HARI_SEKOLAH = ['Senin','Selasa','Rabu','Kamis','Jumat'];
var JAM_SLOTS = [
  { slot:1, mulai:'07:00', selesai:'07:40' },
  { slot:2, mulai:'07:40', selesai:'08:20' },
  { slot:3, mulai:'08:20', selesai:'09:00' },
  { slot:4, mulai:'09:15', selesai:'09:55' },
  { slot:5, mulai:'09:55', selesai:'10:35' },
  { slot:6, mulai:'10:35', selesai:'11:15' }
];
function jamOfSlot(slotNum) { for (var i=0;i<JAM_SLOTS.length;i++) { if (JAM_SLOTS[i].slot === slotNum) return JAM_SLOTS[i]; } return null; }

function getGuru(id) { for (var i=0;i<GURU.length;i++) { if (GURU[i].id === id) return GURU[i]; } return null; }
function getKelas(id) { for (var i=0;i<KELAS.length;i++) { if (KELAS[i].id === id) return KELAS[i]; } return null; }
function waliOf(kelasId) { var k = getKelas(kelasId); return k ? getGuru(k.waliId) : null; }
function totalJpGuru(guru) { var t = 0; guru.jadwal.forEach(function(j){ t += j.jp; }); return t; }
function isWaliKelas(guruId) { for (var i=0;i<KELAS.length;i++) { if (KELAS[i].waliId === guruId) return KELAS[i]; } return null; }
function TUNJANGAN_WALI() { return 500000; }
function TUNJANGAN_FUNGSIONAL() { return 350000; }
function RATE_PER_JAM() { return 38000; }
function hitungGaji(guru) {
  var jp = totalJpGuru(guru);
  var tunjJp = jp * 4 * RATE_PER_JAM();
  var tunjWali = isWaliKelas(guru.id) ? TUNJANGAN_WALI() : 0;
  var tunjFungsional = TUNJANGAN_FUNGSIONAL();
  var kotor = guru.gajiPokok + tunjJp + tunjWali + tunjFungsional;
  var potBpjs = Math.round(guru.gajiPokok * 0.02);
  var bersih = kotor - potBpjs;
  return { gajiPokok:guru.gajiPokok, jp:jp, tunjJp:tunjJp, tunjWali:tunjWali, tunjFungsional:tunjFungsional, kotor:kotor, potBpjs:potBpjs, bersih:bersih };
}

function genSiswa() {
  var list = [];
  var counter = 1;
  KELAS.forEach(function(k) {
    var n = 6;
    for (var i = 0; i < n; i++) {
      var r = seededRand(k.id + 'siswa' + i);
      var isL = r < 0.5;
      var firstNames = isL ? NAMA_L : NAMA_P;
      var fi = Math.floor(seededRand(k.id+i+'fn') * firstNames.length);
      var mi = Math.floor(seededRand(k.id+i+'mn') * MARGA.length);
      var nama = firstNames[fi] + ' ' + MARGA[mi];
      var nis = '2026' + pad2(counter);
      var nisn = '00' + (30000000 + counter * 137);
      list.push({ id:'S' + counter, nama:nama, nis:nis, nisn:nisn, kelasId:k.id, jk: isL ? 'L' : 'P' });
      counter++;
    }
  });
  return list;
}

function mapelForKelas(kelasId) {
  var out = [];
  GURU.forEach(function(g) {
    g.jadwal.forEach(function(j) {
      if (j.kelasId === kelasId) out.push({ mapelId:j.mapelId, guruId:g.id, jp:j.jp });
    });
  });
  return out;
}
function guruTeachesKelas(guruId, kelasId) {
  var g = getGuru(guruId);
  if (!g) return null;
  for (var i=0;i<g.jadwal.length;i++) { if (g.jadwal[i].kelasId === kelasId) return g.jadwal[i]; }
  return null;
}
function kelasOfGuru(guruId) {
  var g = getGuru(guruId);
  if (!g) return [];
  var seen = {}, out = [];
  g.jadwal.forEach(function(j) { if (!seen[j.kelasId]) { seen[j.kelasId] = true; out.push(getKelas(j.kelasId)); } });
  return out;
}

function buildJadwalSlots() {
  var guruUsed = {}, kelasUsed = {}, result = {};
  KELAS.forEach(function(k) {
    var entries = mapelForKelas(k.id);
    entries.forEach(function(e) {
      var order = [];
      HARI_SEKOLAH.forEach(function(h) { JAM_SLOTS.forEach(function(s) { order.push(h + '-' + s.slot); }); });
      var seed = k.id + e.guruId + e.mapelId;
      order.sort(function(a, b) { return seededRand(seed + a) - seededRand(seed + b); });
      for (var i = 0; i < order.length; i++) {
        var key = order[i];
        guruUsed[e.guruId] = guruUsed[e.guruId] || {};
        kelasUsed[k.id] = kelasUsed[k.id] || {};
        if (!guruUsed[e.guruId][key] && !kelasUsed[k.id][key]) {
          guruUsed[e.guruId][key] = true;
          kelasUsed[k.id][key] = true;
          var parts = key.split('-');
          result[e.guruId + '|' + k.id + '|' + e.mapelId] = { hari: parts[0], slot: parseInt(parts[1], 10) };
          break;
        }
      }
    });
  });
  return result;
}
var JADWAL_SLOTS = buildJadwalSlots();
function getJadwalSlot(guruId, kelasId, mapelId) { return JADWAL_SLOTS[guruId + '|' + kelasId + '|' + mapelId] || null; }
function jadwalGuruList(guruId) {
  var g = getGuru(guruId);
  if (!g) return [];
  var out = [];
  g.jadwal.forEach(function(j) {
    var slot = getJadwalSlot(guruId, j.kelasId, j.mapelId);
    if (slot) out.push({ kelasId:j.kelasId, mapelId:j.mapelId, jp:j.jp, hari:slot.hari, slot:slot.slot });
  });
  out.sort(function(a, b) { var hd = HARI_SEKOLAH.indexOf(a.hari) - HARI_SEKOLAH.indexOf(b.hari); return hd !== 0 ? hd : a.slot - b.slot; });
  return out;
}
function jadwalKelasList(kelasId) {
  var entries = mapelForKelas(kelasId);
  var out = [];
  entries.forEach(function(e) {
    var slot = getJadwalSlot(e.guruId, kelasId, e.mapelId);
    if (slot) out.push({ guruId:e.guruId, mapelId:e.mapelId, jp:e.jp, hari:slot.hari, slot:slot.slot });
  });
  out.sort(function(a, b) { var hd = HARI_SEKOLAH.indexOf(a.hari) - HARI_SEKOLAH.indexOf(b.hari); return hd !== 0 ? hd : a.slot - b.slot; });
  return out;
}

/* --- Statistik prestasi tahunan (untuk Kepsek) --- */
function getTrenTahunan() {
  var thisYear = parseInt(SCHOOL.tahunAjaran.slice(0, 4), 10);
  var avgNow = rataRataNilaiSekolah();
  var years = [];
  for (var i = 4; i >= 1; i--) {
    var yr = thisYear - i;
    var seed = 'tren' + yr;
    var nilai = 76 + Math.floor(seededRand(seed + 'n') * 10);
    var tuntas = 78 + Math.floor(seededRand(seed + 't') * 15);
    var lulus = 96 + Math.floor(seededRand(seed + 'l') * 4);
    years.push({ label: yr + '/' + (yr + 1), nilai: nilai, tuntas: tuntas, lulus: lulus });
  }
  var finals = getNilai().map(function(n) { return nilaiAkhir(n); }).filter(function(v) { return v != null; });
  var tuntasNow = finals.length ? Math.round((finals.filter(function(v){ return v >= KKM; }).length / finals.length) * 100) : null;
  years.push({ label: SCHOOL.tahunAjaran, nilai: avgNow == null ? 0 : avgNow, tuntas: tuntasNow == null ? 0 : tuntasNow, lulus: 98 });
  return years;
}

/* ============================= SEEDING ============================= */
function seedIfNeeded() {
  if (localStorage.getItem('sekolahku_seeded_v1')) return;
  var today = new Date();
  var todayIso = fmtDateISO(today);

  /* --- absensi siswa: 30 hari terakhir per siswa --- */
  var absSiswa = [];
  SISWA.forEach(function(s) {
    for (var back = 30; back >= 0; back--) {
      var day = addDays(today, -back);
      if (isWeekend(day)) continue;
      var iso = fmtDateISO(day);
      if (iso === todayIso) continue; /* hari ini sengaja dikosongkan agar terasa interaktif */
      var r = seededRand(s.id + iso + 'as');
      var status = r < 0.03 ? 'Alpha' : (r < 0.06 ? 'Sakit' : (r < 0.09 ? 'Izin' : 'Hadir'));
      absSiswa.push({ id: uid('AS'), siswaId: s.id, kelasId: s.kelasId, tanggal: iso, status: status });
    }
  });
  localStorage.setItem('sekolahku_absensi_siswa', JSON.stringify(absSiswa));

  /* --- absensi guru: 30 hari terakhir, hanya di hari guru punya jadwal --- */
  var absGuru = [];
  GURU.forEach(function(g) {
    for (var back = 30; back >= 0; back--) {
      var day = addDays(today, -back);
      if (isWeekend(day)) continue;
      var iso = fmtDateISO(day);
      var r = seededRand(g.id + iso + 'ag');
      var status, jamMasuk;
      if (r < 0.04) { status = 'Alpha'; jamMasuk = null; }
      else if (r < 0.07) { status = 'Sakit'; jamMasuk = null; }
      else if (r < 0.10) { status = 'Izin'; jamMasuk = null; }
      else {
        var lateRoll = seededRand(g.id + iso + 'lg');
        var isLate = lateRoll < 0.12;
        status = isLate ? 'Terlambat' : 'Hadir';
        var mh = isLate ? 7 : 6;
        var mm = isLate ? (16 + Math.floor(lateRoll*300)%35) : (45 + Math.floor(lateRoll*200)%14);
        if (mm >= 60) { mm -= 60; mh += 1; }
        var mDate = new Date(day); mDate.setHours(mh, mm, 0, 0);
        jamMasuk = mDate.toISOString();
      }
      absGuru.push({ id: uid('AG'), guruId: g.id, tanggal: iso, status: status, jamMasuk: jamMasuk });
    }
  });
  localStorage.setItem('sekolahku_absensi_guru', JSON.stringify(absGuru));

  /* --- nilai: tugas, uts, dan uas terisi penuh agar rapor & dashboard akademik langsung
     menunjukkan data lengkap. Kelas X-1 sengaja disisakan tanpa UAS pada mapel Matematika
     saja, supaya pengunjung yang login sebagai wali kelasnya (Siti Nurhaliza) tetap bisa
     mencoba fitur input nilai secara langsung dan melihat nilai akhir terhitung otomatis. --- */
  var nilai = [];
  KELAS.forEach(function(k) {
    var mapels = mapelForKelas(k.id);
    var siswaList = siswaByKelas(k.id);
    siswaList.forEach(function(s) {
      mapels.forEach(function(m) {
        var seed = s.id + m.mapelId;
        var tugas = 70 + Math.floor(seededRand(seed+'t') * 28);
        var uts = 65 + Math.floor(seededRand(seed+'u') * 32);
        var uas = 70 + Math.floor(seededRand(seed+'a') * 28);
        var isDemoKosong = (k.id === 'K1' && m.mapelId === 'M1');
        nilai.push({ id: uid('NL'), siswaId: s.id, kelasId: k.id, mapelId: m.mapelId, guruId: m.guruId, tahunAjaran: SCHOOL.tahunAjaran, semester: SCHOOL.semester, tugas: tugas, uts: uts, uas: isDemoKosong ? null : uas });
      });
    });
  });
  localStorage.setItem('sekolahku_nilai', JSON.stringify(nilai));

  /* --- status gaji: bulan lalu sudah dibayar, bulan ini belum --- */
  var gajiStatus = {};
  var lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  var lastKey = lastMonth.getFullYear() + '-' + pad2(lastMonth.getMonth()+1);
  var curKey = today.getFullYear() + '-' + pad2(today.getMonth()+1);
  GURU.forEach(function(g) {
    gajiStatus[g.id + '_' + lastKey] = 'Sudah Dibayar';
    gajiStatus[g.id + '_' + curKey] = 'Belum Dibayar';
  });
  localStorage.setItem('sekolahku_gaji_status', JSON.stringify(gajiStatus));

  /* --- pengumuman, kalender akademik, perpustakaan, inventaris --- */
  var pengumuman = PENGUMUMAN_SEED.map(function(p) {
    return { id: uid('PG'), judul:p.judul, isi:p.isi, penulisNama:p.penulisNama, penulisRole:p.penulisRole, tanggal: fmtDateISO(addDays(today, -p.hariLalu)), penting:p.penting };
  });
  localStorage.setItem('sekolahku_pengumuman', JSON.stringify(pengumuman));
  localStorage.setItem('sekolahku_kalender', JSON.stringify(seedKalenderEvents()));
  localStorage.setItem('sekolahku_buku', JSON.stringify(BUKU_SEED.map(function(b){ return Object.assign({id: uid('BK')}, b); })));
  localStorage.setItem('sekolahku_inventaris', JSON.stringify(INVENTARIS_SEED.map(function(v){ return Object.assign({id: uid('IV')}, v); })));
  localStorage.setItem('sekolahku_log', JSON.stringify([]));
  localStorage.setItem('sekolahku_pesan', JSON.stringify([]));

  localStorage.setItem('sekolahku_seeded_v1', '1');
}

function buildGlobalSearch() {
  return '<div class="search-wrap">' +
    '<input type="text" class="search-inp" id="global-search-inp" placeholder="Cari siswa atau guru" value="' + escapeHtml(state.searchQuery) + '" oninput="setSearchQuery(this.value)" onfocus="setSearchQuery(this.value)">' +
    icon('search', 'ic-muted') +
    (state.searchQuery.trim() ? buildSearchResults() : '') +
    '</div>';
}
function setSearchQuery(v) {
  state.searchQuery = v;
  var wrap = document.querySelector('.search-wrap');
  if (!wrap) return;
  var old = wrap.querySelector('.search-results');
  if (old) old.remove();
  if (v.trim()) wrap.insertAdjacentHTML('beforeend', buildSearchResults());
}
function buildSearchResults() {
  var q = state.searchQuery.trim().toLowerCase();
  if (!q) return '';
  var siswaMatches = [], guruMatches = [];
  if (state.role === 'admin' || state.role === 'kepsek') {
    siswaMatches = SISWA.filter(function(s){ return s.nama.toLowerCase().indexOf(q) !== -1 || s.nis.indexOf(q) !== -1; }).slice(0, 5);
    guruMatches = GURU.filter(function(g){ return g.nama.toLowerCase().indexOf(q) !== -1; }).slice(0, 4);
  } else if (state.role === 'guru') {
    var myKelas = kelasOfGuru(state.currentUser.id).map(function(k){ return k.id; });
    siswaMatches = SISWA.filter(function(s){ return myKelas.indexOf(s.kelasId) !== -1 && (s.nama.toLowerCase().indexOf(q) !== -1 || s.nis.indexOf(q) !== -1); }).slice(0, 6);
  }
  var rows = siswaMatches.map(function(s) {
    var k = getKelas(s.kelasId);
    return '<button class="search-result-row" onclick="openSiswaProfile(\'' + s.id + '\')">' + avatarHtml(s, 28) + '<div style="min-width:0;flex:1;text-align:left;"><div style="font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(s.nama) + '</div><div style="font-size:11px;color:var(--muted);">' + escapeHtml(k.nama) + ' &middot; ' + s.nis + '</div></div></button>';
  }).join('');
  var rowsGuru = guruMatches.map(function(g) {
    return '<button class="search-result-row" onclick="openGuruInfo(\'' + g.id + '\')">' + avatarHtml(g, 28) + '<div style="min-width:0;flex:1;text-align:left;"><div style="font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(g.nama) + '</div><div style="font-size:11px;color:var(--muted);">' + escapeHtml(g.gelar) + '</div></div></button>';
  }).join('');
  var body = rows + rowsGuru;
  if (!body) body = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:12.5px;">Tidak ditemukan.</div>';
  var sectionLabel = function(label) { return '<div style="padding:9px 12px 4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);">' + label + '</div>'; };
  return '<div class="search-results">' + (rows ? sectionLabel('Siswa') + rows : '') + (rowsGuru ? sectionLabel('Guru') + rowsGuru : '') + (!rows && !rowsGuru ? body : '') + '</div>';
}

function renderAbsensiTable() {

function buildGuruRapor() {
  var g = state.currentUser;
  var wk = isWaliKelas(g.id);
  if (!wk) return '<div class="card-surface" style="padding:30px;text-align:center;color:var(--muted);">Fitur ini khusus untuk wali kelas.</div>';
  var siswaList = siswaByKelas(wk.id).slice().sort(function(a,b){ return a.nama.localeCompare(b.nama); });
  var mapels = mapelForKelas(wk.id);
  var all = getNilai();
  var headerCols = mapels.map(function(m) { return '<th>' + escapeHtml(getMapel(m.mapelId).nama) + '</th>'; }).join('');
  var rows = siswaList.map(function(s, idx) {
    var total = 0, count = 0, belum = 0;
    var cols = mapels.map(function(m) {
      var n = null;
      for (var i=0;i<all.length;i++) { if (all[i].siswaId === s.id && all[i].mapelId === m.mapelId && all[i].kelasId === wk.id) { n = all[i]; break; } }
      var na = n ? nilaiAkhir(n) : null;
      if (na == null) { belum++; return '<td style="color:var(--muted);">-</td>'; }
      total += na; count++;
      return '<td style="font-weight:700;color:' + (na >= KKM ? 'var(--ok)' : 'var(--danger)') + ';">' + na + '</td>';
    }).join('');
    var avg = count ? Math.round(total / count) : null;
    return '<tr style="cursor:pointer;" onclick="openSiswaProfile(\'' + s.id + '\')"><td>' + (idx+1) + '</td><td><div style="font-weight:700;color:var(--ink);font-size:13.5px;">' + escapeHtml(s.nama) + '</div><div style="font-size:11.5px;color:var(--muted);">' + s.nis + '</div></td>' + cols +
      '<td style="font-weight:800;">' + (avg==null?'-':avg) + '</td>' +
      '<td>' + (belum > 0 ? '<span class="badge badge-muted">' + belum + ' belum UAS</span>' : (avg >= KKM ? statusBadge('Tuntas') : statusBadge('Belum Tuntas'))) + '</td></tr>';
  }).join('');
  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:4px;">' +
    '<div style="display:flex;align-items:center;gap:9px;">' + icon('clipboard','ic-primary') + '<h2 class="font-display" style="font-size:16.5px;font-weight:800;margin:0;">Rapor Kelas ' + escapeHtml(wk.nama) + '</h2></div>' +

    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>No</th><th>Nama Siswa</th>' + headerCols + '<th>Rata-rata</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</div>';
}

/* ============================= GURU: JADWAL MINGGUAN ============================= */
function jadwalGridHtml(entries, labelFn, colorFn) {
  var byCell = {};
  entries.forEach(function(e) { byCell[e.hari + '-' + e.slot] = e; });
  var head = '<div class="jadwal-cell jadwal-head">Jam</div>' + HARI_SEKOLAH.map(function(h) { return '<div class="jadwal-cell jadwal-head">' + h + '</div>'; }).join('');
  var rows = JAM_SLOTS.map(function(js) {
    var timeCell = '<div class="jadwal-cell" style="font-weight:700;color:var(--muted);display:flex;flex-direction:column;justify-content:center;">' + js.mulai + '<br>' + js.selesai + '</div>';
    var dayCells = HARI_SEKOLAH.map(function(h) {
      var e = byCell[h + '-' + js.slot];
      if (!e) return '<div class="jadwal-cell"></div>';
      var color = colorFn(e);
      return '<div class="jadwal-cell" style="background:' + color + '1a;border-left:3px solid ' + color + ';"><div style="font-weight:800;color:' + color + ';">' + labelFn(e) + '</div></div>';
    }).join('');
    return timeCell + dayCells;
  }).join('');
  return '<div class="jadwal-grid">' + head + rows + '</div>';
}
function buildGuruJadwal() {
  var g = state.currentUser;
  var entries = jadwalGuruList(g.id);
  if (!entries.length) return '<div class="card-surface" style="padding:30px;text-align:center;color:var(--muted);">Anda belum memiliki jadwal mengajar.</div>';
  var grid = jadwalGridHtml(entries, function(e) { var k = getKelas(e.kelasId); return escapeHtml(k.nama); }, function(e) { return kelasColor(getKelas(e.kelasId)); });
  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:4px;">' + icon('calendar','ic-primary') + '<h2 class="font-display" style="font-size:17px;font-weight:800;margin:0;">Jadwal Mengajar Mingguan</h2></div>' +
    '<p style="font-size:12.5px;color:var(--muted);margin:2px 0 16px;">Tahun Ajaran ' + SCHOOL.tahunAjaran + ' &middot; Semester ' + SCHOOL.semester + '</p>' +

}

/* ============================= ADMIN: RINGKASAN ============================= */

  var hadirGuru = absGuru.filter(function(a){ return a.status === 'Hadir' || a.status === 'Terlambat'; }).length;

  var statTile = function(label, value, iconName, accent) {
    return '<div class="stat-tile" style="--accent:' + accent + ';">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;">' +
      '<div><div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;">' + label + '</div>' +
      '<div class="font-display" style="font-size:26px;font-weight:800;margin-top:3px;">' + value + '</div></div>' +
      '<div class="stat-icon-badge" style="background:' + accent + '1a;color:' + accent + ';">' + icon(iconName) + '</div></div></div>';

  var kelasRows = KELAS.map(function(k) {

      '<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;">' + escapeHtml(k.nama) + '</div><div style="font-size:11.5px;color:var(--muted);">Wali: ' + escapeHtml(wali.nama) + '</div></div>' +
      '<span class="badge badge-muted">' + n + ' siswa</span></div>';
  }).join('');

  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;">' +
    '<div><h2 class="font-display" style="font-size:19px;font-weight:800;margin:0;">Ringkasan Sekolah</h2><p style="font-size:12.5px;color:var(--muted);margin:3px 0 0;">' + fmtDateLong(new Date()) + '</p></div>' +
    '</div>' +

    statTile('Total Siswa', siswaAktif().length, 'users', '#0d9488') +
    statTile('Total Guru', GURU.length, 'user', '#4338ca') +
    statTile('Hadir Hari Ini (Siswa)', hadirSiswa, 'checkCircle', '#15803d') +
    statTile('Hadir Hari Ini (Guru)', hadirGuru, 'briefcase', '#b45309') +
    '</div>' +
    buildInfoSekolahWidget() +
    '<div class="split-grid" style="grid-template-columns:1.3fr 1fr;">' +
    '<div class="card-surface" style="padding:20px;">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;">' + icon('trend','ic-primary') + '<span style="font-weight:800;font-size:14.5px;">Tren Kehadiran Siswa 14 Hari Terakhir</span></div>' +
    '<div style="height:230px;"><canvas id="chart-trend-siswa"></canvas></div>' +
    '</div>' +
    '<div class="card-surface" style="padding:20px;">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;">' + icon('school','ic-primary') + '<span style="font-weight:800;font-size:14.5px;">Daftar Kelas</span></div>' +
    kelasRows +

    '</div>';

function renderSiswaTable() {
  var mount = document.getElementById('siswa-table-mount');
  if (!mount) return;
  var list = state.siswaFilterKelas === 'Semua' ? siswaAktif().slice() : siswaByKelas(state.siswaFilterKelas).slice();
  var q = state.siswaSearch.trim().toLowerCase();
  if (q) { list = list.filter(function(s){ return s.nama.toLowerCase().indexOf(q) !== -1 || s.nis.indexOf(q) !== -1; }); }
  list.sort(function(a,b){ return a.nama.localeCompare(b.nama); });
  var rows = list.length ? list.map(function(s) {
    var k = getKelas(s.kelasId);
    return '<tr style="cursor:pointer;" onclick="openSiswaProfile(\'' + s.id + '\')"><td><div style="font-weight:700;color:var(--ink);font-size:13.5px;">' + escapeHtml(s.nama) + '</div><div style="font-size:11.5px;color:var(--muted);">NISN ' + s.nisn + '</div></td><td>' + s.nis + '</td><td><span style="display:inline-flex;align-items:center;gap:7px;"><span style="width:8px;height:8px;border-radius:50%;background:' + kelasColor(k) + ';display:inline-block;"></span>' + escapeHtml(k.nama) + '</span></td><td>' + (s.jk === 'L' ? 'Laki-laki' : 'Perempuan') + '</td></tr>';
  }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px;">Tidak ada siswa yang sesuai pencarian.</td></tr>';
  mount.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nama</th><th>NIS</th><th>Kelas</th><th>Jenis Kelamin</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +

}

/* ============================= KEPSEK: RINGKASAN ============================= */
function rataRataKehadiranSiswa30Hari() {
  var all = getAbsensiSiswa();
  var thirty = [];
  for (var i = 29; i >= 0; i--) { thirty.push(fmtDateISO(addDays(new Date(), -i))); }
  var recs = all.filter(function(a){ return thirty.indexOf(a.tanggal) !== -1; });
  if (!recs.length) return 0;
  var hadir = recs.filter(function(a){ return a.status === 'Hadir'; }).length;
  return Math.round((hadir / recs.length) * 100);
}
function rataRataNilaiSekolah() {
  var all = getNilai();
  var withFinal = all.map(function(n){ return nilaiAkhir(n); }).filter(function(v){ return v != null; });
  if (!withFinal.length) return null;
  var sum = withFinal.reduce(function(a,b){ return a+b; }, 0);
  return Math.round(sum / withFinal.length);
}

function buildPunctualityList() {

      '<p style="font-size:13px;color:var(--ink-soft);margin:5px 0 0;line-height:1.5;">' + escapeHtml(m.isi) + '</p>' +
      '</div>';
  };
  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:16px;">' + icon('users','ic-primary') + '<h2 class="font-display" style="font-size:17px;font-weight:800;margin:0;">Pesan Antar Peran</h2></div>' +
    '<div class="card-surface" style="padding:18px 20px;margin-bottom:16px;">' +
    '<div style="font-weight:800;font-size:14px;margin-bottom:12px;">Tulis Pesan</div>' +
    '<div style="display:flex;flex-direction:column;gap:10px;">' +
    '<select id="ps-untuk" class="inp">' + opsiTujuan.map(function(o){ return '<option value="' + o[0] + '">' + escapeHtml(o[1]) + '</option>'; }).join('') + '</select>' +
    '<textarea id="ps-isi" class="inp" rows="3" placeholder="Tulis pesan atau catatan singkat" style="resize:vertical;font-family:inherit;"></textarea>' +
    '<button class="btn btn-primary" style="align-self:flex-start;" onclick="submitPesan()">' + icon('checkCircle') + ' Kirim Pesan</button>' +
    '</div></div>' +
    '<div class="split-grid" style="grid-template-columns:1fr 1fr;">' +
    '<div class="card-surface" style="padding:18px 20px;">' +
    '<div style="font-weight:800;font-size:14px;margin-bottom:4px;">Pesan Masuk</div>' +
    (masuk.length ? masuk.map(function(m){ return pesanRow(m, true); }).join('') : '<p style="font-size:12.5px;color:var(--muted);padding:10px 0;">Belum ada pesan masuk.</p>') +
    '</div>' +
    '<div class="card-surface" style="padding:18px 20px;">' +
    '<div style="font-weight:800;font-size:14px;margin-bottom:4px;">Pesan Terkirim</div>' +
    (terkirim.length ? terkirim.map(function(m){ return pesanRow(m, false); }).join('') : '<p style="font-size:12.5px;color:var(--muted);padding:10px 0;">Belum ada pesan terkirim.</p>') +
    '</div></div>' +
    '</div>';
}

/* ============================= LOG AKTIVITAS (Admin TU) ============================= */
function buildLog() {
  var log = getLog();
  var rows = log.length ? log.map(function(l) {
    var d = new Date(l.waktu);
    var jam = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    return '<div style="display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);">' +
      '<div class="stat-icon-badge" style="width:32px;height:32px;background:var(--primary-wash);color:var(--primary);flex-shrink:0;">' + icon('history') + '</div>' +
      '<div style="flex:1;min-width:0;"><div style="font-size:13px;color:var(--ink);"><span style="font-weight:700;">' + escapeHtml(l.pelaku) + '</span> ' + escapeHtml(l.deskripsi) + '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:2px;">' + fmtDateShort(l.waktu) + ' &middot; ' + jam + '</div></div>' +
      '</div>';
  }).join('') : '<div style="padding:30px;text-align:center;color:var(--muted);">Belum ada aktivitas tercatat.</div>';
  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:16px;">' + icon('history','ic-primary') + '<h2 class="font-display" style="font-size:17px;font-weight:800;margin:0;">Log Aktivitas</h2></div>' +
    '<p style="font-size:12.5px;color:var(--muted);margin:-10px 0 16px;">Mencatat perubahan data yang dilakukan melalui sistem, seperti input nilai, absensi, status gaji, dan pengumuman.</p>' +
    '<div class="card-surface" style="padding:18px 20px;">' + rows + '</div>' +
    '</div>';
}

/* ============================= PENGATURAN AKUN (semua peran) ============================= */
var AVATAR_COLOR_OPTIONS = ['#0d6b52','#4338ca','#c2410c','#7c3aed','#be185d','#0369a1','#a06f13','#15803d'];
function pilihWarnaAvatar(color) {
  setAkunPref(state.currentUser.id, 'warna', color);
  render();
  showToast('Warna avatar diperbarui.', 'ok');
}
function simpanKataSandiDemo() {
  showToast('Ini demo portfolio, perubahan kata sandi tidak benar-benar disimpan ke server.', 'warn');
}
function buildPengaturan() {
  var user = state.currentUser;
  var currentColor = akunPrefColor(user.id) || 'var(--primary)';
  var swatches = AVATAR_COLOR_OPTIONS.map(function(c) {
    var active = currentColor === c;
    return '<button onclick="pilihWarnaAvatar(\'' + c + '\')" style="width:34px;height:34px;border-radius:50%;background:' + c + ';border:2.5px solid ' + (active ? 'var(--ink)' : 'transparent') + ';cursor:pointer;padding:0;box-shadow:' + (active ? '0 0 0 2px var(--surface), 0 0 0 3.5px ' + c : 'none') + ';"></button>';
  }).join('');
  return '<div class="fade-in">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-bottom:16px;">' + icon('user','ic-primary') + '<h2 class="font-display" style="font-size:17px;font-weight:800;margin:0;">Pengaturan Akun</h2></div>' +
    '<div class="split-grid" style="grid-template-columns:1fr 1fr;">' +
    '<div class="card-surface" style="padding:20px;">' +
    '<div style="display:flex;align-items:center;gap:13px;margin-bottom:18px;">' + avatarHtml(user, 52) + '<div><div style="font-weight:800;font-size:14.5px;">' + escapeHtml(user.nama) + '</div><div style="font-size:12px;color:var(--muted);">' + escapeHtml(user.gelar || '') + '</div></div></div>' +
    '<label class="lbl">Warna Avatar</label>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;">' + swatches + '</div>' +
    '</div>' +
    '<div class="card-surface" style="padding:20px;">' +
    '<div style="font-weight:800;font-size:14px;margin-bottom:14px;">Keamanan Akun</div>' +
    '<label class="lbl">Kata Sandi Baru</label>' +
    '<input type="password" class="inp" placeholder="Masukkan kata sandi baru" style="margin-bottom:12px;">' +
    '<label class="lbl">Konfirmasi Kata Sandi</label>' +
    '<input type="password" class="inp" placeholder="Ulangi kata sandi baru" style="margin-bottom:16px;">' +
    '<button class="btn btn-secondary" onclick="simpanKataSandiDemo()">' + icon('checkCircle') + ' Simpan Perubahan</button>' +
    '<p style="font-size:11.5px;color:var(--muted);margin-top:12px;">Fitur ini bersifat simulasi untuk keperluan demo portfolio.</p>' +
    '</div></div></div>';
}

/* ============================= CHARTS ============================= */
function destroyChart(key) { if (state.charts[key]) { state.charts[key].destroy(); delete state.charts[key]; } }
function trendKehadiranData() {
  var all = getAbsensiSiswa();
  var labels = [], hadirPct = [];
  for (var i = 13; i >= 0; i--) {
    var day = addDays(new Date(), -i);
    var iso = fmtDateISO(day);
    labels.push(pad2(day.getDate()) + '/' + pad2(day.getMonth()+1));
    var dayRecs = all.filter(function(a){ return a.tanggal === iso; });
    var hadir = dayRecs.filter(function(a){ return a.status === 'Hadir'; }).length;
    hadirPct.push(dayRecs.length ? Math.round((hadir/dayRecs.length)*100) : null);
  }
  return { labels: labels, hadirPct: hadirPct };
}
function drawTrendChart(canvasId, chartKey) {
  var canvas = document.getElementById(canvasId);
  if (!canvas || typeof Chart === 'undefined') return;
  destroyChart(chartKey);
  var data = trendKehadiranData();
  state.charts[chartKey] = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels: data.labels, datasets: [{ label:'Kehadiran Siswa (%)', data: data.hadirPct, borderColor:'#0d9488', backgroundColor:'rgba(13,148,136,0.1)', tension:0.35, fill:true, pointRadius:2.5 }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:false, min:70, max:100, ticks:{callback:function(v){return v+'%';}, font:{size:10.5}},grid:{color:'#eef0f7'}}, x:{ticks:{font:{size:10.5}},grid:{display:false}} } }
  });
}
function renderCharts() {
  if (typeof Chart === 'undefined') return;
  if (state.role === 'admin' && state.tab === 'ringkasan') { drawTrendChart('chart-trend-siswa', 'trendSiswa'); }
  if (state.role === 'kepsek' && state.tab === 'ringkasan') {
    drawTrendChart('chart-trend-kepsek', 'trendKepsek');
    var kehadiranCanvas = document.getElementById('chart-kehadiran-kelas');
    if (kehadiranCanvas) {
      destroyChart('kehadiranKelas');
      var thirty = [];
      for (var ti = 29; ti >= 0; ti--) { thirty.push(fmtDateISO(addDays(new Date(), -ti))); }
      var absAll = getAbsensiSiswa().filter(function(a){ return thirty.indexOf(a.tanggal) !== -1; });
      var kLabels = KELAS.map(function(k){ return k.nama; });
      var kColors = KELAS.map(function(k){ return kelasColor(k); });
      var kPct = KELAS.map(function(k) {
        var recs = absAll.filter(function(a){ return a.kelasId === k.id; });
        if (!recs.length) return 0;
        var hadir = recs.filter(function(a){ return a.status === 'Hadir'; }).length;
        return Math.round((hadir / recs.length) * 100);
      });
      state.charts.kehadiranKelas = new Chart(kehadiranCanvas.getContext('2d'), {
        type: 'bar',
        data: { labels: kLabels, datasets: [{ label:'Kehadiran (%)', data: kPct, backgroundColor: kColors, borderRadius:6, maxBarThickness:34 }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, max:100, ticks:{callback:function(v){return v+'%';}, font:{size:10.5}},grid:{color:'#eef0f7'}}, x:{ticks:{font:{size:9.5}},grid:{display:false}} } }
      });
    }
  }
  if (state.role === 'kepsek' && state.tab === 'akademik') {
    var nilaiCanvas = document.getElementById('chart-nilai-kelas');
    var tuntasCanvas = document.getElementById('chart-tuntas-kelas');
    var avgList = [], pctList = [];
    KELAS.forEach(function(k) {
      var all = getNilai().filter(function(n){ return n.kelasId === k.id; });
      var finals = all.map(function(n){ return nilaiAkhir(n); }).filter(function(v){ return v != null; });
      avgList.push(finals.length ? Math.round(finals.reduce(function(a,b){return a+b;},0)/finals.length) : 0);
      var tuntas = finals.filter(function(v){ return v >= KKM; }).length;
      pctList.push(finals.length ? Math.round((tuntas/finals.length)*100) : 0);
    });
    var labels = KELAS.map(function(k){ return k.nama; });
    var colors = KELAS.map(function(k){ return kelasColor(k); });
    if (nilaiCanvas) {
      destroyChart('nilaiKelas');
      state.charts.nilaiKelas = new Chart(nilaiCanvas.getContext('2d'), {
        type: 'bar',
        data: { labels: labels, datasets: [{ label:'Rata-rata Nilai', data: avgList, backgroundColor: colors, borderRadius:6, maxBarThickness:38 }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, max:100, ticks:{font:{size:10.5}},grid:{color:'#eef0f7'}}, x:{ticks:{font:{size:9.5}},grid:{display:false}} } }
      });
    }
    if (tuntasCanvas) {
      destroyChart('tuntasKelas');
      state.charts.tuntasKelas = new Chart(tuntasCanvas.getContext('2d'), {
        type: 'bar',
        data: { labels: labels, datasets: [{ label:'% Tuntas KKM', data: pctList, backgroundColor: colors, borderRadius:6, maxBarThickness:38 }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, max:100, ticks:{callback:function(v){return v+'%';}, font:{size:10.5}},grid:{color:'#eef0f7'}}, x:{ticks:{font:{size:9.5}},grid:{display:false}} } }
      });
    }
    var mount = document.getElementById('akademik-table-mount');
    if (mount) mount.innerHTML = buildAkademikTable();
    var trenCanvas = document.getElementById('chart-tren-tahunan');
    if (trenCanvas) {
      destroyChart('trenTahunan');
      var tren = getTrenTahunan();
      state.charts.trenTahunan = new Chart(trenCanvas.getContext('2d'), {
        type: 'line',
        data: { labels: tren.map(function(t){return t.label;}), datasets: [
          { label:'Rata-rata Nilai', data: tren.map(function(t){return t.nilai;}), borderColor:'#0d9488', backgroundColor:'rgba(13,148,136,0.08)', tension:0.3, fill:true, pointRadius:3 },
          { label:'% Tuntas KKM', data: tren.map(function(t){return t.tuntas;}), borderColor:'#a06f13', backgroundColor:'rgba(160,111,19,0.06)', tension:0.3, fill:true, pointRadius:3 }
        ] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:true, position:'bottom', labels:{boxWidth:12, font:{size:11}}}}, scales:{ y:{beginAtZero:true, max:100, ticks:{font:{size:10.5}},grid:{color:'#eef0f7'}}, x:{ticks:{font:{size:10.5}},grid:{display:false}} } }
      });
    }
  }
  if (state.role === 'kepsek' && state.tab === 'kepegawaian') { buildPunctualityList(); }
  if (state.role === 'kepsek' && state.tab === 'keuangan') {
    var gajiCanvas = document.getElementById('chart-gaji-guru');
    if (gajiCanvas) {
      destroyChart('gajiGuru');
      var labels2 = GURU.map(function(g){ return g.nama.split(',')[0].split(' ')[0]; });
      var data2 = GURU.map(function(g){ return hitungGaji(g).bersih; });
      state.charts.gajiGuru = new Chart(gajiCanvas.getContext('2d'), {
        type: 'bar',
        data: { labels: labels2, datasets: [{ label:'Gaji Bersih', data: data2, backgroundColor:'#0d9488', borderRadius:6, maxBarThickness:34 }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:function(ctx){ return fmtRupiah(ctx.parsed.y); }}}}, scales:{ y:{beginAtZero:true, ticks:{callback:function(v){ return 'Rp' + (v/1000000).toFixed(1) + 'jt'; }, font:{size:10}},grid:{color:'#eef0f7'}}, x:{ticks:{font:{size:10}},grid:{display:false}} } }
      });
    }
  }
}

/* ============================= MAIN RENDER ============================= */
function render() {
  window.scrollTo(0, 0);
  var app = document.getElementById('app');
  if (state.view === 'login') { app.innerHTML = buildLogin() + '<div id="modal-root"></div>'; return; }
  var body = '';
  if (state.tab === 'pengumuman') { body = buildPengumuman(); }
  else if (state.tab === 'kalender') { body = buildKalender(); }
  else if (state.tab === 'pesan') { body = buildPesan(); }
  else if (state.tab === 'pengaturan') { body = buildPengaturan(); }
  else if (state.tab === 'log' && state.role === 'admin') { body = buildLog(); }
  else if (state.role === 'guru') {
    if (state.tab === 'beranda') body = buildGuruBeranda();
    else if (state.tab === 'absensi') body = buildGuruAbsensi();
    else if (state.tab === 'nilai') body = buildGuruNilai();
    else if (state.tab === 'rapor') body = buildGuruRapor();
    else if (state.tab === 'slipgaji') body = buildGuruSlipGaji();
    else if (state.tab === 'jadwal') body = buildGuruJadwal();
  } else if (state.role === 'admin') {
    if (state.tab === 'ringkasan') body = buildAdminRingkasan();
    else if (state.tab === 'siswa') body = buildAdminSiswa();
    else if (state.tab === 'guru') body = buildAdminGuru();
    else if (state.tab === 'kelas') body = buildAdminKelas();
    else if (state.tab === 'absguru') body = buildAdminAbsGuru();
    else if (state.tab === 'gaji') body = buildAdminGaji();
    else if (state.tab === 'perpustakaan') body = buildAdminPerpustakaan();
  } else if (state.role === 'kepsek') {
    if (state.tab === 'ringkasan') body = buildKepsekRingkasan();
    else if (state.tab === 'akademik') body = buildKepsekAkademik();
    else if (state.tab === 'kepegawaian') body = buildKepsekKepegawaian();
    else if (state.tab === 'keuangan') body = buildKepsekKeuangan();
  }
  app.innerHTML = buildTopbar() + '<div class="wrap" style="padding-top:22px;padding-bottom:8px;min-height:60vh;">' + body + '</div>' + buildFooter() + '<div id="modal-root"></div>';
  if (state.role === 'guru' && state.tab === 'absensi') { renderAbsensiTable(); }
  if (state.role === 'guru' && state.tab === 'nilai') { renderNilaiTable(); }
  if (state.role === 'admin' && state.tab === 'siswa') { renderSiswaTable(); }
  var needsChart = (state.role === 'admin' && state.tab === 'ringkasan') ||
    (state.role === 'kepsek' && (state.tab === 'ringkasan' || state.tab === 'akademik' || state.tab === 'kepegawaian' || state.tab === 'keuangan'));
  if (needsChart) { setTimeout(renderCharts, 50); }
  scrollActiveTabIntoView();
}
function scrollActiveTabIntoView() {
  var nav = document.getElementById('topbar-nav');
  var btn = nav ? nav.querySelector('.tab-btn.active') : null;
  if (!nav || !btn) return;
  /* Adjust only the nav strip's own horizontal scroll position (never the page's
     vertical scroll) so the active tab is visible without disturbing scroll-to-top. */
  var navRect = nav.getBoundingClientRect();
  var btnRect = btn.getBoundingClientRect();
  if (btnRect.left < navRect.left) {
    nav.scrollLeft -= (navRect.left - btnRect.left) + 16;
  } else if (btnRect.right > navRect.right) {
    nav.scrollLeft += (btnRect.right - navRect.right) + 16;
  }
}

/* ============================= INIT ============================= */
document.addEventListener('click', function(e) {
  var wrap = document.querySelector('.search-wrap');
  if (wrap && !wrap.contains(e.target)) { clearSearchDropdown(); }
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    clearSearchDropdown();
    var modalRoot = document.getElementById('modal-root');
    if (modalRoot && modalRoot.innerHTML.trim()) closeModal();
  }
});
seedIfNeeded();
render();
</script>
