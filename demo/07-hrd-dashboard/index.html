:root {
  --primary: #2563eb;
  --primary-light: #3b82f6;
  --primary-dark: #1d4ed8;
  --primary-bg: rgba(37,99,235,0.08);
  --success: #16a34a;
  --success-bg: rgba(22,163,74,0.1);
  --warning: #d97706;
  --warning-bg: rgba(217,119,6,0.1);
  --danger: #dc2626;
  --danger-bg: rgba(220,38,38,0.1);
  --info: #0891b2;
  --info-bg: rgba(8,145,178,0.1);
  --purple: #7c3aed;
  --purple-bg: rgba(124,58,237,0.1);
  --sidebar-bg: #0f1729;
  --sidebar-text: #94a3b8;
  --body-bg: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #64748b;
  --border-color: #e2e8f0;

}
* { box-sizing: border-box; }
body { font-family: var(--font); background: var(--body-bg); color: var(--text-primary); margin: 0; }
.fade-in { animation: fadeIn 0.4s ease forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.spinner-inline { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
.spinner-block { width: 32px; height: 32px; border: 3px solid rgba(37,99,235,0.2); border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite; display: block; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.logout-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; }
.logout-modal-box { background: white; border-radius: 16px; padding: 28px; width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: fadeIn 0.2s ease forwards; }

.sidebar { width: 240px; min-height: 100vh; background: var(--sidebar-bg); position: fixed; top: 0; left: 0; z-index: 100; display: flex; flex-direction: column; transition: transform 0.3s; }

.brand-logo { width: 36px; height: 36px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 14px; flex-shrink: 0; }
.brand-name { color: white; font-weight: 700; font-size: 15px; margin-left: 10px; }
.brand-sub { color: var(--sidebar-text); font-size: 11px; margin-left: 10px; }
.sidebar-nav { padding: 12px 0; flex: 1; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; color: var(--sidebar-text); text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.2s; cursor: pointer; border: none; background: none; width: 100%; text-align: left; border-right: 3px solid transparent; }
.nav-item:hover { color: white; background: rgba(255,255,255,0.06); }
.nav-item.active { color: white; background: rgba(37,99,235,0.25); border-right-color: var(--primary-light); }
.nav-item svg { flex-shrink: 0; opacity: 0.7; }
.nav-item.active svg, .nav-item:hover svg { opacity: 1; }
.nav-badge { margin-left: auto; background: var(--danger); color: white; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.08); }
.user-info { display: flex; align-items: center; gap: 10px; }
.user-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: white; flex-shrink: 0; }
.user-name { color: white; font-size: 13px; font-weight: 600; }
.user-role { color: var(--sidebar-text); font-size: 11px; }
.main-content { margin-left: 240px; min-height: 100vh; }
.topbar { background: white; border-bottom: 1px solid var(--border-color); padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 99; }
.topbar-title { font-weight: 700; font-size: 16px; color: var(--text-primary); }
.topbar-sub { color: var(--text-secondary); font-size: 13px; margin-top: 1px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.content-area { padding: 24px; }
.page-section { display: none; }
.page-section.active { display: block; animation: fadeIn 0.25s ease forwards; }
.stat-card { background: white; border-radius: 14px; padding: 20px; border: 1px solid var(--border-color); transition: box-shadow 0.2s; }
.stat-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.stat-val { font-size: 26px; font-weight: 800; color: var(--text-primary); line-height: 1.1; }
.stat-label { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
.card-section { background: white; border-radius: 14px; border: 1px solid var(--border-color); overflow: hidden; }
.card-header-custom { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.card-header-title { font-weight: 700; font-size: 14px; color: var(--text-primary); }
.card-body-custom { padding: 20px; }
.chart-container { position: relative; height: 240px; }
.badge-status { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-hadir { background: var(--success-bg); color: var(--success); }
.badge-terlambat { background: var(--warning-bg); color: var(--warning); }
.badge-absen { background: var(--danger-bg); color: var(--danger); }
.badge-wfh { background: var(--info-bg); color: var(--info); }
.badge-izin { background: var(--purple-bg); color: var(--purple); }
.badge-pending { background: var(--warning-bg); color: var(--warning); }
.badge-approved { background: var(--success-bg); color: var(--success); }
.badge-rejected { background: var(--danger-bg); color: var(--danger); }
.badge-active { background: var(--success-bg); color: var(--success); }
.badge-inactive { background: rgba(100,116,139,0.1); color: #64748b; }
.badge-dept { background: var(--primary-bg); color: var(--primary); }
.table-custom { width: 100%; border-collapse: collapse; font-size: 13px; }
.table-custom th { padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border-color); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; background: #f8fafc; }
.table-custom td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
.table-custom tr:last-child td { border-bottom: none; }
.table-custom tr:hover td { background: #f8fafc; }
.emp-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: white; flex-shrink: 0; }
.search-input { border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-family: var(--font); outline: none; transition: border-color 0.2s; }
.search-input:focus { border-color: var(--primary-light); }
.btn-primary-custom { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; font-family: var(--font); cursor: pointer; transition: background 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary-custom:hover { background: var(--primary-dark); }
.btn-primary-custom:disabled { opacity: 0.7; cursor: not-allowed; }
.btn-outline-custom { background: white; color: var(--text-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; font-family: var(--font); cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.btn-outline-custom:hover { border-color: var(--primary-light); color: var(--primary); }
.btn-sm-icon { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border-color); background: white; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: all 0.2s; }
.btn-sm-icon:hover { border-color: var(--primary-light); color: var(--primary); }
.login-screen { min-height: 100vh; background: linear-gradient(135deg, #0f1729 0%, #1e3a5f 100%); display: flex; align-items: center; justify-content: center; }
.login-card { background: white; border-radius: 20px; padding: 40px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: fadeIn 0.4s ease forwards; }
.login-logo { width: 52px; height: 52px; background: var(--primary); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 20px; margin-bottom: 20px; }
.login-title { font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; }
.login-sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }
.form-group { margin-bottom: 16px; }
.form-label-custom { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
.form-control-custom { width: 100%; border: 1.5px solid var(--border-color); border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: var(--font); outline: none; transition: border-color 0.2s; }
.form-control-custom:focus { border-color: var(--primary-light); }
.role-selector { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.role-opt { border: 1.5px solid var(--border-color); border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
.role-opt:hover { border-color: var(--primary-light); }
.role-opt.selected { border-color: var(--primary); background: var(--primary-bg); }
.role-opt-name { font-size: 12px; font-weight: 700; color: var(--text-primary); }
.role-opt-sub { font-size: 10px; color: var(--text-secondary); }
.activity-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.activity-text { font-size: 13px; color: var(--text-primary); }
.activity-time { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.training-card { border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; transition: box-shadow 0.2s; }

.training-progress { height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.training-progress-bar { height: 100%; border-radius: 3px; transition: width 0.5s; }
.leave-form { background: #f8fafc; border-radius: 12px; padding: 16px; border: 1px solid var(--border-color); }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); position: absolute; top: 2px; right: 2px; }
.slip-gaji { display: none; }
@media print {
  body * { visibility: hidden; }
  .slip-gaji, .slip-gaji * { visibility: visible; display: block !important; }
  .slip-gaji { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 40px; }
}
@media (max-width: 991px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.mob-open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .mob-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; display: none; }

.filter-select { border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: var(--font); outline: none; cursor: pointer; background: white; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
.empty-state svg { margin-bottom: 12px; opacity: 0.3; }
.empty-state p { font-size: 14px; }
</style>
</head>

function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var pass = document.getElementById('login-pass').value.trim();
  var errEl = document.getElementById('login-error');
  if (!email || !pass) {
    errEl.textContent = 'Email dan password wajib diisi.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  var btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>Memverifikasi...';
  setTimeout(function() {
    currentUser = USERS[currentRole];
    localStorage.setItem('sdmpro_role', currentRole);
    document.getElementById('login-screen').style.display = 'none';
    var appScreen = document.getElementById('app-screen');
    appScreen.style.display = 'block';
    appScreen.classList.add('fade-in');
    setTimeout(function(){ appScreen.classList.remove('fade-in'); }, 400);
    btn.disabled = false;
    btn.innerHTML = 'Masuk';
    initApp();
  }, 1400);
}

function downloadCsv(rows, filename) {
  var csv = rows.map(function(r){ return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

var saved = localStorage.getItem('sdmpro_role');
if (saved && USERS[saved]) {
  currentRole = saved;
  currentUser = USERS[saved];
  document.getElementById('login-screen').style.display = 'none';
  var appScreen = document.getElementById('app-screen');
  appScreen.style.display = 'block';
  appScreen.classList.add('fade-in');
  setTimeout(function(){ appScreen.classList.remove('fade-in'); }, 400);
  initApp();
}
</script>
</body>
