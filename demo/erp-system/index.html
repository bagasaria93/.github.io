<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ErpCore - PT Sentosa Manufaktur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0f1117',
                        surface: '#181c24',
                        card: '#1e2330',
                        border: '#2a3040',
                        orange: {
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-bg text-gray-300 font-sans min-h-screen">

    <div id="app" class="flex h-screen overflow-hidden">

        <aside id="sidebar" class="sidebar flex flex-col bg-surface border-r border-border z-40">
            <div class="sidebar-header flex items-center gap-3 px-5 py-4 border-b border-border">
                <div class="w-9 h-9 rounded-xl bg-orange-600 flex items-center justify-center flex-shrink-0">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><rect x="2" y="3" width="7" height="7" rx="1"/><rect x="15" y="3" width="7" height="7" rx="1"/><rect x="2" y="14" width="7" height="7" rx="1"/><rect x="15" y="14" width="7" height="7" rx="1"/></svg>
                </div>
                <div class="sidebar-label">
                    <div class="font-bold text-white text-base leading-tight">ErpCore</div>
                    <div class="text-xs text-gray-500 leading-tight">PT Sentosa Manufaktur</div>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto py-3 px-3">
                <div class="nav-group-label sidebar-label">MAIN MENU</div>
                <button class="nav-btn active" data-module="dashboard">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <span class="sidebar-label">Dashboard</span>
                </button>
                <button class="nav-btn" data-module="sales">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
                    <span class="sidebar-label">Sales Order</span>
                    <span class="nav-badge sidebar-label" id="badge-sales"></span>
                </button>
                <button class="nav-btn" data-module="production">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <span class="sidebar-label">Production</span>
                    <span class="nav-badge sidebar-label" id="badge-production"></span>
                </button>
                <button class="nav-btn" data-module="warehouse">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="sidebar-label">Warehouse</span>
                    <span class="nav-badge sidebar-label" id="badge-warehouse"></span>
                </button>
                <button class="nav-btn" data-module="qc">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    <span class="sidebar-label">Quality Control</span>
                    <span class="nav-badge sidebar-label" id="badge-qc"></span>
                </button>
                <button class="nav-btn" data-module="purchase">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span class="sidebar-label">Purchase</span>
                    <span class="nav-badge sidebar-label" id="badge-purchase"></span>
                </button>
                <button class="nav-btn" data-module="invoice">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <span class="sidebar-label">Invoice</span>
                    <span class="nav-badge sidebar-label" id="badge-invoice"></span>
                </button>
            </nav>

            <div class="sidebar-footer px-3 py-3 border-t border-border">
                <button class="nav-btn w-full" id="sidebar-toggle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="toggle-icon"><path d="M11 19l-7-7 7-7M18 19l-7-7 7-7"/></svg>
                    <span class="sidebar-label text-xs">Collapse</span>
                </button>
            </div>
        </aside>

        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

            <header class="topbar flex items-center gap-4 px-4 sm:px-6 py-3 border-b border-border bg-surface flex-shrink-0">
                <button id="mobile-toggle" class="lg:hidden p-2 rounded-lg border border-border text-gray-400 hover:text-white transition-colors">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="flex-1 min-w-0">
                    <h1 class="text-sm font-semibold text-white" id="page-title">Dashboard</h1>
                    <p class="text-xs text-gray-500 truncate" id="page-subtitle">Overview sistem manufaktur</p>
                </div>
                <div class="relative hidden sm:block">
                    <input type="text" id="global-search" class="topbar-search" placeholder="Cari SO, WO, Invoice...">
                    <div id="search-dropdown" class="search-dropdown hidden"></div>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="hidden sm:flex items-center gap-2 text-xs text-gray-500 font-mono bg-card border border-border rounded-lg px-3 py-1.5">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span id="live-clock"></span>
                    </div>
                    <button class="btn-secondary btn-sm hidden sm:inline-flex" id="btn-export-csv">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Export
                    </button>
                    <button class="btn-danger btn-sm hidden sm:inline-flex" id="btn-reset-data">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
                        Reset
                    </button>
                    <button class="relative p-2 rounded-lg border border-border text-gray-400 hover:text-white transition-colors" id="notif-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="notif-dot hidden" id="notif-dot"></span>
                    </button>
                    <div class="w-8 h-8 rounded-lg bg-orange-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">AD</div>
                </div>
            </header>

            <div id="notif-panel" class="hidden absolute right-4 top-14 w-80 bg-card border border-border rounded-xl shadow-2xl z-50 overflow-hidden">
                <div class="flex items-center justify-between px-4 py-3 border-b border-border">
                    <span class="text-sm font-semibold text-white">Notifikasi</span>
                    <button id="clear-notif" class="text-xs text-orange-400 hover:text-orange-300">Hapus Semua</button>
                </div>
                <div id="notif-list" class="max-h-72 overflow-y-auto"></div>
            </div>

            <main class="flex-1 overflow-y-auto p-4 sm:p-6" id="main-content">
                <div id="module-dashboard"></div>
                <div id="module-sales" class="hidden"></div>
                <div id="module-production" class="hidden"></div>
                <div id="module-warehouse" class="hidden"></div>
                <div id="module-qc" class="hidden"></div>
                <div id="module-purchase" class="hidden"></div>
                <div id="module-invoice" class="hidden"></div>
            </main>

            <footer class="border-t border-border px-6 py-3 flex items-center justify-between flex-shrink-0 bg-surface">
                <span class="text-xs text-gray-600">ErpCore v1.0 - PT Sentosa Manufaktur</span>
                <p class="text-xs text-gray-600">
                    Demo project by
                    <a href="https://bagasaria93.github.io" target="_blank" class="text-orange-400 hover:text-orange-300 transition-colors">Bagas Aria Sativa</a>
                    - Portfolio Demo
                </p>
            </footer>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
        <div id="modal-box" class="bg-card border border-border rounded-2xl w-full max-w-lg max-h-screen overflow-y-auto shadow-2xl">
            <div class="flex items-center justify-between px-6 py-4 border-b border-border">
                <h3 class="font-semibold text-white text-base" id="modal-title"></h3>
                <button id="modal-close" class="text-gray-500 hover:text-white transition-colors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="px-6 py-5" id="modal-body"></div>
            <div class="flex justify-end gap-3 px-6 py-4 border-t border-border" id="modal-footer"></div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <div id="print-area" class="hidden"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/state.js"></script>
    <script src="assets/js/modules/dashboard.js"></script>
    <script src="assets/js/modules/sales.js"></script>
    <script src="assets/js/modules/production.js"></script>
    <script src="assets/js/modules/warehouse.js"></script>
    <script src="assets/js/modules/qc.js"></script>
    <script src="assets/js/modules/purchase.js"></script>
    <script src="assets/js/modules/invoice.js"></script>
    <script src="assets/js/main.js"></script>
<div style="position:fixed;bottom:12px;right:16px;z-index:9999;font-size:11px;font-family:system-ui,-apple-system,sans-serif;background:rgba(10,10,20,0.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);padding:5px 12px;border-radius:20px;color:rgba(255,255,255,0.6);letter-spacing:0.01em;white-space:nowrap;">Created by <a href="https://bagasaria93.github.io/" target="_blank" rel="noopener noreferrer" style="color:#c9a84c;text-decoration:none;font-weight:700;">Bagas Aria Sativa</a></div>
</body>
</html>
