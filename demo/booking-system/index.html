<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookinAja - Seruni Beauty</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; }
.step-dot { width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all 0.3s; }
.step-dot.done { background:linear-gradient(135deg,#e11d48,#fb7185);color:white;box-shadow:0 4px 12px rgba(225,29,72,0.35); }
.step-dot.active { background:linear-gradient(135deg,#e11d48,#fb7185);color:white;box-shadow:0 4px 16px rgba(225,29,72,0.4); }
.step-dot.pending { background:white;border:2px solid #e5e7eb;color:#9ca3af; }
.step-line { height:2px;flex:1;transition:background 0.4s; }
.step-line.done { background:linear-gradient(90deg,#e11d48,#fb7185); }
.step-line.pending { background:#e5e7eb; }
.cal-day { width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all 0.2s;font-weight:500; }
.cal-day:hover:not(.disabled):not(.empty) { background:#fecdd3;color:#be123c;transform:scale(1.1); }
.cal-day.selected { background:linear-gradient(135deg,#e11d48,#f43f5e);color:white;box-shadow:0 3px 12px rgba(225,29,72,0.4); }
.cal-day.disabled { color:#d1d5db;cursor:not-allowed; }
.cal-day.empty { cursor:default; }
.cal-day.today { border:2px solid #e11d48;color:#e11d48;font-weight:700; }
.cal-day.today.selected { border-color:transparent;color:white; }
.slot-btn { border:1.5px solid #e5e7eb;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;background:white;color:#374151; }
.slot-btn:hover:not(.booked) { border-color:#e11d48;color:#e11d48;transform:translateY(-2px);box-shadow:0 4px 12px rgba(225,29,72,0.15); }
.slot-btn.selected { background:linear-gradient(135deg,#e11d48,#f43f5e);color:white;border-color:transparent;box-shadow:0 4px 14px rgba(225,29,72,0.35); }
.slot-btn.booked { background:#f9fafb;color:#d1d5db;cursor:not-allowed;border-color:#f3f4f6; }
.service-card { border:1.5px solid #e5e7eb;border-radius:16px;padding:16px;cursor:pointer;transition:all 0.25s cubic-bezier(0.34,1.2,0.64,1);background:white;position:relative;overflow:hidden; }
.service-card::after { content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#e11d48,#fb7185);transform:scaleX(0);transition:transform 0.25s;transform-origin:left; }
.service-card:hover { border-color:#fda4af;box-shadow:0 8px 24px rgba(225,29,72,0.1);transform:translateY(-2px); }
.service-card:hover::after { transform:scaleX(1); }
.service-card.selected { border-color:#e11d48;background:#fff1f2;box-shadow:0 4px 20px rgba(225,29,72,0.18); }
.service-card.selected::after { transform:scaleX(1); }
.branch-card { border:1.5px solid #e5e7eb;border-radius:16px;padding:18px;cursor:pointer;transition:all 0.25s cubic-bezier(0.34,1.2,0.64,1);background:white; }
.branch-card:hover { border-color:#fda4af;box-shadow:0 8px 24px rgba(225,29,72,0.1);transform:translateY(-2px); }
.branch-card.selected { border-color:#e11d48;background:#fff1f2;box-shadow:0 4px 20px rgba(225,29,72,0.18); }
.staff-card { border:2px solid #f3f4f6;border-radius:14px;padding:14px;cursor:pointer;transition:all 0.2s;background:white; }
.staff-card:hover { border-color:#fda4af;box-shadow:0 4px 16px rgba(225,29,72,0.08); }
.staff-card.selected { border-color:#e11d48;background:#fff1f2;box-shadow:0 4px 16px rgba(225,29,72,0.15); }
.tab-btn { padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;border:none; }
.tab-btn.active { background:linear-gradient(135deg,#e11d48,#f43f5e);color:white;box-shadow:0 4px 14px rgba(225,29,72,0.3); }
.tab-btn:not(.active) { background:transparent;color:#6b7280; }
.tab-btn:not(.active):hover { color:#e11d48;background:rgba(225,29,72,0.05); }
.status-badge { display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600; }
.fade-slide { animation:fadeSlide 0.3s cubic-bezier(0.34,1.1,0.64,1) both; }
@keyframes fadeSlide { from { opacity:0;transform:translateX(14px); } to { opacity:1;transform:translateX(0); } }
.modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px); }
.modal-box { background:white;border-radius:22px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.2); }
.chart-wrap { position:relative;height:220px; }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:#fda4af;border-radius:4px; }
.slot-section-label { font-size:11px;font-weight:700;color:#9ca3af;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;margin-top:14px; }
.slot-section-label:first-child { margin-top:0; }
.inp { width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:10px 14px;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;font-family:inherit; }
.inp:focus { border-color:#e11d48;box-shadow:0 0 0 3px rgba(225,29,72,0.08); }
</style>
</head>
<body class="bg-rose-50 min-h-screen">
<div id="app"></div>
<script>
var BRANCHES = [
  { id:'JKT', nama:'Jakarta Selatan', alamat:'Jl. Kemang Raya No. 45, Jakarta Selatan', telp:'021-7891234', buka:'09:00', tutup:'21:00', icon:'🏙️' },
  { id:'BDG', nama:'Bandung', alamat:'Jl. Dago No. 112, Bandung', telp:'022-2345678', buka:'09:00', tutup:'20:00', icon:'🌿' },
  { id:'SBY', nama:'Surabaya', alamat:'Jl. Darmo No. 88, Surabaya', telp:'031-5678901', buka:'10:00', tutup:'21:00', icon:'🌊' }
];
var SERVICES = [
  { id:'S01', kategori:'Wajah', nama:'Facial Deep Cleansing', durasi:60, harga:185000, desc:'Pembersihan mendalam untuk kulit bersih dan segar', icon:'✨' },
  { id:'S02', kategori:'Wajah', nama:'Brightening Facial', durasi:75, harga:250000, desc:'Mencerahkan kulit kusam dengan serum vitamin C', icon:'🌟' },
  { id:'S03', kategori:'Tubuh', nama:'Body Scrub Nusantara', durasi:90, harga:320000, desc:'Scrub tradisional dengan rempah pilihan Indonesia', icon:'🌿' },
  { id:'S04', kategori:'Tubuh', nama:'Aromatherapy Massage', durasi:90, harga:380000, desc:'Pijat relaksasi dengan minyak esensial pilihan', icon:'💆' },
  { id:'S05', kategori:'Rambut', nama:'Hair Spa Treatment', durasi:60, harga:220000, desc:'Perawatan rambut intensif dengan masker keratin', icon:'💇' },
  { id:'S06', kategori:'Kuku', nama:'Manicure & Pedicure', durasi:75, harga:175000, desc:'Perawatan kuku tangan dan kaki lengkap', icon:'💅' },
  { id:'S07', kategori:'Paket', nama:'Paket Pengantin Lengkap', durasi:240, harga:1250000, desc:'Paket lengkap perawatan untuk hari spesialmu', icon:'👰' },
  { id:'S08', kategori:'Wajah', nama:'Anti-Aging Facial', durasi:90, harga:450000, desc:'Perawatan anti penuaan dengan teknologi terkini', icon:'⭐' }
];
var STAFF = [
  { id:'T01', nama:'Ayu Lestari', cabang:'JKT', spesialis:['Wajah','Paket'], foto:'👩', rating:4.9, totalBooking:342 },
  { id:'T02', nama:'Sinta Maharani', cabang:'JKT', spesialis:['Tubuh','Wajah'], foto:'👩‍🦱', rating:4.8, totalBooking:298 },
  { id:'T03', nama:'Putri Andini', cabang:'JKT', spesialis:['Rambut','Kuku'], foto:'👱‍♀️', rating:4.7, totalBooking:215 },
  { id:'T04', nama:'Rina Safitri', cabang:'BDG', spesialis:['Wajah','Tubuh'], foto:'👩‍🦰', rating:4.9, totalBooking:387 },
  { id:'T05', nama:'Dewi Anggraini', cabang:'BDG', spesialis:['Tubuh','Paket'], foto:'🧕', rating:4.6, totalBooking:178 },
  { id:'T06', nama:'Nadia Kusuma', cabang:'SBY', spesialis:['Wajah','Kuku'], foto:'👩‍🦳', rating:4.8, totalBooking:263 },
  { id:'T07', nama:'Reni Oktavia', cabang:'SBY', spesialis:['Tubuh','Rambut'], foto:'👩', rating:4.7, totalBooking:201 }
];
var SLOTS_PAGI  = ['09:00','10:00','11:00'];
var SLOTS_SIANG = ['13:00','14:00','15:00','16:00'];
var SLOTS_SORE  = ['17:00','18:00','19:00'];

function futureDateStr(n) {
  var d = new Date(); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
var BOOKED_SLOTS = { JKT:{}, BDG:{}, SBY:{} };
BOOKED_SLOTS.JKT[futureDateStr(1)] = ['09:00','10:00','14:00'];
BOOKED_SLOTS.JKT[futureDateStr(3)] = ['11:00','15:00'];
BOOKED_SLOTS.BDG[futureDateStr(1)] = ['09:00','13:00'];
BOOKED_SLOTS.SBY[futureDateStr(2)] = ['10:00','11:00','16:00'];

var state = {
  step:1, service:null, branch:null, date:null, slot:null, staff:null,
  customer:{nama:'',telp:'',email:'',catatan:''},
  booking:null, view:'booking', adminTab:'bookings',
  calMonth:new Date().getMonth(), calYear:new Date().getFullYear(),
  catFilter:'', reviewBookingId:null, reviewStar:0
};
var bookings = JSON.parse(localStorage.getItem('bja_bookings') || '[]');
var reviews  = JSON.parse(localStorage.getItem('bja_reviews') || '[]');
var chartInstances = {};

function save() {
  localStorage.setItem('bja_bookings', JSON.stringify(bookings));
  localStorage.setItem('bja_reviews',  JSON.stringify(reviews));
}
function genId() {
  return 'BKN' + Date.now().toString(36).toUpperCase().slice(-5) + Math.random().toString(36).substring(2,4).toUpperCase();
}
function fmtRupiah(n) { return 'Rp ' + n.toLocaleString('id-ID'); }
function fmtTglShort(str) {
  if (!str) return '-';
  var d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
}
function getStatusColor(s) {
  var m = { pending:'background:rgba(217,119,6,0.1);color:#d97706;', confirmed:'background:rgba(37,99,235,0.1);color:#2563eb;', 'in-progress':'background:rgba(124,58,237,0.1);color:#7c3aed;', completed:'background:rgba(22,163,74,0.1);color:#16a34a;', cancelled:'background:rgba(220,38,38,0.1);color:#dc2626;' };
  return m[s] || 'background:#f3f4f6;color:#6b7280;';
}
function getStatusLabel(s) {
  var m = { pending:'Pending', confirmed:'Dikonfirmasi', 'in-progress':'Berlangsung', completed:'Selesai', cancelled:'Dibatalkan' };
  return m[s] || s;
}
function showToast(msg) {
  var old = document.getElementById('_toast'); if (old) old.remove();
  var t = document.createElement('div'); t.id = '_toast';
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:white;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:400;box-shadow:0 8px 24px rgba(0,0,0,0.2);animation:fadeSlide 0.3s ease;white-space:nowrap;';
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.remove(); }, 3000);
}
function validatePhone(p) { return /^(\+62|62|0)8[1-9][0-9]{6,10}$/.test(p.replace(/[\s\-]/g,'')); }
function validateEmail(e) { return !e || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

function render() {
  document.getElementById('app').innerHTML = buildApp();
  if (state.view === 'booking' && state.step === 3) renderCalendar();
  if (state.view === 'booking' && state.step === 5 && state.booking) renderQR();
  if (state.view === 'admin' && state.adminTab === 'analitik') renderCharts();
}
function buildApp() {
  var body = '';
  if (state.view==='booking') body = buildBooking();
  else if (state.view==='tracking') body = buildTracking();
  else if (state.view==='admin') body = buildAdmin();
  return buildNav() + '<div class="max-w-5xl mx-auto px-4 py-8">' + body + '</div>' + buildFooter();
}
function buildNav() {
  return '<nav style="background:white;box-shadow:0 1px 0 rgba(0,0,0,0.06);" class="sticky top-0 z-50"><div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between"><div class="flex items-center gap-2"><div style="width:38px;height:38px;background:linear-gradient(135deg,#e11d48,#fb7185);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/></svg></div><div><div style="font-size:17px;font-weight:800;background:linear-gradient(135deg,#e11d48,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1;">Seruni</div><div style="font-size:9px;color:#9ca3af;font-weight:600;letter-spacing:0.08em;margin-top:-1px;">BEAUTY SALON</div></div></div><div class="flex items-center gap-1"><button onclick="setView(\'booking\')" class="tab-btn ' + (state.view==='booking'?'active':'') + '">Booking</button><button onclick="setView(\'tracking\')" class="tab-btn ' + (state.view==='tracking'?'active':'') + '">Cek Status</button><button onclick="setView(\'admin\')" class="tab-btn ' + (state.view==='admin'?'active':'') + '">Admin</button></div></div></nav>';
}
function buildFooter() {
  return '<footer style="margin-top:48px;padding:24px;border-top:1px solid #fce7f3;text-align:center;"><p style="font-size:12px;color:#94a3b8;">Demo project by <a href="https://bagasaria93.github.io" target="_blank" rel="noopener noreferrer" style="color:#fb7185;text-decoration:none;font-weight:600;">Bagas Aria Sativa</a></p></footer>';
}
function buildBooking() {
  if (state.step === 5 && state.booking) return buildConfirmation();
  var steps = ['Layanan','Cabang','Jadwal','Data Diri'];
  var sh = '<div class="flex items-center mb-8">';
  steps.forEach(function(s, i) {
    var n = i+1, done = n < state.step, active = n === state.step;
    sh += '<div class="flex flex-col items-center"><div class="step-dot ' + (done?'done':active?'active':'pending') + '">';
    if (done) sh += '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
    else sh += n;
    sh += '</div><div style="font-size:11px;margin-top:5px;font-weight:600;color:' + (active?'#e11d48':done?'#f43f5e':'#9ca3af') + ';" class="hidden sm:block">' + s + '</div></div>';
    if (i < steps.length-1) sh += '<div class="step-line mx-2 ' + (n < state.step?'done':'pending') + '"></div>';
  });
  sh += '</div>';
  var content = '';
  if (state.step===1) content = buildStep1();
  else if (state.step===2) content = buildStep2();
  else if (state.step===3) content = buildStep3();
  else if (state.step===4) content = buildStep4();
  var nav = '<div class="flex justify-between mt-8">';
  if (state.step > 1) nav += '<button onclick="prevStep()" style="padding:10px 20px;border-radius:12px;border:1.5px solid #e5e7eb;font-size:14px;font-weight:600;color:#6b7280;cursor:pointer;background:white;transition:all 0.2s;" onmouseover="this.style.borderColor=\'#fda4af\';this.style.color=\'#e11d48\';" onmouseout="this.style.borderColor=\'#e5e7eb\';this.style.color=\'#6b7280\';">Kembali</button>';
  else nav += '<div></div>';
  var label = state.step < 4 ? 'Lanjut &rarr;' : 'Konfirmasi Booking';
  var action = state.step < 4 ? 'nextStep()' : 'submitBooking()';
  nav += '<button onclick="' + action + '" style="padding:10px 24px;border-radius:12px;background:linear-gradient(135deg,#e11d48,#f43f5e);color:white;font-size:14px;font-weight:700;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(225,29,72,0.35);transition:all 0.2s;" onmouseover="this.style.transform=\'translateY(-1px)\';this.style.boxShadow=\'0 6px 20px rgba(225,29,72,0.45)\';" onmouseout="this.style.transform=\'none\';this.style.boxShadow=\'0 4px 14px rgba(225,29,72,0.35)\';">' + label + '</button></div>';
  return sh + '<div id="step-content" class="fade-slide">' + content + '</div>' + nav;
}

function buildStep1() {
  var cats = [];
  SERVICES.forEach(function(s) { if (cats.indexOf(s.kategori)===-1) cats.push(s.kategori); });
  var html = '<h2 style="font-size:18px;font-weight:800;color:#1f2937;margin-bottom:4px;">Pilih Layanan</h2><p style="font-size:13px;color:#9ca3af;margin-bottom:16px;">Pilih layanan yang Anda inginkan</p>';
  html += '<div class="flex gap-2 mb-5 flex-wrap" id="cat-filters">' + catBtn('','Semua',state.catFilter);
  cats.forEach(function(c) { html += catBtn(c,c,state.catFilter); });
  html += '</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="service-grid">' + buildSvcCards(state.catFilter) + '</div>';
  return html;
}
function catBtn(val, label, active) {
  return '<button onclick="filterCat(\'' + val + '\')" class="px-3 py-1.5 rounded-full text-xs font-semibold border transition-all ' + (val===active?'bg-rose-600 text-white border-rose-600':'bg-white text-gray-500 border-gray-200 hover:border-rose-300') + '">' + label + '</button>';
}
function buildSvcCards(catFilter) {
  var filtered = catFilter ? SERVICES.filter(function(s){return s.kategori===catFilter;}) : SERVICES;
  return filtered.map(function(s) {
    var sel = state.service && state.service.id===s.id;
    return '<div class="service-card ' + (sel?'selected':'') + '" data-sid="' + s.id + '" onclick="selectService(\'' + s.id + '\')">' +
      '<div class="flex items-start gap-3">' +
      '<div style="width:44px;height:44px;background:' + (sel?'linear-gradient(135deg,#e11d48,#fb7185)':'#fff1f2') + ';border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:background 0.2s;">' + s.icon + '</div>' +
      '<div class="flex-1 min-w-0"><div style="font-weight:700;color:#1f2937;font-size:14px;">' + s.nama + '</div><div style="font-size:12px;color:#6b7280;margin-top:2px;line-height:1.4;">' + s.desc + '</div>' +
      '<div class="flex items-center gap-2 mt-2 flex-wrap"><span style="color:#e11d48;font-weight:800;font-size:13px;">' + fmtRupiah(s.harga) + '</span><span style="font-size:11px;color:#9ca3af;">&#9679; ' + s.durasi + ' menit</span><span style="font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(225,29,72,0.08);color:#e11d48;font-weight:600;">' + s.kategori + '</span></div></div>' +
      (sel ? '<div style="color:#e11d48;flex-shrink:0;margin-left:4px;"><svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></div>' : '') +
      '</div></div>';
  }).join('');
}

function buildStep2() {
  var html = '<h2 style="font-size:18px;font-weight:800;color:#1f2937;margin-bottom:4px;">Pilih Cabang</h2><p style="font-size:13px;color:#9ca3af;margin-bottom:16px;">Pilih lokasi Seruni Beauty terdekat</p>';
  html += '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="branch-grid">';
  BRANCHES.forEach(function(b) {
    var sel = state.branch && state.branch.id===b.id;
    html += '<div class="branch-card ' + (sel?'selected':'') + '" data-bid="' + b.id + '" onclick="selectBranch(\'' + b.id + '\')">' +
      '<div class="flex items-start justify-between mb-2"><div style="font-size:26px;">' + b.icon + '</div>' +
      (sel?'<div style="color:#e11d48;"><svg width="18" height="18" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg></div>':'') +
      '</div><div style="font-weight:700;color:#1f2937;font-size:14px;margin-bottom:4px;">' + b.nama + '</div>' +
      '<div style="font-size:12px;color:#6b7280;line-height:1.5;margin-bottom:8px;">' + b.alamat + '</div>' +
      '<span style="font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(34,197,94,0.1);color:#16a34a;font-weight:600;">Buka ' + b.buka + ' - ' + b.tutup + '</span></div>';

    return '<div style="background:white;border-radius:16px;border:1.5px solid #f1f5f9;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04);"><div style="display:flex;align-items:center;gap:14px;"><div style="width:34px;height:34px;border-radius:50%;' + (i<3?rg[i]:'background:#fff1f2;') + 'display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:' + (i<3?'white':'#e11d48') + ';flex-shrink:0;">' + (i+1) + '</div><div style="font-size:32px;flex-shrink:0;">' + t.foto + '</div><div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;"><div style="font-weight:700;font-size:14px;color:#1f2937;">' + t.nama + '</div><div><span style="color:#f59e0b;">&#9733;</span><span style="font-size:13px;font-weight:800;color:#374151;">' + t.avg + '</span></div></div><div style="font-size:12px;color:#9ca3af;margin-bottom:8px;">' + (br?br.nama:'-') + ' &bull; ' + t.spesialis.join(', ') + '</div><div style="height:6px;background:#f3f4f6;border-radius:3px;overflow:hidden;"><div style="height:100%;border-radius:3px;background:linear-gradient(90deg,#e11d48,#fb7185);width:' + pct + '%;"></div></div><div style="font-size:11px;color:#9ca3af;margin-top:4px;">' + t.cnt + ' total booking</div></div></div></div>';
  }).join('') + '</div>';
}
function buildAdminAnalitik() {
  return '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div style="background:white;border-radius:18px;border:1.5px solid #f1f5f9;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,0.04);"><div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:14px;">Booking per Cabang</div><div class="chart-wrap"><canvas id="chart-branch"></canvas></div></div><div style="background:white;border-radius:18px;border:1.5px solid #f1f5f9;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,0.04);"><div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:14px;">Booking per Layanan</div><div class="chart-wrap"><canvas id="chart-service"></canvas></div></div></div>';
}
function buildAdminReviews() {
  var nr=bookings.filter(function(b){return b.status==='completed'&&!reviews.find(function(r){return r.bookingId===b.id;});});
  var html='';
  if (nr.length) {
    html += '<div style="background:#fff1f2;border:1.5px solid #fda4af;border-radius:16px;padding:16px;margin-bottom:16px;"><div style="font-size:13px;font-weight:700;color:#be123c;margin-bottom:10px;">Menunggu Ulasan</div><div style="display:flex;flex-direction:column;gap:8px;">';
    nr.forEach(function(b){var svc=SERVICES.find(function(s){return s.id===b.serviceId;}); html+='<div style="display:flex;align-items:center;justify-content:space-between;background:white;border-radius:12px;padding:12px;"><div style="font-size:13px;"><span style="font-weight:700;">' + b.id + '</span> &bull; ' + (svc?svc.nama:'-') + '</div><button onclick="openReview(\'' + b.id + '\')" style="font-size:12px;padding:6px 14px;background:linear-gradient(135deg,#e11d48,#f43f5e);color:white;border-radius:8px;border:none;cursor:pointer;font-weight:600;">Beri Ulasan</button></div>';});
    html += '</div></div>';
  }
  if (!reviews.length) return html + '<div style="background:white;border-radius:18px;border:1.5px solid #f1f5f9;padding:48px;text-align:center;"><div style="font-size:40px;margin-bottom:10px;">&#11088;</div><div style="color:#9ca3af;font-size:14px;">Belum ada ulasan</div></div>';
  html += '<div style="display:flex;flex-direction:column;gap:10px;">';
  reviews.slice().reverse().forEach(function(r){
    var b=bookings.find(function(bk){return bk.id===r.bookingId;}), st=STAFF.find(function(t){return t.id===r.staffId;}), svc=b?SERVICES.find(function(s){return s.id===b.serviceId;}):null;
    html += '<div style="background:white;border-radius:16px;border:1.5px solid #f1f5f9;padding:16px;"><div style="display:flex;align-items:start;justify-content:space-between;margin-bottom:8px;"><div><div style="font-size:14px;font-weight:700;color:#1f2937;">' + (b?b.customer.nama:'-') + '</div><div style="font-size:12px;color:#9ca3af;">' + (svc?svc.nama:'-') + ' &bull; ' + (st?st.nama:'-') + '</div></div><div>' + [1,2,3,4,5].map(function(n){return '<span style="color:' + (n<=r.rating?'#f59e0b':'#e5e7eb') + ';font-size:16px;">&#9733;</span>';}).join('') + '</div></div><p style="font-size:13px;color:#374151;line-height:1.6;">' + r.komentar + '</p></div>';
  });
  return html + '</div>';
}
function renderCalendar() {
  var now=new Date(), year=state.calYear, month=state.calMonth;
  var firstDay=new Date(year,month,1).getDay(), dim=new Date(year,month+1,0).getDate();
  var titleEl=document.getElementById('cal-title'), gridEl=document.getElementById('cal-grid');
  if (!titleEl||!gridEl) return;
  var months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  titleEl.textContent = months[month] + ' ' + year;
  var html='';
  for (var i=0;i<firstDay;i++) html+='<div class="cal-day empty"></div>';
  for (var d=1;d<=dim;d++) {
    var ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dt=new Date(year,month,d);
    var isPast=dt<new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var isToday=dt.toDateString()===now.toDateString(), isSel=state.date===ds;
    var cls='cal-day';
    if (isPast) cls+=' disabled';
    else if (isSel&&isToday) cls+=' today selected';
    else if (isSel) cls+=' selected';
    else if (isToday) cls+=' today';
    html+='<div class="'+cls+'"'+(!isPast?' onclick="selectDate(\''+ds+'\')\"':'')+'>'+d+'</div>';
  }
  gridEl.innerHTML=html;
}
function renderQR() {
  var c=document.getElementById('qr-container'); if (!c) return; c.innerHTML='';
  try { new QRCode(c,{text:state.booking.id+'|'+state.booking.date+'|'+state.booking.slot,width:120,height:120,colorDark:'#e11d48',colorLight:'#ffffff'}); }
  catch(e) { c.innerHTML='<div style="width:120px;height:120px;background:#fff1f2;border:1.5px solid #fda4af;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#e11d48;text-align:center;padding:8px;">'+state.booking.id+'</div>'; }
}
function renderCharts() {
  requestAnimationFrame(function() {
    var bc={};BRANCHES.forEach(function(b){bc[b.nama]=0;});
    bookings.forEach(function(b){var br=BRANCHES.find(function(x){return x.id===b.branchId;});if(br)bc[br.nama]=(bc[br.nama]||0)+1;});
    var ctx1=document.getElementById('chart-branch');
    if (ctx1) {
      if(chartInstances['branch'])chartInstances['branch'].destroy();
      var bv=Object.values(bc),hasB=bv.some(function(v){return v>0;});
      chartInstances['branch']=new Chart(ctx1,{type:'doughnut',data:{labels:Object.keys(bc),datasets:[{data:hasB?bv:[1,1,1],backgroundColor:['#f43f5e','#fb7185','#fda4af'],borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Plus Jakarta Sans',size:11},boxWidth:10,padding:12}},subtitle:hasB?{}:{display:true,text:'Contoh data (belum ada booking)',color:'#9ca3af',font:{size:11}}},animation:false}});
    }
    var sc={};bookings.forEach(function(b){var svc=SERVICES.find(function(s){return s.id===b.serviceId;});if(svc)sc[svc.nama]=(sc[svc.nama]||0)+1;});
    var ctx2=document.getElementById('chart-service');
    if (ctx2) {
      if(chartInstances['service'])chartInstances['service'].destroy();
      var sl=Object.keys(sc),sv=Object.values(sc),hasS=sl.length>0;
      if(!hasS){sl=SERVICES.slice(0,4).map(function(s){return s.nama;});sv=[3,2,4,1];}
      chartInstances['service']=new Chart(ctx2,{type:'bar',data:{labels:sl,datasets:[{data:sv,backgroundColor:'rgba(244,63,94,0.8)',borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},subtitle:hasS?{}:{display:true,text:'Contoh data (belum ada booking)',color:'#9ca3af',font:{size:11}}},scales:{x:{grid:{display:false},ticks:{font:{size:10},maxRotation:30}},y:{beginAtZero:true,ticks:{stepSize:1}}},animation:false}});
    }
  });
}

function setView(v){state.view=v;render();}
function setAdminTab(t){state.adminTab=t;render();}
function changeMonth(dir){
  state.calMonth+=dir;
  if(state.calMonth>11){state.calMonth=0;state.calYear++;}
  if(state.calMonth<0){state.calMonth=11;state.calYear--;}
  renderCalendar();
}
function filterCat(c) {
  state.catFilter=c;
  var grid=document.getElementById('service-grid'), filt=document.getElementById('cat-filters');
  if (!grid||!filt){render();return;}
  grid.innerHTML=buildSvcCards(c);
  var cats=['']; SERVICES.forEach(function(s){if(cats.indexOf(s.kategori)===-1)cats.push(s.kategori);});
  var btns=filt.querySelectorAll('button');
  btns.forEach(function(btn,i){
    var bc=cats[i]||'';
    btn.className='px-3 py-1.5 rounded-full text-xs font-semibold border transition-all '+(bc===c?'bg-rose-600 text-white border-rose-600':'bg-white text-gray-500 border-gray-200 hover:border-rose-300');
  });
}
function selectService(id) {
  state.service=SERVICES.find(function(s){return s.id===id;});
  var grid=document.getElementById('service-grid');
  if(!grid){render();return;}
  grid.innerHTML=buildSvcCards(state.catFilter);
}
function selectBranch(id) {
  state.branch=BRANCHES.find(function(b){return b.id===id;}); state.staff=null;
  document.querySelectorAll('.branch-card').forEach(function(c){c.classList.toggle('selected',c.dataset.bid===id);});
  var sc=document.getElementById('step-content');
  if(sc){sc.innerHTML=buildStep2();}else{render();}
}
function selectStaff(id,el) {
  state.staff=STAFF.find(function(t){return t.id===id;});
  document.querySelectorAll('.staff-card').forEach(function(c){c.classList.remove('selected');});
  if(el)el.classList.add('selected');
}
function selectDate(d){state.date=d;state.slot=null;render();}
function selectSlot(s,el){
  state.slot=s;
  document.querySelectorAll('.slot-btn').forEach(function(b){b.classList.remove('selected');});
  if(el)el.classList.add('selected');
}
function updateCustomer(f,v){state.customer[f]=v;}
function nextStep(){
  if(state.step===1&&!state.service){showToast('Pilih layanan terlebih dahulu.');return;}
  if(state.step===2&&!state.branch){showToast('Pilih cabang terlebih dahulu.');return;}
  if(state.step===3&&!state.date){showToast('Pilih tanggal terlebih dahulu.');return;}
  if(state.step===3&&!state.slot){showToast('Pilih waktu terlebih dahulu.');return;}
  state.step++;render();window.scrollTo(0,0);
}
function prevStep(){state.step--;render();window.scrollTo(0,0);}
function submitBooking(){
  var nama=state.customer.nama.trim(),telp=state.customer.telp.trim(),email=state.customer.email.trim();
  if(!nama){showToast('Nama lengkap wajib diisi.');return;}
  if(!telp){showToast('Nomor WhatsApp wajib diisi.');return;}
  if(!validatePhone(telp)){showToast('Format nomor WhatsApp tidak valid.');return;}
  if(!validateEmail(email)){showToast('Format email tidak valid.');return;}
  var bk={id:genId(),serviceId:state.service.id,branchId:state.branch.id,staffId:state.staff?state.staff.id:null,date:state.date,slot:state.slot,customer:{nama:nama,telp:telp,email:email,catatan:state.customer.catatan},status:'pending',createdAt:new Date().toISOString()};
  bookings.push(bk);save();state.booking=bk;state.step=5;render();window.scrollTo(0,0);
}
function resetBooking(){
  state.step=1;state.service=null;state.branch=null;state.date=null;state.slot=null;state.staff=null;
  state.customer={nama:'',telp:'',email:'',catatan:''};state.booking=null;state.catFilter='';
  render();window.scrollTo(0,0);
}
function shareWA(){
  if(!state.booking)return;
  var svc=SERVICES.find(function(s){return s.id===state.booking.serviceId;}),br=BRANCHES.find(function(x){return x.id===state.booking.branchId;});
  var msg='Halo! Saya baru saja booking di Seruni Beauty.\n\nKode Booking: '+state.booking.id+'\nLayanan: '+(svc?svc.nama:'-')+'\nCabang: '+(br?br.nama:'-')+(br?'\nTelp: '+br.telp:'')+'\nTanggal: '+fmtTglShort(state.booking.date)+'\nWaktu: '+state.booking.slot+'\n\nSampai jumpa di Seruni Beauty!';
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
function doTrack(){var inp=document.getElementById('track-id');if(inp)showTrackDetail(inp.value.trim().toUpperCase());}
function showTrackDetail(id){
  var re=document.getElementById('track-result');if(!re)return;
  var b=bookings.find(function(bk){return bk.id===id;});
  if(!b){re.innerHTML='<div style="background:#fef2f2;border:1.5px solid #fecaca;border-radius:16px;padding:16px;text-align:center;font-size:13px;color:#dc2626;margin-bottom:12px;">Kode booking tidak ditemukan.</div>';return;}
  var svc=SERVICES.find(function(s){return s.id===b.serviceId;}),br=BRANCHES.find(function(x){return x.id===b.branchId;}),st=STAFF.find(function(t){return t.id===b.staffId;});
  var statuses=['pending','confirmed','in-progress','completed'],curIdx=statuses.indexOf(b.status);
  var html='<div style="background:white;border-radius:18px;border:1.5px solid #f1f5f9;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.04);">';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><div><div style="font-weight:800;font-family:monospace;color:#1f2937;">'+b.id+'</div><div style="font-size:12px;color:#9ca3af;">'+b.customer.nama+'</div></div><span class="status-badge" style="'+getStatusColor(b.status)+'">'+getStatusLabel(b.status)+'</span></div>';
  [['Layanan',svc?svc.nama:'-'],['Cabang',br?br.nama:'-'],['Jadwal',fmtTglShort(b.date)+' pukul '+b.slot],['Terapis',st?st.nama:'Tidak dipilih']].forEach(function(r){
    html+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span style="color:#9ca3af;">'+r[0]+'</span><span style="font-weight:600;">'+r[1]+'</span></div>';
  });
  html+='<div style="display:flex;align-items:center;overflow-x:auto;padding-bottom:4px;margin-top:14px;gap:4px;">';
  statuses.forEach(function(s,i){
    html+='<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;"><div style="width:26px;height:26px;border-radius:50%;background:'+(i<=curIdx?'linear-gradient(135deg,#e11d48,#f43f5e)':'#f3f4f6')+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:'+(i<=curIdx?'white':'#9ca3af')+';">'+(i<curIdx?'<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>':(i+1))+'</div><span style="font-size:11px;font-weight:'+(i<=curIdx?'600':'400')+';color:'+(i<=curIdx?'#374151':'#9ca3af')+';">'+getStatusLabel(s)+'</span></div>';
    if(i<statuses.length-1)html+='<div style="width:14px;height:2px;flex-shrink:0;background:'+(i<curIdx?'#e11d48':'#e5e7eb')+';"></div>';
  });
  html+='</div>';
  if(b.status==='completed'&&!reviews.find(function(r){return r.bookingId===b.id;}))
    html+='<button onclick="openReview(\''+b.id+'\')" style="margin-top:14px;width:100%;padding:10px;background:linear-gradient(135deg,#e11d48,#f43f5e);color:white;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;">Beri Ulasan</button>';
  re.innerHTML=html+'</div>';
}
function updateStatus(id,status){var b=bookings.find(function(bk){return bk.id===id;});if(b){b.status=status;save();render();}}
function openReview(bookingId){
  state.reviewBookingId=bookingId;state.reviewStar=0;
  var b=bookings.find(function(bk){return bk.id===bookingId;}),svc=b?SERVICES.find(function(s){return s.id===b.serviceId;}):null;
  var overlay=document.createElement('div');overlay.className='modal-overlay';overlay.id='review-modal';
  overlay.innerHTML='<div class="modal-box p-6"><div style="font-size:18px;font-weight:800;color:#1f2937;margin-bottom:4px;">Beri Ulasan</div><div style="font-size:13px;color:#9ca3af;margin-bottom:20px;">'+(svc?svc.nama:'')+'&bull;'+bookingId+'</div><div style="margin-bottom:18px;"><div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;">Rating <span style="color:#e11d48;">*</span></div><div style="display:flex;gap:8px;" id="star-row">'+[1,2,3,4,5].map(function(n){return '<span onclick="setReviewStar('+n+')" onmouseover="hoverStar('+n+')" onmouseout="hoverStar(0)" style="cursor:pointer;font-size:36px;color:#e5e7eb;transition:all 0.15s;" id="star-'+n+'">&#9733;</span>';}).join('')+'</div></div><div style="margin-bottom:18px;"><div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;">Komentar <span style="color:#e11d48;">*</span></div><textarea id="review-komentar" rows="3" placeholder="Bagaimana pengalaman Anda?" class="inp" style="resize:none;"></textarea></div><div style="display:flex;gap:10px;"><button onclick="closeReview()" style="flex:1;padding:11px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;background:white;">Batal</button><button onclick="submitReview()" style="flex:1;padding:11px;background:linear-gradient(135deg,#e11d48,#f43f5e);color:white;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;">Kirim Ulasan</button></div></div>';
  document.body.appendChild(overlay);
}
function hoverStar(n){var a=n||state.reviewStar||0;for(var i=1;i<=5;i++){var el=document.getElementById('star-'+i);if(el){el.style.color=i<=a?'#f59e0b':'#e5e7eb';el.style.transform=i<=a?'scale(1.15)':'scale(1)';}}}
function setReviewStar(n){state.reviewStar=n;hoverStar(n);}
function closeReview(){var m=document.getElementById('review-modal');if(m)document.body.removeChild(m);state.reviewBookingId=null;state.reviewStar=0;}
function submitReview(){
  if(!state.reviewStar){showToast('Pilih rating bintang terlebih dahulu.');return;}
  var k=document.getElementById('review-komentar'),komentar=k?k.value.trim():'';
  if(!komentar){showToast('Komentar wajib diisi.');return;}
  var b=bookings.find(function(bk){return bk.id===state.reviewBookingId;});
  reviews.push({bookingId:state.reviewBookingId,staffId:b?b.staffId:null,rating:state.reviewStar,komentar:komentar,createdAt:new Date().toISOString()});
  save();closeReview();render();
}

render();
</script>
