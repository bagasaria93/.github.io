<style>
:root {
  --ink:#2c1b23; --ink-soft:#6b5560; --muted:#8c7a80; --line:#ecdde1; --line-soft:#f3e9ec;
  --surface:#ffffff; --bg:#fdf8f6; --bg-tint:#fbeef0;
  --wine:#7a1338; --primary:#a01245; --primary-2:#c81d55; --primary-3:#e8577e;
  --primary-wash:#fdeef1; --primary-wash-2:#fbe0e6;
  --gold:#a9832e; --gold-soft:#c9a227; --gold-pale:#f3e6c4;
  --ok:#15803d; --ok-bg:#e9f7ee;
  --grad-primary:linear-gradient(135deg,var(--wine),var(--primary-2) 55%,var(--primary-3));
  --shadow-sm:0 2px 8px rgba(122,19,56,0.06);
  --shadow-md:0 8px 24px rgba(122,19,56,0.10);
  --shadow-lg:0 16px 40px rgba(122,19,56,0.16);
  --shadow-primary:0 8px 22px rgba(160,18,69,0.32);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
}
* { box-sizing: border-box; }
body { font-family:'Plus Jakarta Sans', sans-serif; background:var(--bg); color:var(--ink); }
.font-display { font-family:'Fraunces', serif; }
::selection { background:var(--primary-wash-2); color:var(--wine); }
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-thumb { background:var(--primary-3);border-radius:4px; }

/* ---- buttons ---- */
.btn { display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:700;font-size:14px;border:none;cursor:pointer;border-radius:var(--r-md);padding:11px 22px;transition:transform 0.18s ease,box-shadow 0.18s ease,background 0.18s ease,color 0.18s ease,border-color 0.18s ease;white-space:nowrap; }
.btn:active { transform:translateY(1px); }
.btn-primary { background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-primary); }
.btn-primary:hover { box-shadow:0 12px 28px rgba(160,18,69,0.4);transform:translateY(-1px); }
.btn-secondary { background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line); }
.btn-secondary:hover { border-color:var(--primary-3);color:var(--primary); }
.btn-whatsapp { background:#1f9e56;color:#fff;box-shadow:0 8px 20px rgba(31,158,86,0.32); }
.btn-whatsapp:hover { background:#188847; }
.btn-icon { width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line-soft);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);transition:all 0.2s; }
.btn-icon:hover { border-color:var(--primary-3);color:var(--primary); }
.btn-block { width:100%; }

/* ---- stepper ---- */
.step-dot { width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:all 0.3s;position:relative; }
.step-dot.done { background:var(--grad-primary);color:#fff;box-shadow:0 4px 12px rgba(160,18,69,0.3); }
.step-dot.active { background:var(--grad-primary);color:#fff;box-shadow:0 0 0 5px var(--primary-wash-2),0 4px 14px rgba(160,18,69,0.35); }
.step-dot.pending { background:var(--surface);border:2px solid var(--line);color:var(--muted); }
.step-line { height:2px;flex:1;transition:background 0.4s;background:var(--line); }
.step-line.done { background:var(--grad-primary); }

/* ---- calendar ---- */
.cal-day { width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all 0.2s;font-weight:500;color:var(--ink-soft); }
.cal-day:hover:not(.disabled):not(.empty):not(.selected) { background:var(--primary-wash-2);color:var(--wine);transform:scale(1.08); }
.cal-day.selected { background:var(--grad-primary);color:#fff;box-shadow:0 3px 12px rgba(160,18,69,0.38);font-weight:700; }
.cal-day.selected:hover { box-shadow:0 5px 16px rgba(160,18,69,0.48); }
.cal-day.disabled { color:#d9cdd1;cursor:not-allowed; }
.cal-day.empty { cursor:default; }
.cal-day.today { border:2px solid var(--gold-soft);color:var(--gold);font-weight:700; }
.cal-day.today.selected { border-color:transparent;color:#fff; }

/* ---- time slots ---- */
.slot-btn { border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;background:var(--surface);color:var(--ink-soft);font-family:inherit; }
.slot-btn:hover:not(.booked):not(.selected) { border-color:var(--primary-3);color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 12px rgba(160,18,69,0.14); }
.slot-btn.selected { background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(160,18,69,0.35); }
.slot-btn.selected:hover { box-shadow:0 6px 18px rgba(160,18,69,0.45);transform:translateY(-1px); }
.slot-btn.booked { background:#f7f2f3;color:#d0c2c6;cursor:not-allowed;border-color:#f1e7ea; }

/* ---- selection cards ---- */
.service-card,.branch-card,.staff-card { border:1.5px solid var(--line);border-radius:16px;cursor:pointer;transition:all 0.25s cubic-bezier(0.34,1.2,0.64,1);background:var(--surface);position:relative;overflow:hidden; }
.service-card { padding:16px; }
.service-card::after,.branch-card::after { content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-primary);transform:scaleX(0);transition:transform 0.25s;transform-origin:left; }
.service-card:hover:not(.selected),.branch-card:hover:not(.selected) { border-color:var(--primary-3);box-shadow:var(--shadow-md);transform:translateY(-2px); }
.service-card:hover::after,.branch-card:hover::after { transform:scaleX(1); }
.service-card.selected,.branch-card.selected { border-color:var(--primary);background:var(--primary-wash);box-shadow:0 6px 22px rgba(160,18,69,0.16); }
.service-card.selected::after,.branch-card.selected::after { transform:scaleX(1); }
.branch-card { padding:18px; }
.staff-card { border:2px solid var(--line-soft);border-radius:14px;padding:14px; }
.staff-card:hover:not(.selected) { border-color:var(--primary-3);box-shadow:0 6px 18px rgba(160,18,69,0.1); }
.staff-card.selected { border-color:var(--primary);background:var(--primary-wash);box-shadow:0 6px 18px rgba(160,18,69,0.15); }

/* ---- nav tabs ---- */
.tab-btn { padding:8px 18px;border-radius:var(--r-pill);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;border:none;white-space:nowrap;font-family:inherit; }
.tab-btn.active { background:var(--grad-primary);color:#fff;box-shadow:0 4px 14px rgba(160,18,69,0.28); }
.tab-btn:not(.active) { background:transparent;color:var(--ink-soft); }
.tab-btn:not(.active):hover { color:var(--primary);background:var(--primary-wash); }

/* ---- category chips ---- */
.chip { padding:6px 14px;border-radius:var(--r-pill);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.18s;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-family:inherit; }
.chip:hover:not(.chip-active) { border-color:var(--primary-3);color:var(--primary); }
.chip.chip-active { background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(160,18,69,0.26); }

.status-badge { display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--r-pill);font-size:11px;font-weight:700; }
.status-badge::before { content:'';width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block; }
.fade-slide { animation:fadeSlide 0.35s cubic-bezier(0.34,1.1,0.64,1) both; }
@keyframes fadeSlide { from { opacity:0;transform:translateY(10px); } to { opacity:1;transform:translateY(0); } }
@keyframes popIn { from { opacity:0;transform:scale(0.85); } to { opacity:1;transform:scale(1); } }
@keyframes ringPulse { 0% { box-shadow:0 0 0 0 rgba(21,128,61,0.35); } 100% { box-shadow:0 0 0 14px rgba(21,128,61,0); } }
.modal-overlay { position:fixed;inset:0;background:rgba(44,27,35,0.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);animation:fadeSlide 0.2s ease both; }
.modal-box { background:var(--surface);border-radius:22px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(44,27,35,0.28); }
.chart-wrap { position:relative;height:220px; }
.slot-section-label { font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;margin-top:14px; }
.slot-section-label:first-child { margin-top:0; }
.inp { width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;font-family:inherit;background:var(--surface);color:var(--ink); }
.inp:focus { border-color:var(--primary-3);box-shadow:0 0 0 3px var(--primary-wash-2); }
.card-surface { background:var(--surface);border-radius:var(--r-lg);border:1.5px solid var(--line-soft);box-shadow:var(--shadow-sm); }
.stat-tile { background:var(--surface);border:1.5px solid var(--line-soft);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm); }
.hx-row:hover { background:var(--primary-wash) !important; }
.service-card:focus-visible,.branch-card:focus-visible,.staff-card:focus-visible,.cal-day:focus-visible,.slot-btn:focus-visible,.btn:focus-visible,.chip:focus-visible,.tab-btn:focus-visible { outline:2px solid var(--primary);outline-offset:2px; }
@media (max-width:480px) { .btn { padding:11px 18px;font-size:13.5px; } .tab-btn { padding:7px 11px;font-size:12px; } }
</style>
</head>

<script>
var BRANCHES = [

  { id:'S05', kategori:'Rambut', nama:'Hair Spa Treatment', durasi:60, harga:220000, desc:'Perawatan rambut intensif dengan masker keratin', icon:'💇' },
  { id:'S06', kategori:'Kuku', nama:'Manicure & Pedicure', durasi:75, harga:175000, desc:'Perawatan kuku tangan dan kaki lengkap', icon:'💅' },
  { id:'S07', kategori:'Paket', nama:'Paket Pengantin Lengkap', durasi:240, harga:1250000, desc:'Paket lengkap perawatan untuk hari spesialmu', icon:'👰' },
  { id:'S08', kategori:'Wajah', nama:'Anti-Aging Facial', durasi:90, harga:450000, desc:'Perawatan anti penuaan dengan teknologi terkini', icon:'⭐' }
];
var STAFF = [
  { id:'T01', nama:'Ayu Lestari', cabang:'JKT', spesialis:['Wajah','Paket'], foto:'👩', rating:4.9, totalBooking:342 },
  { id:'T02', nama:'Sinta Maharani', cabang:'JKT', spesialis:['Tubuh','Wajah'], foto:'👩‍🦱', rating:4.8, totalBooking:298 },
  { id:'T03', nama:'Putri Andini', cabang:'JKT', spesialis:['Rambut','Kuku'], foto:'👱‍♀️', rating:4.7, totalBooking:215 },
  { id:'T04', nama:'Rina Safitri', cabang:'BDG', spesialis:['Wajah','Tubuh'], foto:'👩‍🦰', rating:4.9, totalBooking:387 },
  { id:'T05', nama:'Dewi Anggraini', cabang:'BDG', spesialis:['Tubuh','Paket'], foto:'🧕', rating:4.6, totalBooking:178 },
  { id:'T06', nama:'Nadia Kusuma', cabang:'SBY', spesialis:['Wajah','Kuku'], foto:'👩‍🦳', rating:4.8, totalBooking:263 },
  { id:'T07', nama:'Reni Oktavia', cabang:'SBY', spesialis:['Tubuh','Rambut'], foto:'👩', rating:4.7, totalBooking:201 }
];
var SLOTS_PAGI  = ['09:00','10:00','11:00'];
var SLOTS_SIANG = ['13:00','14:00','15:00','16:00'];

function futureDateStr(n) {
  var d = new Date(); d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
var BOOKED_SLOTS = { JKT:{}, BDG:{}, SBY:{} };
BOOKED_SLOTS.JKT[futureDateStr(1)] = ['09:00','10:00','14:00'];
BOOKED_SLOTS.JKT[futureDateStr(3)] = ['11:00','15:00'];
BOOKED_SLOTS.BDG[futureDateStr(1)] = ['09:00','13:00'];
BOOKED_SLOTS.SBY[futureDateStr(2)] = ['10:00','11:00','16:00'];

var state = {
  step:1, service:null, branch:null, date:null, slot:null, staff:null,
  customer:{nama:'',telp:'',email:'',catatan:''},
  booking:null, view:'booking', adminTab:'bookings',
  calMonth:new Date().getMonth(), calYear:new Date().getFullYear(),
  catFilter:'', reviewBookingId:null, reviewStar:0
};
var bookings = JSON.parse(localStorage.getItem('bja_bookings') || '[]');
var reviews  = JSON.parse(localStorage.getItem('bja_reviews') || '[]');
var chartInstances = {};

function save() {
  localStorage.setItem('bja_bookings', JSON.stringify(bookings));
  localStorage.setItem('bja_reviews',  JSON.stringify(reviews));
}
function genId() {
  return 'BKN' + Date.now().toString(36).toUpperCase().slice(-5) + Math.random().toString(36).substring(2,4).toUpperCase();
}
function fmtRupiah(n) { return 'Rp ' + n.toLocaleString('id-ID'); }
function fmtTglShort(str) {
  if (!str) return '-';
  var d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
}
function getStatusColor(s) {
  var m = { pending:'background:rgba(217,119,6,0.1);color:#d97706;', confirmed:'background:rgba(37,99,235,0.1);color:#2563eb;', 'in-progress':'background:rgba(124,58,237,0.1);color:#7c3aed;', completed:'background:rgba(22,163,74,0.1);color:#16a34a;', cancelled:'background:rgba(220,38,38,0.1);color:#dc2626;' };
  return m[s] || 'background:#f3f4f6;color:#6b7280;';
}
function getStatusLabel(s) {
  var m = { pending:'Pending', confirmed:'Dikonfirmasi', 'in-progress':'Berlangsung', completed:'Selesai', cancelled:'Dibatalkan' };
  return m[s] || s;
}
function showToast(msg) {
  var old = document.getElementById('_toast'); if (old) old.remove();
  var t = document.createElement('div'); t.id = '_toast';
  t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2c1b23;color:white;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:400;box-shadow:0 12px 28px rgba(44,27,35,0.28);animation:fadeSlide 0.3s ease;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;font-family:inherit;';
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.remove(); }, 3000);
}
function validatePhone(p) { return /^(\+62|62|0)8[1-9][0-9]{6,10}$/.test(p.replace(/[\s\-]/g,'')); }
function validateEmail(e) { return !e || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function render() {
  document.getElementById('app').innerHTML = buildApp();
  if (state.view === 'booking' && state.step === 3) renderCalendar();
  if (state.view === 'booking' && state.step === 5 && state.booking) renderQR();
  if (state.view === 'admin' && state.adminTab === 'analitik') renderCharts();
}
function buildApp() {
  var body = '';
  if (state.view==='booking') body = buildBooking();
  else if (state.view==='tracking') body = buildTracking();
  else if (state.view==='admin') body = buildAdmin();
  return buildNav() + '<div class="max-w-5xl mx-auto px-4 py-8">' + body + '</div>' + buildFooter();
}
function buildNav() {
  return '<nav style="background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line-soft);" class="sticky top-0 z-50"><div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-2"><div class="flex items-center gap-2" style="flex-shrink:0;"><div style="width:38px;height:38px;background:var(--grad-primary);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(160,18,69,0.28);"><svg width="18" height="18" fill="white" viewBox="0 0 24 24"><path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/></svg></div><div><div class="font-display" style="font-size:19px;font-weight:600;color:var(--wine);line-height:1;">Seruni</div><div style="font-size:9px;color:var(--gold);font-weight:700;letter-spacing:0.14em;margin-top:3px;" class="hidden sm:block">BEAUTY SALON</div></div></div><div class="flex items-center gap-1" style="overflow-x:auto;-webkit-overflow-scrolling:touch;"><button onclick="setView(\'booking\')" class="tab-btn ' + (state.view==='booking'?'active':'') + '">Booking</button><button onclick="setView(\'tracking\')" class="tab-btn ' + (state.view==='tracking'?'active':'') + '">Cek Status</button><button onclick="setView(\'admin\')" class="tab-btn ' + (state.view==='admin'?'active':'') + '">Admin</button></div></div></nav>';
}
function buildFooter() {
  return '<footer style="margin-top:48px;padding:24px;border-top:1px solid var(--line-soft);text-align:center;"><p style="font-size:12px;color:var(--muted);">Demo project by <a href="https://bagasaria93.github.io" target="_blank" rel="noopener noreferrer" style="color:var(--primary);text-decoration:none;font-weight:600;">Bagas Aria Sativa</a></p></footer>';
}
function buildBooking() {
  if (state.step === 5 && state.booking) return buildConfirmation();
  var steps = ['Layanan','Cabang','Jadwal','Data Diri'];
  var sh = '<div class="flex items-center mb-8">';
  steps.forEach(function(s, i) {
    var n = i+1, done = n < state.step, active = n === state.step;
    sh += '<div class="flex flex-col items-center"><div class="step-dot ' + (done?'done':active?'active':'pending') + '">';
    if (done) sh += '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
    else sh += n;
    sh += '</div><div style="font-size:11px;margin-top:6px;font-weight:600;color:' + (active?'var(--primary)':done?'var(--primary-3)':'var(--muted)') + ';" class="hidden sm:block">' + s + '</div></div>';
    if (i < steps.length-1) sh += '<div class="step-line mx-2 ' + (n < state.step?'done':'pending') + '"></div>';
  });
  sh += '</div>';
  var content = '';
  if (state.step===1) content = buildStep1();
  else if (state.step===2) content = buildStep2();
  else if (state.step===3) content = buildStep3();
  else if (state.step===4) content = buildStep4();
  var nav = '<div class="flex justify-between mt-8">';
  if (state.step > 1) nav += '<button onclick="prevStep()" class="btn btn-secondary">Kembali</button>';
  else nav += '<div></div>';
  var label = state.step < 4 ? 'Lanjut &rarr;' : 'Konfirmasi Booking';
  var action = state.step < 4 ? 'nextStep()' : 'submitBooking()';
  nav += '<button onclick="' + action + '" class="btn btn-primary">' + label + '</button></div>';
  return sh + '<div id="step-content" class="fade-slide">' + content + '</div>' + nav;
}

function buildStep1() {
  var cats = [];

  if (!bookings.length) return '<div class="card-surface" style="padding:48px;text-align:center;"><div style="font-size:40px;margin-bottom:10px;">📋</div><div style="color:var(--muted);font-size:14px;">Belum ada booking masuk</div></div>';

  ['ID','Pelanggan','Layanan','Jadwal','Status','Aksi'].forEach(function(h){ html += '<th style="text-align:left;padding:12px 16px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;">' + h + '</th>'; });
  html += '</tr></thead><tbody>';

    var svc=SERVICES.find(function(s){return s.id===b.serviceId;}), br=BRANCHES.find(function(x){return x.id===b.branchId;});
    html += '<tr class="hx-row" style="border-top:1px solid var(--line-soft);transition:background 0.15s;">' +
      '<td style="padding:12px 16px;font-family:monospace;font-size:11px;color:var(--muted);">' + b.id + '</td>' +
      '<td style="padding:12px 16px;"><div style="font-weight:600;color:var(--ink);">' + escapeHtml(b.customer.nama) + '</div><div style="font-size:11px;color:var(--muted);">' + escapeHtml(b.customer.telp) + '</div></td>' +
      '<td style="padding:12px 16px;color:var(--ink-soft);">' + (svc?svc.nama:'-') + '</td>' +
      '<td style="padding:12px 16px;"><div>' + fmtTglShort(b.date) + '</div><div style="font-size:11px;color:var(--muted);">' + b.slot + (br?' &bull; '+br.nama:'') + '</div></td>' +
      '<td style="padding:12px 16px;"><span class="status-badge" style="' + getStatusColor(b.status) + '">' + getStatusLabel(b.status) + '</span></td>' +
      '<td style="padding:12px 16px;"><select onchange="updateStatus(\'' + b.id + '\',this.value)" style="font-size:12px;border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;outline:none;background:white;cursor:pointer;font-family:inherit;">' +
      [['pending','Pending'],['confirmed','Konfirmasi'],['in-progress','Berlangsung'],['completed','Selesai'],['cancelled','Batalkan']].map(function(o){ return '<option value="' + o[0] + '"' + (b.status===o[0]?' selected':'') + '>' + o[1] + '</option>'; }).join('') +
      '</select></td></tr>';

function buildAdminStaff() {
  var data = STAFF.map(function(t) {
    var cnt=bookings.filter(function(b){return b.staffId===t.id;}).length, rvs=reviews.filter(function(r){return r.staffId===t.id;});
    var avg=rvs.length?(rvs.reduce(function(a,r){return a+r.rating;},0)/rvs.length).toFixed(1):t.rating.toFixed(1);
    return {id:t.id,nama:t.nama,cabang:t.cabang,spesialis:t.spesialis,foto:t.foto,cnt:cnt+t.totalBooking,avg:parseFloat(avg)};
  }).sort(function(a,b){return b.avg-a.avg||b.cnt-a.cnt;});
  var mx=Math.max.apply(null,data.map(function(t){return t.cnt;}));
  var rg=['linear-gradient(135deg,var(--gold-soft),var(--gold-pale))','linear-gradient(135deg,#a89aa0,#d8cdd1)','linear-gradient(135deg,#c2703f,#e2a06f)'];
  return '<div style="display:flex;flex-direction:column;gap:10px;">' + data.map(function(t,i){
    var br=BRANCHES.find(function(b){return b.id===t.cabang;}), pct=mx?Math.round(t.cnt/mx*100):0;
    return '<div class="card-surface" style="padding:16px;"><div style="display:flex;align-items:center;gap:14px;"><div style="width:34px;height:34px;border-radius:50%;' + (i<3?'background:'+rg[i]+';':'background:var(--primary-wash);') + 'display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:' + (i<3?'white':'var(--primary)') + ';flex-shrink:0;">' + (i+1) + '</div><div style="font-size:32px;flex-shrink:0;">' + t.foto + '</div><div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;"><div style="font-weight:700;font-size:14px;color:var(--ink);">' + t.nama + '</div><div><span style="color:var(--gold);">&#9733;</span><span style="font-size:13px;font-weight:800;color:var(--ink-soft);">' + t.avg + '</span></div></div><div style="font-size:12px;color:var(--muted);margin-bottom:8px;">' + (br?br.nama:'-') + ' &bull; ' + t.spesialis.join(', ') + '</div><div style="height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;"><div style="height:100%;border-radius:3px;background:var(--grad-primary);width:' + pct + '%;"></div></div><div style="font-size:11px;color:var(--muted);margin-top:4px;">' + t.cnt + ' total booking</div></div></div></div>';
  }).join('') + '</div>';
}
function buildAdminAnalitik() {
  return '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div class="card-surface" style="padding:18px;"><div style="font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:14px;">Booking per Cabang</div><div class="chart-wrap"><canvas id="chart-branch"></canvas></div></div><div class="card-surface" style="padding:18px;"><div style="font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:14px;">Booking per Layanan</div><div class="chart-wrap"><canvas id="chart-service"></canvas></div></div></div>';
}
function buildAdminReviews() {
  var nr=bookings.filter(function(b){return b.status==='completed'&&!reviews.find(function(r){return r.bookingId===b.id;});});
  var html='';
  if (nr.length) {
    html += '<div style="background:var(--primary-wash);border:1.5px solid var(--primary-3);border-radius:16px;padding:16px;margin-bottom:16px;"><div style="font-size:13px;font-weight:700;color:var(--wine);margin-bottom:10px;">Menunggu Ulasan</div><div style="display:flex;flex-direction:column;gap:8px;">';
    nr.forEach(function(b){var svc=SERVICES.find(function(s){return s.id===b.serviceId;}); html+='<div style="display:flex;align-items:center;justify-content:space-between;background:white;border-radius:12px;padding:12px;"><div style="font-size:13px;"><span style="font-weight:700;">' + b.id + '</span> &bull; ' + (svc?svc.nama:'-') + '</div><button onclick="openReview(\'' + b.id + '\')" class="btn btn-primary" style="padding:7px 16px;font-size:12px;">Beri Ulasan</button></div>';});
    html += '</div></div>';
  }
  if (!reviews.length) return html + '<div class="card-surface" style="padding:48px;text-align:center;"><div style="font-size:40px;margin-bottom:10px;">&#11088;</div><div style="color:var(--muted);font-size:14px;">Belum ada ulasan</div></div>';
  html += '<div style="display:flex;flex-direction:column;gap:10px;">';
  reviews.slice().reverse().forEach(function(r){
    var b=bookings.find(function(bk){return bk.id===r.bookingId;}), st=STAFF.find(function(t){return t.id===r.staffId;}), svc=b?SERVICES.find(function(s){return s.id===b.serviceId;}):null;
    html += '<div class="card-surface" style="padding:16px;"><div style="display:flex;align-items:start;justify-content:space-between;margin-bottom:8px;"><div><div style="font-size:14px;font-weight:700;color:var(--ink);">' + (b?escapeHtml(b.customer.nama):'-') + '</div><div style="font-size:12px;color:var(--muted);">' + (svc?svc.nama:'-') + ' &bull; ' + (st?st.nama:'-') + '</div></div><div>' + [1,2,3,4,5].map(function(n){return '<span style="color:' + (n<=r.rating?'var(--gold)':'var(--line)') + ';font-size:16px;">&#9733;</span>';}).join('') + '</div></div><p style="font-size:13px;color:var(--ink-soft);line-height:1.6;">' + escapeHtml(r.komentar) + '</p></div>';
  });
  return html + '</div>';
}
function renderCalendar() {
  var now=new Date(), year=state.calYear, month=state.calMonth;
  var firstDay=new Date(year,month,1).getDay(), dim=new Date(year,month+1,0).getDate();
  var titleEl=document.getElementById('cal-title'), gridEl=document.getElementById('cal-grid');
  if (!titleEl||!gridEl) return;
  var months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  titleEl.textContent = months[month] + ' ' + year;
  var html='';
  for (var i=0;i<firstDay;i++) html+='<div class="cal-day empty"></div>';
  for (var d=1;d<=dim;d++) {
    var ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dt=new Date(year,month,d);
    var isPast=dt<new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var isToday=dt.toDateString()===now.toDateString(), isSel=state.date===ds;
    var cls='cal-day';
    if (isPast) cls+=' disabled';
    else if (isSel&&isToday) cls+=' today selected';
    else if (isSel) cls+=' selected';
    else if (isToday) cls+=' today';
    html+='<div class="'+cls+'"'+(!isPast?' tabindex="0" role="button" aria-pressed="'+(isSel?'true':'false')+'" aria-label="Pilih tanggal '+d+' '+months[month]+' '+year+'" onclick="selectDate(\''+ds+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();selectDate(\''+ds+'\');}"':'')+'>'+d+'</div>';
  }
  gridEl.innerHTML=html;
}
function renderQR() {
  var c=document.getElementById('qr-container'); if (!c) return; c.innerHTML='';
  try { new QRCode(c,{text:state.booking.id+'|'+state.booking.date+'|'+state.booking.slot,width:120,height:120,colorDark:'#a01245',colorLight:'#ffffff'}); }
  catch(e) { c.innerHTML='<div style="width:120px;height:120px;background:#fdeef1;border:1.5px solid #e8577e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#a01245;text-align:center;padding:8px;">'+state.booking.id+'</div>'; }
}
function renderCharts() {
  requestAnimationFrame(function() {
    var bc={};BRANCHES.forEach(function(b){bc[b.nama]=0;});
    bookings.forEach(function(b){var br=BRANCHES.find(function(x){return x.id===b.branchId;});if(br)bc[br.nama]=(bc[br.nama]||0)+1;});
    var ctx1=document.getElementById('chart-branch');
    if (ctx1) {
      if(chartInstances['branch'])chartInstances['branch'].destroy();
      var bv=Object.values(bc),hasB=bv.some(function(v){return v>0;});
      chartInstances['branch']=new Chart(ctx1,{type:'doughnut',data:{labels:Object.keys(bc),datasets:[{data:hasB?bv:[1,1,1],backgroundColor:['#a01245','#c81d55','#e8577e'],borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'Plus Jakarta Sans',size:11},boxWidth:10,padding:12,color:'#6b5560'}},subtitle:hasB?{}:{display:true,text:'Contoh data (belum ada booking)',color:'#8c7a80',font:{size:11}}},animation:false}});
    }
    var sc={};bookings.forEach(function(b){var svc=SERVICES.find(function(s){return s.id===b.serviceId;});if(svc)sc[svc.nama]=(sc[svc.nama]||0)+1;});
    var ctx2=document.getElementById('chart-service');
    if (ctx2) {
      if(chartInstances['service'])chartInstances['service'].destroy();
      var sl=Object.keys(sc),sv=Object.values(sc),hasS=sl.length>0;
      if(!hasS){sl=SERVICES.slice(0,4).map(function(s){return s.nama;});sv=[3,2,4,1];}
      chartInstances['service']=new Chart(ctx2,{type:'bar',data:{labels:sl,datasets:[{data:sv,backgroundColor:'rgba(160,18,69,0.82)',borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},subtitle:hasS?{}:{display:true,text:'Contoh data (belum ada booking)',color:'#8c7a80',font:{size:11}}},scales:{x:{grid:{display:false},ticks:{font:{size:10,family:'Plus Jakarta Sans'},maxRotation:30,color:'#6b5560'}},y:{beginAtZero:true,ticks:{stepSize:1,color:'#6b5560'}}},animation:false}});
    }
  });
}

function setView(v){state.view=v;render();}
function setAdminTab(t){state.adminTab=t;render();}
function changeMonth(dir){
  state.calMonth+=dir;
  if(state.calMonth>11){state.calMonth=0;state.calYear++;}
  if(state.calMonth<0){state.calMonth=11;state.calYear--;}
  renderCalendar();
}
function filterCat(c) {
  state.catFilter=c;
  var grid=document.getElementById('service-grid'), filt=document.getElementById('cat-filters');
  if (!grid||!filt){render();return;}
  grid.innerHTML=buildSvcCards(c);
  var cats=['']; SERVICES.forEach(function(s){if(cats.indexOf(s.kategori)===-1)cats.push(s.kategori);});
  var btns=filt.querySelectorAll('button');
  btns.forEach(function(btn,i){
    var bc=cats[i]||'';
    btn.className='chip '+(bc===c?'chip-active':'');
  });
}
function selectService(id) {
  var oldKategori = state.service ? state.service.kategori : null;
  state.service=SERVICES.find(function(s){return s.id===id;});
  if (state.staff && oldKategori && state.service.kategori !== oldKategori) { state.staff = null; }
  var grid=document.getElementById('service-grid');
  if(!grid){render();return;}
  grid.innerHTML=buildSvcCards(state.catFilter);
}
function selectBranch(id) {
  state.branch=BRANCHES.find(function(b){return b.id===id;}); state.staff=null;
  document.querySelectorAll('.branch-card').forEach(function(c){c.classList.toggle('selected',c.dataset.bid===id);});
  var sc=document.getElementById('step-content');
  if(sc){sc.innerHTML=buildStep2();}else{render();}
}
function selectStaff(id,el) {
  state.staff=STAFF.find(function(t){return t.id===id;});
  document.querySelectorAll('.staff-card').forEach(function(c){c.classList.remove('selected');});
  if(el)el.classList.add('selected');
}
function selectDate(d){state.date=d;state.slot=null;render();}
function selectSlot(s,el){
  state.slot=s;
  document.querySelectorAll('.slot-btn').forEach(function(b){b.classList.remove('selected');});
  if(el)el.classList.add('selected');
}
function updateCustomer(f,v){state.customer[f]=v;}
function nextStep(){
  if(state.step===1&&!state.service){showToast('Pilih layanan terlebih dahulu.');return;}
  if(state.step===2&&!state.branch){showToast('Pilih cabang terlebih dahulu.');return;}
  if(state.step===3&&!state.date){showToast('Pilih tanggal terlebih dahulu.');return;}
  if(state.step===3&&!state.slot){showToast('Pilih waktu terlebih dahulu.');return;}
  state.step++;render();window.scrollTo(0,0);
}
function prevStep(){state.step--;render();window.scrollTo(0,0);}
function submitBooking(){
  var nama=state.customer.nama.trim(),telp=state.customer.telp.trim(),email=state.customer.email.trim();
  if(!nama){showToast('Nama lengkap wajib diisi.');return;}
  if(!telp){showToast('Nomor WhatsApp wajib diisi.');return;}
  if(!validatePhone(telp)){showToast('Format nomor WhatsApp tidak valid.');return;}
  if(!validateEmail(email)){showToast('Format email tidak valid.');return;}
  var bk={id:genId(),serviceId:state.service.id,branchId:state.branch.id,staffId:state.staff?state.staff.id:null,date:state.date,slot:state.slot,customer:{nama:nama,telp:telp,email:email,catatan:state.customer.catatan},status:'pending',createdAt:new Date().toISOString()};
  bookings.push(bk);save();state.booking=bk;state.step=5;render();window.scrollTo(0,0);
}
function resetBooking(){
  state.step=1;state.service=null;state.branch=null;state.date=null;state.slot=null;state.staff=null;
  state.customer={nama:'',telp:'',email:'',catatan:''};state.booking=null;state.catFilter='';
  render();window.scrollTo(0,0);
}
function shareWA(){
  if(!state.booking)return;
  var svc=SERVICES.find(function(s){return s.id===state.booking.serviceId;}),br=BRANCHES.find(function(x){return x.id===state.booking.branchId;});
  var msg='Halo! Saya baru saja booking di Seruni Beauty.\n\nKode Booking: '+state.booking.id+'\nLayanan: '+(svc?svc.nama:'-')+'\nCabang: '+(br?br.nama:'-')+(br?'\nTelp: '+br.telp:'')+'\nTanggal: '+fmtTglShort(state.booking.date)+'\nWaktu: '+state.booking.slot+'\n\nSampai jumpa di Seruni Beauty!';
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
function doTrack(){var inp=document.getElementById('track-id');if(inp)showTrackDetail(inp.value.trim().toUpperCase());}
function showTrackDetail(id){
  var re=document.getElementById('track-result');if(!re)return;
  var b=bookings.find(function(bk){return bk.id===id;});
  if(!b){re.innerHTML='<div style="background:#fdf1f1;border:1.5px solid #f3c6c6;border-radius:16px;padding:16px;text-align:center;font-size:13px;color:#b3261e;margin-bottom:12px;">Kode booking tidak ditemukan.</div>';return;}
  var svc=SERVICES.find(function(s){return s.id===b.serviceId;}),br=BRANCHES.find(function(x){return x.id===b.branchId;}),st=STAFF.find(function(t){return t.id===b.staffId;});
  var statuses=['pending','confirmed','in-progress','completed'],curIdx=statuses.indexOf(b.status);
  var html='<div class="card-surface" style="padding:18px;margin-bottom:12px;">';
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><div><div style="font-weight:800;font-family:monospace;color:var(--ink);">'+b.id+'</div><div style="font-size:12px;color:var(--muted);">'+escapeHtml(b.customer.nama)+'</div></div><span class="status-badge" style="'+getStatusColor(b.status)+'">'+getStatusLabel(b.status)+'</span></div>';
  [['Layanan',svc?svc.nama:'-'],['Cabang',br?br.nama:'-'],['Jadwal',fmtTglShort(b.date)+' pukul '+b.slot],['Terapis',st?st.nama:'Tidak dipilih']].forEach(function(r){
    html+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;"><span style="color:var(--muted);">'+r[0]+'</span><span style="font-weight:600;color:var(--ink);">'+r[1]+'</span></div>';
  });
  html+='<div style="display:flex;align-items:center;overflow-x:auto;padding-bottom:4px;margin-top:14px;gap:4px;">';
  statuses.forEach(function(s,i){
    html+='<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;"><div style="width:26px;height:26px;border-radius:50%;background:'+(i<=curIdx?'var(--grad-primary)':'var(--line-soft)')+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:'+(i<=curIdx?'white':'var(--muted)')+';">'+(i<curIdx?'<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>':(i+1))+'</div><span style="font-size:11px;font-weight:'+(i<=curIdx?'600':'400')+';color:'+(i<=curIdx?'var(--ink-soft)':'var(--muted)')+';">'+getStatusLabel(s)+'</span></div>';
    if(i<statuses.length-1)html+='<div style="width:14px;height:2px;flex-shrink:0;background:'+(i<curIdx?'var(--primary)':'var(--line)')+';"></div>';
  });
  html+='</div>';
  if(b.status==='completed'&&!reviews.find(function(r){return r.bookingId===b.id;}))
    html+='<button onclick="openReview(\''+b.id+'\')" class="btn btn-primary btn-block" style="margin-top:14px;">Beri Ulasan</button>';
  re.innerHTML=html+'</div>';
}
function updateStatus(id,status){var b=bookings.find(function(bk){return bk.id===id;});if(b){b.status=status;save();render();}}
function openReview(bookingId){
  state.reviewBookingId=bookingId;state.reviewStar=0;
  var b=bookings.find(function(bk){return bk.id===bookingId;}),svc=b?SERVICES.find(function(s){return s.id===b.serviceId;}):null;
  var overlay=document.createElement('div');overlay.className='modal-overlay';overlay.id='review-modal';
  overlay.innerHTML='<div class="modal-box p-6"><div class="font-display" style="font-size:19px;font-weight:600;color:var(--ink);margin-bottom:4px;">Beri Ulasan</div><div style="font-size:13px;color:var(--muted);margin-bottom:20px;">'+(svc?svc.nama:'')+'&bull;'+bookingId+'</div><div style="margin-bottom:18px;"><div style="font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;">Rating <span style="color:var(--primary);">*</span></div><div style="display:flex;gap:8px;" id="star-row">'+[1,2,3,4,5].map(function(n){return '<span onclick="setReviewStar('+n+')" onmouseover="hoverStar('+n+')" onmouseout="hoverStar(0)" style="cursor:pointer;font-size:36px;color:var(--line);transition:all 0.15s;" id="star-'+n+'">&#9733;</span>';}).join('')+'</div></div><div style="margin-bottom:18px;"><div style="font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;">Komentar <span style="color:var(--primary);">*</span></div><textarea id="review-komentar" rows="3" placeholder="Bagaimana pengalaman Anda?" class="inp" style="resize:none;"></textarea></div><div style="display:flex;gap:10px;"><button onclick="closeReview()" class="btn btn-secondary" style="flex:1;">Batal</button><button onclick="submitReview()" class="btn btn-primary" style="flex:1;">Kirim Ulasan</button></div></div>';
  document.body.appendChild(overlay);
}
function hoverStar(n){var a=n||state.reviewStar||0;for(var i=1;i<=5;i++){var el=document.getElementById('star-'+i);if(el){el.style.color=i<=a?'#a9832e':'#ecdde1';el.style.transform=i<=a?'scale(1.15)':'scale(1)';}}}
function setReviewStar(n){state.reviewStar=n;hoverStar(n);}
function closeReview(){var m=document.getElementById('review-modal');if(m)document.body.removeChild(m);state.reviewBookingId=null;state.reviewStar=0;}
function submitReview(){
  if(!state.reviewStar){showToast('Pilih rating bintang terlebih dahulu.');return;}
  var k=document.getElementById('review-komentar'),komentar=k?k.value.trim():'';
  if(!komentar){showToast('Komentar wajib diisi.');return;}
  var b=bookings.find(function(bk){return bk.id===state.reviewBookingId;});
  reviews.push({bookingId:state.reviewBookingId,staffId:b?b.staffId:null,rating:state.reviewStar,komentar:komentar,createdAt:new Date().toISOString()});
  save();closeReview();render();
}

render();
