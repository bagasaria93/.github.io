function MsgBubble({ msg, streaming }) {
  const [copied, setCopied] = useState(false);
  const isUser = msg.role === 'user';

  function doCopy() {
    navigator.clipboard.writeText(msg.content).then(function() {
      setCopied(true);
      setTimeout(function() { setCopied(false); }, 2000);
    });
  }

  return (
    <div className={'msg-wrap flex gap-3 msg-appear ' + (isUser ? 'flex-row-reverse' : 'flex-row')}>
      <div className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold" style={isUser ? {background:'rgba(79,142,247,0.2)',color:'#4f8ef7',border:'1px solid rgba(79,142,247,0.3)'} : {background:'rgba(79,142,247,0.1)',color:'#4f8ef7',border:'1px solid rgba(79,142,247,0.2)'}}>
        {isUser ? 'U' : 'AI'}
      </div>
      <div className={'flex flex-col max-w-[75%] ' + (isUser ? 'items-end' : 'items-start')}>
        <div className="rounded-2xl px-4 py-3 text-sm leading-relaxed" style={isUser ? {background:'#1a2540',border:'1px solid rgba(79,142,247,0.2)',color:'#e8eaf0',borderTopRightRadius:'4px'} : {background:'#131720',border:'1px solid #252a38',color:'#e8eaf0',borderTopLeftRadius:'4px'}}>
          {streaming ? (
            <span className="typing-cursor">{msg.content}</span>
          ) : (
            <span style={{whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{msg.content}</span>
          )}
        </div>
        <div className={'flex items-center gap-2 mt-1 ' + (isUser ? 'flex-row-reverse' : 'flex-row')}>
          <span className="text-xs text-muted">{fmtTime(msg.ts)}</span>
          {!streaming && msg.content && (
            <button onClick={doCopy} className="copy-btn flex items-center gap-1 text-xs text-muted hover:text-accent transition-colors">
              <SvgCopy />
              {copied ? 'Disalin!' : ''}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function LoadingBubble() {
  return (
    <div className="flex gap-3 msg-appear">
      <div className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold" style={{background:'rgba(79,142,247,0.1)',color:'#4f8ef7',border:'1px solid rgba(79,142,247,0.2)'}}>AI</div>

          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  );
}

function ChatArea({ messages, loading, streamId }) {
  const bottomRef = useRef(null);

  useEffect(function() {
    if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages, streamId]);

  return (
    <div className="flex-1 overflow-y-auto px-4 py-6 space-y-5">
      {messages.map(function(msg) {
        return (
          <MsgBubble key={msg.id} msg={msg} streaming={streamId === msg.id} />
        );
      })}
      {loading && !streamId && <LoadingBubble />}
      <div ref={bottomRef}></div>
    </div>
  );
}

function InputBar({ onSend, disabled, apiKey }) {
  const [text, setText] = useState('');
  const ref = useRef(null);
  const hasKey = apiKey.trim().length > 0;

  function submit() {
    const t = text.trim();
    if (!t || disabled || !hasKey) return;
    onSend(t);
    setText('');
    if (ref.current) ref.current.style.height = 'auto';
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  }

  function onInput(e) {
    setText(e.target.value);
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
  }

  return (
    <div className="flex-shrink-0 border-t border-border bg-surface px-4 py-3">
      {!hasKey && (
        <div className="mb-2 px-3 py-2 rounded-lg text-xs" style={{background:'rgba(245,158,11,0.1)',border:'1px solid rgba(245,158,11,0.2)',color:'#fbbf24'}}>
          Masukkan API key Anthropic di panel Settings untuk mulai chat.
        </div>
      )}
      <div className="flex items-end gap-3">
        <textarea
          ref={ref}
          value={text}
          onChange={onInput}
          onKeyDown={onKey}
          placeholder={hasKey ? 'Ketik pesan... (Enter kirim, Shift+Enter baris baru)' : 'API key belum diatur...'}
          disabled={disabled || !hasKey}
          rows={1}
          className="flex-1 bg-bg border border-border rounded-xl px-4 py-3 text-sm text-textPrimary input-glow focus:outline-none focus:border-accent transition-colors leading-relaxed disabled:opacity-50 disabled:cursor-not-allowed"
          style={{minHeight:'46px',maxHeight:'140px',color:'#e8eaf0'}}
        />
        <button
          onClick={submit}
          disabled={disabled || !hasKey || !text.trim()}
          className="flex-shrink-0 w-11 h-11 rounded-xl flex items-center justify-center text-white transition-all glow-accent disabled:opacity-40 disabled:cursor-not-allowed"
          style={{background:'#4f8ef7'}}
        >
          <SvgSend />
        </button>
      </div>
      <div className="flex items-center justify-between mt-2">
        <span className="text-xs text-muted">Shift+Enter untuk baris baru</span>
        <span className="text-xs font-mono text-muted">{text.length}/4000</span>
      </div>
    </div>
  );
}

function ConfirmModal({ onOk, onCancel }) {

        <div className="text-sm text-textSecondary mb-5 leading-relaxed">Semua pesan akan dihapus dan tidak dapat dikembalikan.</div>
        <div className="flex gap-3">
          <button onClick={onCancel} className="flex-1 py-2 rounded-lg border border-border text-sm text-textSecondary hover:bg-surfaceHover transition-colors">Batal</button>
          <button onClick={onOk} className="flex-1 py-2 rounded-lg text-sm text-white font-medium transition-colors" style={{background:'#ef4444'}}>Hapus</button>

      </div>

}

function App() {
  const [apiKey, setApiKeyRaw] = useState(function() { return localStorage.getItem('cc_key') || ''; });
  const [sysPrompt, setSysPromptRaw] = useState(function() { return localStorage.getItem('cc_sys') || DEFAULT_SYSTEM; });
  const [messages, setMessages] = useState([WELCOME]);
  const [loading, setLoading] = useState(false);
  const [streamId, setStreamId] = useState(null);
  const [error, setError] = useState('');
  const [confirm, setConfirm] = useState(false);
  const [tab, setTab] = useState('settings');
  const [mobOpen, setMobOpen] = useState(false);

  function setApiKey(v) { setApiKeyRaw(v); localStorage.setItem('cc_key', v); }
  function setSysPrompt(v) { setSysPromptRaw(v); localStorage.setItem('cc_sys', v); }

  async function sendMsg(text) {
    if (loading) return;
    setError('');
    const userMsg = { id: String(Date.now()), role: 'user', content: text, ts: new Date().toISOString() };
    const next = [...messages, userMsg];
    setMessages(next);
    setLoading(true);

    const apiMsgs = next.filter(function(m) { return m.id !== 'welcome'; }).map(function(m) { return { role: m.role, content: m.content }; });

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1024, system: sysPrompt, messages: apiMsgs }),
      });

      if (!res.ok) {
        const ed = await res.json().catch(function() { return {}; });
        const em = (ed.error && ed.error.message) || ('HTTP ' + res.status);
        if (res.status === 401) throw new Error('API key tidak valid. Periksa kembali API key Anda.');
        if (res.status === 429) throw new Error('Rate limit tercapai. Tunggu beberapa saat lalu coba lagi.');
        throw new Error('Error: ' + em);
      }

      const data = await res.json();
      const content = (data.content && data.content[0] && data.content[0].text) || '';
      const aiId = String(Date.now() + 1);
      const aiMsg = { id: aiId, role: 'assistant', content: '', ts: new Date().toISOString() };

      setMessages(function(prev) { return [...prev, aiMsg]; });
      setLoading(false);

      let i = 0;
      const chars = content.split('');
      function typeNext() {
        if (i < chars.length) {
          const partial = chars.slice(0, i + 1).join('');
          setStreamId(aiId);
          setMessages(function(prev) { return prev.map(function(m) { return m.id === aiId ? Object.assign({}, m, { content: partial }) : m; }); });
          i++;
          setTimeout(typeNext, 12);
        } else {
          setStreamId(null);
        }
      }
      typeNext();

    } catch(err) {
      setLoading(false);
      setStreamId(null);
      setError(err.message || 'Terjadi kesalahan. Coba lagi.');
    }
  }

  function doClear() {
    setMessages([WELCOME]);
    setError('');
    setStreamId(null);
    setConfirm(false);
  }

  const userCount = messages.filter(function(m) { return m.role === 'user'; }).length;

  return (
    <div className="flex h-screen bg-bg overflow-hidden">
      <div className={'mob-overlay ' + (mobOpen ? 'show' : '')} onClick={function() { setMobOpen(false); }}></div>

      <div className={'sidebar-panel ' + (mobOpen ? 'open' : '')}>
        <Sidebar
          apiKey={apiKey}
          setApiKey={setApiKey}
          systemPrompt={sysPrompt}
          setSystemPrompt={setSysPrompt}
          onClear={function() { setConfirm(true); }}
          msgCount={userCount}
          tab={tab}
          setTab={setTab}
        />
      </div>

      <div className="flex-1 flex flex-col min-w-0">
        <div className="flex-shrink-0 flex items-center gap-3 px-4 py-3 border-b border-border bg-surface">
          <button onClick={function() { setMobOpen(function(v) { return !v; }); }} className="text-muted hover:text-textPrimary transition-colors" style={{display:'none'}} id="mob-btn">
            <SvgMenu />
          </button>
          <div className="flex-1 min-w-0">
            <div className="font-semibold text-textPrimary text-sm">ChatCerdas</div>
            <div className="text-xs text-muted">Antarmuka AI berbasis Anthropic API</div>
          </div>
          {loading && (
            <div className="flex items-center gap-1.5 text-xs text-accent">
              <div className="dot-pulse" style={{transform:'scale(0.75)'}}>
                <span></span><span></span><span></span>
              </div>
              <span>Memproses...</span>
            </div>
          )}
        </div>

        {error && (
          <div className="mx-4 mt-3 px-4 py-3 rounded-xl text-sm flex items-start gap-2 msg-appear" style={{background:'rgba(239,68,68,0.1)',border:'1px solid rgba(239,68,68,0.2)',color:'#f87171'}}>
            <span className="font-bold flex-shrink-0">!</span>
            <span className="flex-1">{error}</span>
            <button onClick={function() { setError(''); }} className="flex-shrink-0 hover:opacity-100 opacity-60 transition-opacity">
              <SvgX />
            </button>
          </div>
        )}

        <InputBar onSend={sendMsg} disabled={loading} apiKey={apiKey} />
      </div>

      {confirm && <ConfirmModal onOk={doClear} onCancel={function() { setConfirm(false); }} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
<script>
(function() {
  function checkMobile() {
    var btn = document.getElementById('mob-btn');
    if (btn) btn.style.display = window.innerWidth <= 768 ? 'block' : 'none';
  }
  window.addEventListener('resize', checkMobile);
  window.addEventListener('load', checkMobile);
})();
</script>

</body>
</html>
